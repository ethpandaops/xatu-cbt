name: test-glamsterdam-devnet-7
on:
  pull_request:
  workflow_dispatch:
    inputs:
      xatu_ref:
        description: 'Xatu repository ref to checkout'
        required: false
        default: 'release/glamsterdam-devnet-7'
        type: string
permissions:
  contents: read
jobs:
  detect:
    name: Detect impacted models
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.detect.outputs.models }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect impacted models
        id: detect
        run: |
          IMPACTED=$(./.github/scripts/detect_impacted_models.sh --network glamsterdam-devnet-7 --base origin/${{ github.base_ref || 'master' }})
          echo "models=$IMPACTED" >> "$GITHUB_OUTPUT"
          echo "Impacted models: $IMPACTED"
  run-tests:
    name: Test glamsterdam-devnet-7
    needs: detect
    if: needs.detect.outputs.models != 'none'
    runs-on:
      - self-hosted-ghr
      - size-l-x64
    env:
      # Must match the Checkout Xatu ref below. Passed as --xatu-ref because the
      # CLI defaults to master and force-resets the existing checkout to it.
      XATU_REF: ${{ github.event.inputs.xatu_ref || 'release/glamsterdam-devnet-7' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up env
        run: |
          cp example.env .env
      - name: Checkout Xatu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ethpandaops/xatu
          ref: ${{ env.XATU_REF }}
          path: xatu
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.24'
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build xatu-cbt
        run: make build
      - name: Create cache directory
        run: mkdir -p .parquet_cache
      - name: Start infrastructure
        id: start-infra
        run: ./bin/xatu-cbt infra start --xatu-ref "$XATU_REF"
      - name: Run glamsterdam-devnet-7 tests (full suite)
        if: needs.detect.outputs.models == 'all'
        run: ./bin/xatu-cbt test all --network glamsterdam-devnet-7 --verbose --xatu-ref "$XATU_REF"
      - name: Run glamsterdam-devnet-7 tests (impacted only)
        if: needs.detect.outputs.models != 'all'
        run: |
          echo "Running impacted models: ${{ needs.detect.outputs.models }}"
          ./bin/xatu-cbt test models ${{ needs.detect.outputs.models }} --network glamsterdam-devnet-7 --verbose --xatu-ref "$XATU_REF"
      - name: Stop infrastructure
        if: always() && steps.start-infra.outcome != 'skipped'
        run: ./bin/xatu-cbt infra stop
