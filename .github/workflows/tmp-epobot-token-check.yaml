name: TEMP EPOBOT_TOKEN check

# Temporary: proves EPOBOT_TOKEN is available to xatu-cbt and can create and
# delete a branch. Removed before merge.

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-epobot-token-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check EPOBOT_TOKEN
        env:
          TOKEN: ${{ secrets.EPOBOT_TOKEN }}
          # Control: an org secret docker.yml already reads in this repository.
          MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}
          REPO: ${{ github.repository }}
          REF: tmp/epobot-token-check-${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "event: ${GITHUB_EVENT_NAME}; IMAGE_MIRROR_URL is ${#MIRROR_URL} characters"
          if [ -z "$TOKEN" ]; then
            echo "::error::EPOBOT_TOKEN is empty in ${REPO}"
            exit 1
          fi
          echo "EPOBOT_TOKEN is non-empty (${#TOKEN} characters)"
          export GH_TOKEN="$TOKEN"
          echo "token user: $(gh api user --jq .login)"
          echo "private *-devnets repos visible: $(gh api --paginate 'orgs/ethpandaops/repos?type=private&per_page=100' --jq '.[] | select(.name | endswith("-devnets")) | .name' | tr '\n' ' ')"
          sha=$(gh api "repos/${REPO}/git/ref/heads/master" --jq .object.sha)
          gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/heads/${REF}" -f "sha=${sha}" --jq '"created " + .ref + " at " + .object.sha'
          gh api "repos/${REPO}/git/ref/heads/${REF}" --jq '"read back " + .ref + " at " + .object.sha'
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${REF}"
          if gh api "repos/${REPO}/git/ref/heads/${REF}" >/dev/null 2>&1; then
            echo "::error::${REF} still exists"
            exit 1
          fi
          echo "deleted ${REF}; it no longer resolves"
