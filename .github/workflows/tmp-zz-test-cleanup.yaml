name: TEMP release/zz-test GHCR cleanup

# Temporary: removes the image the release/zz-test end-to-end test pushed to
# GHCR and points the cbt-debian-latest tags it moved back at master's image.
# Removed before merge.

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-zz-test-cleanup.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: ghcr.io/ethpandaops/xatu-cbt
      # master-a756fc6, which held cbt-debian-latest before the test.
      MASTER_DIGEST: sha256:73191edba423ea5d58d9dfe46502b7ce9d3c9a9ba8d7464737c848e9f6cabeea
    steps:
      - name: Install regctl
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"; mkdir -p "$bin"
          curl -fsSL -o "$bin/regctl" https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $bin/regctl" | sha256sum -c --quiet -
          chmod +x "$bin/regctl"; echo "$bin" >> "$GITHUB_PATH"

      - name: Clean up
        run: |
          set -euo pipefail
          regctl registry login ghcr.io -u x-access-token --pass-stdin <<<"$GH_TOKEN" >/dev/null
          test_digest=$(regctl image digest "${SRC}:release-zz-test")
          echo "release-zz-test is ${test_digest}"
          [ "$test_digest" != "$MASTER_DIGEST" ] || { echo "::error::release-zz-test is master's image"; exit 1; }
          children() { regctl manifest get "${SRC}@$1" --format raw-body | jq -r '(.manifests // [])[].digest'; }
          master_children=$(children "$MASTER_DIGEST")

          for tag in cbt-debian-latest cbt-debian-latest-d991671cd453; do
            echo "${tag}: $(regctl image digest "${SRC}:${tag}") -> ${MASTER_DIGEST}"
            regctl image copy "${SRC}@${MASTER_DIGEST}" "${SRC}:${tag}"
          done

          versions=$(gh api --paginate "orgs/ethpandaops/packages/container/xatu-cbt/versions?per_page=100" \
            --jq '.[] | "\(.id) \(.name) \(.metadata.container.tags | join(","))"')
          for d in "$test_digest" $(children "$test_digest"); do
            if grep -qxF "$d" <<<"$master_children"; then echo "keeping shared ${d}"; continue; fi
            id=$(awk -v d="$d" '$2 == d {print $1}' <<<"$versions")
            [ -n "$id" ] || { echo "no package version for ${d}"; continue; }
            echo "deleting version ${id}: $(awk -v d="$d" '$2 == d' <<<"$versions")"
            gh api -X DELETE "orgs/ethpandaops/packages/container/xatu-cbt/versions/${id}"
          done

          for tag in release-zz-test cbt-debian-latest cbt-debian-latest-d991671cd453 master-a756fc6 latest; do
            echo "${tag}: $(regctl image digest "${SRC}:${tag}" 2>&1 || true)"
          done
