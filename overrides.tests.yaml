# Testing overrides - merged on top of auto-generated defaults.
# Auto-generated defaults: external models get lag=0, scheduled models get
# schedule="@every 5s", incremental models get forwardfill/backfill="@every 5s".
# Only add entries here when you need to deviate from those defaults.
# docs: https://github.com/ethpandaops/cbt?tab=readme-ov-file#model-overrides
models:
  overrides:
    # Stagger transformation schedules to ensure deps initialize first
    # int_ models (intermediate) should run before fct_ models (final)
    int_attestation_first_seen:
      config:
        schedules:
          forwardfill: "@every 2s"
          backfill: "@every 2s"
    fct_attestation_observation_by_node:
      config:
        schedules:
          forwardfill: "@every 10s"
          backfill: "@every 10s"
    # Wait for the first dim_client_release and dim_client_commit runs (they fetch every client's tags and commits from GitHub).
    int_block_graffiti_release:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    # These resolve versions through dim_client_release and dim_client_commit, so they wait for their first runs.
    fct_peer_count_by_cl_client_daily:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    fct_peer_count_by_el_client_daily:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    fct_peer_fork_readiness_by_cl_client_daily:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    fct_peer_fork_readiness_by_el_client_daily:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    fct_custody_probe_by_client_daily:
      config:
        schedules:
          forwardfill: "@every 90s"
          backfill: "@every 90s"
    # The custody availability rollups are scheduled and recount from the table below them, so each starts after the
    # one below it has filled.
    fct_data_column_availability_by_epoch:
      config:
        schedule: "@every 60s"
    fct_data_column_availability_by_slot_blob:
      config:
        schedule: "@every 60s"
    fct_data_column_availability_hourly:
      config:
        schedule: "@every 90s"
    fct_data_column_availability_daily:
      config:
        schedule: "@every 90s"
