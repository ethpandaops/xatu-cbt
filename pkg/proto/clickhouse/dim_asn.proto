syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Autonomous systems our consensus peers were on, residential and hosting, with organisation, provider and network type as of the last day they had peers.
message DimAsn {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Autonomous system number of the address, 0 when unknown
  uint32 autonomous_system_number = 12;
  // Autonomous system organisation on the last day it had peers
  string autonomous_system_organization = 13;
  // Network operator: one name for providers that span several autonomous systems or organisation names (Amazon, Google, Microsoft, Alibaba, Oracle, OVHcloud, Hetzner, Contabo, Akamai, Tencent), else the organisation without its legal suffix, empty when unknown
  string provider = 14;
  // hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs)
  string network_type = 15;
  // Last day our consensus peers were on the autonomous system
  string last_seen_date = 16;
}

// Request for listing dim_asn records
message ListDimAsnRequest {
  // Filter by autonomous_system_number - Autonomous system number of the address, 0 when unknown (PRIMARY KEY - required)
  UInt32Filter autonomous_system_number = 1;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2;
  // Filter by autonomous_system_organization - Autonomous system organisation on the last day it had peers (optional)
  StringFilter autonomous_system_organization = 3;
  // Filter by provider - Network operator: one name for providers that span several autonomous systems or organisation names (Amazon, Google, Microsoft, Alibaba, Oracle, OVHcloud, Hetzner, Contabo, Akamai, Tencent), else the organisation without its legal suffix, empty when unknown (optional)
  StringFilter provider = 4;
  // Filter by network_type - hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs) (optional)
  StringFilter network_type = 5;
  // Filter by last_seen_date - Last day our consensus peers were on the autonomous system (optional)
  StringFilter last_seen_date = 6;

  // The maximum number of dim_asn to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7;
  // A page token, received from a previous `ListDimAsn` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9;
}

// Response for listing dim_asn records
message ListDimAsnResponse {
  // The list of dim_asn.
  repeated DimAsn dim_asn = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single dim_asn record by primary key
message GetDimAsnRequest {
  // Autonomous system number of the address, 0 when unknown
  uint32 autonomous_system_number = 1; // Primary key (required)
}

// Response for getting a single dim_asn record
message GetDimAsnResponse {
  DimAsn item = 1;
}

// Query dim_asn data
service DimAsnService {
  // List records | Autonomous systems our consensus peers were on, residential and hosting, with organisation, provider and network type as of the last day they had peers.
  rpc List(ListDimAsnRequest) returns (ListDimAsnResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetDimAsnRequest) returns (GetDimAsnResponse);
}
