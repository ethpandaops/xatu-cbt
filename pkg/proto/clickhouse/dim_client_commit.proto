syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Commits on each client default and release branches since 2020, with the release each builds on, so graffiti commits from builds between tags resolve to a version

message DimClientCommit {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Client name as used by fct_block_graffiti, e.g. prysm or geth
  string client = 12;
  // Client layer: consensus or execution
  string layer = 13;
  // GitHub repository of the commit
  string repository = 14;
  // Full commit hash
  string commit_sha = 15;
  // Committer date of the commit
  uint32 commit_date = 16;
  // Release tag the commit builds on: the tag reachable in the fewest parent steps, as git describe picks it, empty before the first tag or when that tag was committed over 120 days before the commit (a branch without recent tags, e.g. erigon main)
  string base_tag = 17;
  // Version of base_tag, as in dim_client_release
  string base_version = 18;
  // Parent steps along the shortest path from the commit to base_tag, 0 for a tagged commit
  uint32 commits_since_base = 19;
  // Whether a release tag of the client points at this commit
  bool is_tagged = 20;
}

// Request for listing dim_client_commit records
message ListDimClientCommitRequest {
  // Filter by client - Client name as used by fct_block_graffiti, e.g. prysm or geth (PRIMARY KEY - required)
  StringFilter client = 1;

  // Filter by commit_sha - Full commit hash (ORDER BY column 2 - optional)
  StringFilter commit_sha = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by layer - Client layer: consensus or execution (optional)
  StringFilter layer = 4;
  // Filter by repository - GitHub repository of the commit (optional)
  StringFilter repository = 5;
  // Filter by commit_date - Committer date of the commit (optional)
  UInt32Filter commit_date = 6;
  // Filter by base_tag - Release tag the commit builds on: the tag reachable in the fewest parent steps, as git describe picks it, empty before the first tag or when that tag was committed over 120 days before the commit (a branch without recent tags, e.g. erigon main) (optional)
  StringFilter base_tag = 7;
  // Filter by base_version - Version of base_tag, as in dim_client_release (optional)
  StringFilter base_version = 8;
  // Filter by commits_since_base - Parent steps along the shortest path from the commit to base_tag, 0 for a tagged commit (optional)
  UInt32Filter commits_since_base = 9;
  // Filter by is_tagged - Whether a release tag of the client points at this commit (optional)
  BoolFilter is_tagged = 10;

  // The maximum number of dim_client_commit to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11;
  // A page token, received from a previous `ListDimClientCommit` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13;
}

// Response for listing dim_client_commit records
message ListDimClientCommitResponse {
  // The list of dim_client_commit.
  repeated DimClientCommit dim_client_commit = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single dim_client_commit record by primary key
message GetDimClientCommitRequest {
  // Client name as used by fct_block_graffiti, e.g. prysm or geth
  string client = 1; // Primary key (required)
}

// Response for getting a single dim_client_commit record
message GetDimClientCommitResponse {
  DimClientCommit item = 1;
}

// Query dim_client_commit data
service DimClientCommitService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListDimClientCommitRequest) returns (ListDimClientCommitResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetDimClientCommitRequest) returns (GetDimClientCommitResponse);
}
