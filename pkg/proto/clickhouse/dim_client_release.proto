syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Consensus and execution client release tags and the commits they point at, for resolving graffiti commit prefixes to versions

message DimClientRelease {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Client name as used by fct_block_graffiti, e.g. lighthouse or geth
  string client = 12;
  // Client layer: consensus or execution
  string layer = 13;
  // Release version taken from the tag, e.g. v8.2.3
  string version = 14;
  // Git tag of the release in the client repository
  string tag = 15;
  // Full commit hash the release tag points at, which graffiti commit prefixes resolve against
  string commit_sha = 16;
  // When the GitHub release was published, NULL when unknown
  google.protobuf.UInt32Value release_date = 17;
  // Whether the release is a pre-release (GitHub flag, or a pre-release suffix on the version)
  bool prerelease = 18;
  // GitHub repository the release tags come from, e.g. sigp/lighthouse
  string repository = 19;
}

// Request for listing dim_client_release records
message ListDimClientReleaseRequest {
  // Filter by client - Client name as used by fct_block_graffiti, e.g. lighthouse or geth (PRIMARY KEY - required)
  StringFilter client = 1;

  // Filter by commit_sha - Full commit hash the release tag points at, which graffiti commit prefixes resolve against (ORDER BY column 2 - optional)
  StringFilter commit_sha = 2;

  // Filter by tag - Git tag of the release in the client repository (ORDER BY column 3 - optional)
  StringFilter tag = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by layer - Client layer: consensus or execution (optional)
  StringFilter layer = 5;
  // Filter by version - Release version taken from the tag, e.g. v8.2.3 (optional)
  StringFilter version = 6;
  // Filter by release_date - When the GitHub release was published, NULL when unknown (optional)
  NullableUInt32Filter release_date = 7;
  // Filter by prerelease - Whether the release is a pre-release (GitHub flag, or a pre-release suffix on the version) (optional)
  BoolFilter prerelease = 8;
  // Filter by repository - GitHub repository the release tags come from, e.g. sigp/lighthouse (optional)
  StringFilter repository = 9;

  // The maximum number of dim_client_release to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10;
  // A page token, received from a previous `ListDimClientRelease` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12;
}

// Response for listing dim_client_release records
message ListDimClientReleaseResponse {
  // The list of dim_client_release.
  repeated DimClientRelease dim_client_release = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single dim_client_release record by primary key
message GetDimClientReleaseRequest {
  // Client name as used by fct_block_graffiti, e.g. lighthouse or geth
  string client = 1; // Primary key (required)
}

// Response for getting a single dim_client_release record
message GetDimClientReleaseResponse {
  DimClientRelease item = 1;
}

// Query dim_client_release data
service DimClientReleaseService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListDimClientReleaseRequest) returns (ListDimClientReleaseResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetDimClientReleaseRequest) returns (GetDimClientReleaseResponse);
}
