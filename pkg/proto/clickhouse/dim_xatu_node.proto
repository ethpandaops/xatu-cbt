syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Maps every Xatu node name to a stable node: hashed names that rotate on beacon node restarts are chained into one node. Count uniqExact(stable_node_id) to count Xatu nodes
message DimXatuNode {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Name of the Xatu node as reported, e.g. pub-asn-city/<user>/hashed-<id>. Join key for the by_node tables
  string meta_client_name = 12;
  // The Xatu node this name belongs to: the meta_client_name of the first ID in its chain. Hashed IDs change when the beacon node's p2p key changes (every restart on nimbus without --netkey-file). IDs with the same username and consensus client chain when one starts in or after the hour the previous one was last seen. IDs active at the same time stay separate. Named IDs map to themselves
  string stable_node_id = 13;
  // Contributor username of the Xatu node
  string username = 14;
  // Consensus client of the Xatu node at its latest observation
  string meta_consensus_implementation = 15;
  // Start of the first hour this name reported a block
  uint32 first_seen_date_time = 16;
  // Start of the latest hour this name reported a block
  uint32 last_seen_date_time = 17;
}

// Request for listing dim_xatu_node records
message ListDimXatuNodeRequest {
  // Filter by meta_client_name - Name of the Xatu node as reported, e.g. pub-asn-city/<user>/hashed-<id>. Join key for the by_node tables (PRIMARY KEY - required)
  StringFilter meta_client_name = 1;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2;
  // Filter by stable_node_id - The Xatu node this name belongs to: the meta_client_name of the first ID in its chain. Hashed IDs change when the beacon node's p2p key changes (every restart on nimbus without --netkey-file). IDs with the same username and consensus client chain when one starts in or after the hour the previous one was last seen. IDs active at the same time stay separate. Named IDs map to themselves (optional)
  StringFilter stable_node_id = 3;
  // Filter by username - Contributor username of the Xatu node (optional)
  StringFilter username = 4;
  // Filter by meta_consensus_implementation - Consensus client of the Xatu node at its latest observation (optional)
  StringFilter meta_consensus_implementation = 5;
  // Filter by first_seen_date_time - Start of the first hour this name reported a block (optional)
  UInt32Filter first_seen_date_time = 6;
  // Filter by last_seen_date_time - Start of the latest hour this name reported a block (optional)
  UInt32Filter last_seen_date_time = 7;

  // The maximum number of dim_xatu_node to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8;
  // A page token, received from a previous `ListDimXatuNode` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10;
}

// Response for listing dim_xatu_node records
message ListDimXatuNodeResponse {
  // The list of dim_xatu_node.
  repeated DimXatuNode dim_xatu_node = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single dim_xatu_node record by primary key
message GetDimXatuNodeRequest {
  // Name of the Xatu node as reported, e.g. pub-asn-city/<user>/hashed-<id>. Join key for the by_node tables
  string meta_client_name = 1; // Primary key (required)
}

// Response for getting a single dim_xatu_node record
message GetDimXatuNodeResponse {
  DimXatuNode item = 1;
}

// Query dim_xatu_node data
service DimXatuNodeService {
  // List records | Maps every Xatu node name to a stable node: hashed names that rotate on beacon node restarts are chained into one node. Count uniqExact(stable_node_id) to count Xatu nodes
  rpc List(ListDimXatuNodeRequest) returns (ListDimXatuNodeResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetDimXatuNodeRequest) returns (GetDimXatuNodeResponse);
}
