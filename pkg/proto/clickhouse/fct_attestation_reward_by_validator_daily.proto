syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Attestation rewards and penalties per validator per day

message FctAttestationRewardByValidatorDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // The index of the validator
  uint32 validator_index = 13;
  // Epochs of the day the validator was active (had an attestation reward)
  uint32 epoch_count = 14;
  // Head vote reward in Gwei
  int64 head = 15;
  // Target vote reward in Gwei (negative when penalised)
  int64 target = 16;
  // Source vote reward in Gwei (negative when penalised)
  int64 source = 17;
  // Inclusion delay reward in Gwei (phase0 only, 0 from Altair)
  int64 inclusion_delay = 18;
  // Inactivity penalty in Gwei
  int64 inactivity = 19;
  // head + target + source + inclusion_delay + inactivity in Gwei
  int64 total = 20;
  // Sum of the negative components in Gwei
  int64 penalty = 21;
  // Epochs with any negative component
  uint32 penalized_epoch_count = 22;
}

// Request for listing fct_attestation_reward_by_validator_daily records
message ListFctAttestationRewardByValidatorDailyRequest {
  // Filter by validator_index - The index of the validator (PRIMARY KEY - required)
  UInt32Filter validator_index = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by day_start_date - The day (UTC) (ORDER BY column 2 - optional)
  StringFilter day_start_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_count - Epochs of the day the validator was active (had an attestation reward) (optional)
  UInt32Filter epoch_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by head - Head vote reward in Gwei (optional)
  Int64Filter head = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by target - Target vote reward in Gwei (negative when penalised) (optional)
  Int64Filter target = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by source - Source vote reward in Gwei (negative when penalised) (optional)
  Int64Filter source = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by inclusion_delay - Inclusion delay reward in Gwei (phase0 only, 0 from Altair) (optional)
  Int64Filter inclusion_delay = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by inactivity - Inactivity penalty in Gwei (optional)
  Int64Filter inactivity = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total - head + target + source + inclusion_delay + inactivity in Gwei (optional)
  Int64Filter total = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by penalty - Sum of the negative components in Gwei (optional)
  Int64Filter penalty = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by penalized_epoch_count - Epochs with any negative component (optional)
  UInt32Filter penalized_epoch_count = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_attestation_reward_by_validator_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctAttestationRewardByValidatorDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_attestation_reward_by_validator_daily records
message ListFctAttestationRewardByValidatorDailyResponse {
  // The list of fct_attestation_reward_by_validator_daily.
  repeated FctAttestationRewardByValidatorDaily fct_attestation_reward_by_validator_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_attestation_reward_by_validator_daily record by primary key
message GetFctAttestationRewardByValidatorDailyRequest {
  // The index of the validator
  uint32 validator_index = 1; // Primary key (required)
}

// Response for getting a single fct_attestation_reward_by_validator_daily record
message GetFctAttestationRewardByValidatorDailyResponse {
  FctAttestationRewardByValidatorDaily item = 1;
}

// Query fct_attestation_reward_by_validator_daily data
service FctAttestationRewardByValidatorDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctAttestationRewardByValidatorDailyRequest) returns (ListFctAttestationRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_reward_by_validator_daily"
    };
  }
  // Get record | Retrieve a single record by validator_index
  rpc Get(GetFctAttestationRewardByValidatorDailyRequest) returns (GetFctAttestationRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_reward_by_validator_daily/{validator_index}"
    };
  }
}
