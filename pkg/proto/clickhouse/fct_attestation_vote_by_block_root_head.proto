syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Head votes per slot and voted block root, from real-time gossip and beacon API attestations of the unfinalized chain
message FctAttestationVoteByBlockRootHead {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot the attestations were for
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root the validators voted for as head, which can be a block from an earlier slot
  string block_root = 16;
  // The number of validators that voted for this block root as head in this slot
  uint32 vote_count = 17;
}

// Request for listing fct_attestation_vote_by_block_root_head records
message ListFctAttestationVoteByBlockRootHeadRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The beacon block root the validators voted for as head, which can be a block from an earlier slot (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot the attestations were for (optional)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by vote_count - The number of validators that voted for this block root as head in this slot (optional)
  UInt32Filter vote_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_attestation_vote_by_block_root_head to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctAttestationVoteByBlockRootHead` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_attestation_vote_by_block_root_head records
message ListFctAttestationVoteByBlockRootHeadResponse {
  // The list of fct_attestation_vote_by_block_root_head.
  repeated FctAttestationVoteByBlockRootHead fct_attestation_vote_by_block_root_head = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_attestation_vote_by_block_root_head record by primary key
message GetFctAttestationVoteByBlockRootHeadRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_attestation_vote_by_block_root_head record
message GetFctAttestationVoteByBlockRootHeadResponse {
  FctAttestationVoteByBlockRootHead item = 1;
}

// Query fct_attestation_vote_by_block_root_head data
service FctAttestationVoteByBlockRootHeadService {
  // List records | Head votes per slot and voted block root, from real-time gossip and beacon API attestations of the unfinalized chain
  rpc List(ListFctAttestationVoteByBlockRootHeadRequest) returns (ListFctAttestationVoteByBlockRootHeadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_by_block_root_head"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctAttestationVoteByBlockRootHeadRequest) returns (GetFctAttestationVoteByBlockRootHeadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_by_block_root_head/{slot_start_date_time}"
    };
  }
}
