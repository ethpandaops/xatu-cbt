syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily attestation liveness, vote correctness and inclusion per entity group on the finalized chain: the sum of the member entities in fct_attestation_vote_correctness_by_entity_daily. Only entities in a group have rows
message FctAttestationVoteCorrectnessByEntityGroupDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Group of staking entities run under one protocol: lido is every entity whose name contains lido (lido itself, the curated *_lido operators, the csm_operator*_lido Community Staking operators and the lidox* Simple DVT clusters)
  string entity_group = 13;
  // Entities of the group with attestation duties in the day
  uint32 entity_count = 14;
  // Attestation duties
  uint64 total_duties = 15;
  // Attestations included on the finalized chain
  uint64 attested_count = 16;
  // Attestations missed: duties with no attestation included on the finalized chain
  uint64 missed_count = 17;
  // Head votes that were correct
  uint64 head_correct_count = 18;
  // Target votes that were correct
  uint64 target_correct_count = 19;
  // Source votes that were correct, from attestations seen on gossip
  uint64 source_correct_count = 20;
  // Mean inclusion distance in slots per included attestation, NULL when there were none
  google.protobuf.DoubleValue avg_inclusion_distance = 21;
}

// Request for listing fct_attestation_vote_correctness_by_entity_group_daily records
message ListFctAttestationVoteCorrectnessByEntityGroupDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity_group - Group of staking entities run under one protocol: lido is every entity whose name contains lido (lido itself, the curated *_lido operators, the csm_operator*_lido Community Staking operators and the lidox* Simple DVT clusters) (ORDER BY column 2 - optional)
  StringFilter entity_group = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by entity_count - Entities of the group with attestation duties in the day (optional)
  UInt32Filter entity_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total_duties - Attestation duties (optional)
  UInt64Filter total_duties = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attested_count - Attestations included on the finalized chain (optional)
  UInt64Filter attested_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_count - Attestations missed: duties with no attestation included on the finalized chain (optional)
  UInt64Filter missed_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by head_correct_count - Head votes that were correct (optional)
  UInt64Filter head_correct_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by target_correct_count - Target votes that were correct (optional)
  UInt64Filter target_correct_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by source_correct_count - Source votes that were correct, from attestations seen on gossip (optional)
  UInt64Filter source_correct_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_inclusion_distance - Mean inclusion distance in slots per included attestation, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_inclusion_distance = 11 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_attestation_vote_correctness_by_entity_group_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctAttestationVoteCorrectnessByEntityGroupDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_attestation_vote_correctness_by_entity_group_daily records
message ListFctAttestationVoteCorrectnessByEntityGroupDailyResponse {
  // The list of fct_attestation_vote_correctness_by_entity_group_daily.
  repeated FctAttestationVoteCorrectnessByEntityGroupDaily fct_attestation_vote_correctness_by_entity_group_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_attestation_vote_correctness_by_entity_group_daily record by primary key
message GetFctAttestationVoteCorrectnessByEntityGroupDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_attestation_vote_correctness_by_entity_group_daily record
message GetFctAttestationVoteCorrectnessByEntityGroupDailyResponse {
  FctAttestationVoteCorrectnessByEntityGroupDaily item = 1;
}

// Query fct_attestation_vote_correctness_by_entity_group_daily data
service FctAttestationVoteCorrectnessByEntityGroupDailyService {
  // List records | Daily attestation liveness, vote correctness and inclusion per entity group on the finalized chain: the sum of the member entities in fct_attestation_vote_correctness_by_entity_daily. Only entities in a group have rows
  rpc List(ListFctAttestationVoteCorrectnessByEntityGroupDailyRequest) returns (ListFctAttestationVoteCorrectnessByEntityGroupDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_correctness_by_entity_group_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctAttestationVoteCorrectnessByEntityGroupDailyRequest) returns (GetFctAttestationVoteCorrectnessByEntityGroupDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_correctness_by_entity_group_daily/{day_start_date}"
    };
  }
}
