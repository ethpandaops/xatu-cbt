syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Hourly attestation liveness, vote correctness and inclusion per staking entity on the finalized chain. Duties are total_duties = attested_count + missed_count. Validators map to their current entity in dim_node, and validators it does not name are unknown, so the rows of an hour sum to the whole network
message FctAttestationVoteCorrectnessByEntityHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour period
  uint32 hour_start_date_time = 12;
  // Staking entity of the validators in dim_node, or unknown
  string entity = 13;
  // Validators of the entity with attestation duties in the hour
  uint32 validator_count = 14;
  // Attestation duties
  uint64 total_duties = 15;
  // Attestations included on the finalized chain
  uint64 attested_count = 16;
  // Attestations missed: duties with no attestation included on the finalized chain
  uint64 missed_count = 17;
  // Head votes that were correct
  uint64 head_correct_count = 18;
  // Target votes that were correct
  uint64 target_correct_count = 19;
  // Source votes that were correct, from attestations seen on gossip
  uint64 source_correct_count = 20;
  // Mean inclusion distance in slots per included attestation, NULL when there were none
  google.protobuf.DoubleValue avg_inclusion_distance = 21;
}

// Request for listing fct_attestation_vote_correctness_by_entity_hourly records
message ListFctAttestationVoteCorrectnessByEntityHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour period (PRIMARY KEY - required unless using alternatives: entity)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity - Staking entity of the validators in dim_node, or unknown (ORDER BY column 2 - optional)
  StringFilter entity = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by validator_count - Validators of the entity with attestation duties in the hour (optional)
  UInt32Filter validator_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total_duties - Attestation duties (optional)
  UInt64Filter total_duties = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attested_count - Attestations included on the finalized chain (optional)
  UInt64Filter attested_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_count - Attestations missed: duties with no attestation included on the finalized chain (optional)
  UInt64Filter missed_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by head_correct_count - Head votes that were correct (optional)
  UInt64Filter head_correct_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by target_correct_count - Target votes that were correct (optional)
  UInt64Filter target_correct_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by source_correct_count - Source votes that were correct, from attestations seen on gossip (optional)
  UInt64Filter source_correct_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_inclusion_distance - Mean inclusion distance in slots per included attestation, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_inclusion_distance = 11 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_attestation_vote_correctness_by_entity_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctAttestationVoteCorrectnessByEntityHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_attestation_vote_correctness_by_entity_hourly records
message ListFctAttestationVoteCorrectnessByEntityHourlyResponse {
  // The list of fct_attestation_vote_correctness_by_entity_hourly.
  repeated FctAttestationVoteCorrectnessByEntityHourly fct_attestation_vote_correctness_by_entity_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_attestation_vote_correctness_by_entity_hourly record by primary key
message GetFctAttestationVoteCorrectnessByEntityHourlyRequest {
  // Start of the hour period
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_attestation_vote_correctness_by_entity_hourly record
message GetFctAttestationVoteCorrectnessByEntityHourlyResponse {
  FctAttestationVoteCorrectnessByEntityHourly item = 1;
}

// Query fct_attestation_vote_correctness_by_entity_hourly data
service FctAttestationVoteCorrectnessByEntityHourlyService {
  // List records | Hourly attestation liveness, vote correctness and inclusion per staking entity on the finalized chain. Duties are total_duties = attested_count + missed_count. Validators map to their current entity in dim_node, and validators it does not name are unknown, so the rows of an hour sum to the whole network
  rpc List(ListFctAttestationVoteCorrectnessByEntityHourlyRequest) returns (ListFctAttestationVoteCorrectnessByEntityHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_correctness_by_entity_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctAttestationVoteCorrectnessByEntityHourlyRequest) returns (GetFctAttestationVoteCorrectnessByEntityHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_attestation_vote_correctness_by_entity_hourly/{hour_start_date_time}"
    };
  }
}
