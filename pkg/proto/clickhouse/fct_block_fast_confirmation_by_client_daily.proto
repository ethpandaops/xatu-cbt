  UInt32Filter slot_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by observation_count - Number of (canonical block, node) observations (optional)
  UInt32Filter observation_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by direct_count - Observations where the node emitted a fast confirmation event for the block itself (optional)
  UInt32Filter direct_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by descendant_count - Observations where the block was only confirmed through an event for a later block (optional)
  UInt32Filter descendant_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unconfirmed_count - Observations where the node did not fast confirm the block within 30 minutes (optional)
  UInt32Filter unconfirmed_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by orphaned_count - Fast confirmation events for blocks that did not become canonical (optional)
  UInt32Filter orphaned_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_fast_confirmation_ms - Average milliseconds from slot start to fast confirmation (optional)
  UInt32Filter avg_fast_confirmation_ms = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_fast_confirmation_ms - Minimum milliseconds from slot start to fast confirmation (optional)
  UInt32Filter min_fast_confirmation_ms = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_fast_confirmation_ms - Median milliseconds from slot start to fast confirmation (optional)
  UInt32Filter p50_fast_confirmation_ms = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p90_fast_confirmation_ms - 90th percentile milliseconds from slot start to fast confirmation (optional)
  UInt32Filter p90_fast_confirmation_ms = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_fast_confirmation_ms - 95th percentile milliseconds from slot start to fast confirmation (optional)
  UInt32Filter p95_fast_confirmation_ms = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p99_fast_confirmation_ms - 99th percentile milliseconds from slot start to fast confirmation (optional)
  UInt32Filter p99_fast_confirmation_ms = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_fast_confirmation_ms - Maximum milliseconds from slot start to fast confirmation (optional)
  UInt32Filter max_fast_confirmation_ms = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_finality_ms - Average milliseconds from slot start to finality (optional)
  UInt32Filter avg_finality_ms = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_finality_ms - Minimum milliseconds from slot start to finality (optional)
  UInt32Filter min_finality_ms = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_finality_ms - Median milliseconds from slot start to finality (optional)
  UInt32Filter p50_finality_ms = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_finality_ms - 95th percentile milliseconds from slot start to finality (optional)
  UInt32Filter p95_finality_ms = 21 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_finality_ms - Maximum milliseconds from slot start to finality (optional)
  UInt32Filter max_finality_ms = 22 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_speedup - Median per-block ratio of time to finality over time to fast confirmation (optional)
  google.protobuf.FloatValue p50_speedup = 23 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_fast_confirmation_by_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 24 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockFastConfirmationByClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 25 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 26 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_fast_confirmation_by_client_daily records
message ListFctBlockFastConfirmationByClientDailyResponse {
  // The list of fct_block_fast_confirmation_by_client_daily.
  repeated FctBlockFastConfirmationByClientDaily fct_block_fast_confirmation_by_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
