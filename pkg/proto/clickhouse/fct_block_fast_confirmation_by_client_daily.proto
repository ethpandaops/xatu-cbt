  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by meta_consensus_implementation - Consensus client implementation running the fast confirmation rule (ORDER BY column 2 - optional)
  StringFilter meta_consensus_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

