syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// One row per (block, fast confirmation node) with the time the node fast confirmed the block and the time the block was finalized.

message FctBlockFastConfirmationByNode {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number of the block
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root hash
  string block_root = 16;
  // Chain status of the block: canonical, or orphaned when a node fast confirmed a block that did not become canonical
  string status = 17;
  // Name of the sentry node that emitted the fast confirmation events
  string meta_client_name = 18;
  // Consensus client implementation running the fast confirmation rule
  string meta_consensus_implementation = 19;
  // Consensus client version running the fast confirmation rule
  string meta_consensus_version = 20;
  // How the block was fast confirmed: direct (an event for this block), descendant (only implied by an event for a later block), or unconfirmed (no confirmation seen within 30 minutes)
  string confirmation_type = 21;
  // Milliseconds from slot start until the node fast confirmed this block, directly or through a descendant
  google.protobuf.UInt32Value fast_confirmed_slot_start_diff = 22;
  // Slot of the block whose fast confirmation event first covered this block. Equals slot for direct confirmations
  google.protobuf.UInt32Value fast_confirmation_slot = 23;
  // Milliseconds from slot start until the first sentry observed a finalized checkpoint covering this block
  google.protobuf.UInt32Value finalized_slot_start_diff = 24;
  // Epoch of the finalized checkpoint that first covered this block
  google.protobuf.UInt32Value finalized_epoch = 25;
}

// Request for listing fct_block_fast_confirmation_by_node records
message ListFctBlockFastConfirmationByNodeRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by meta_client_name - Name of the sentry node that emitted the fast confirmation events (ORDER BY column 2 - optional)
  StringFilter meta_client_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by block_root - The beacon block root hash (ORDER BY column 3 - optional)
  StringFilter block_root = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number of the block (optional)
  UInt32Filter slot = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by status - Chain status of the block: canonical, or orphaned when a node fast confirmed a block that did not become canonical (optional)
  StringFilter status = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_implementation - Consensus client implementation running the fast confirmation rule (optional)
  StringFilter meta_consensus_implementation = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_version - Consensus client version running the fast confirmation rule (optional)
  StringFilter meta_consensus_version = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by confirmation_type - How the block was fast confirmed: direct (an event for this block), descendant (only implied by an event for a later block), or unconfirmed (no confirmation seen within 30 minutes) (optional)
  StringFilter confirmation_type = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by fast_confirmed_slot_start_diff - Milliseconds from slot start until the node fast confirmed this block, directly or through a descendant (optional)
  NullableUInt32Filter fast_confirmed_slot_start_diff = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by fast_confirmation_slot - Slot of the block whose fast confirmation event first covered this block. Equals slot for direct confirmations (optional)
  NullableUInt32Filter fast_confirmation_slot = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by finalized_slot_start_diff - Milliseconds from slot start until the first sentry observed a finalized checkpoint covering this block (optional)
  NullableUInt32Filter finalized_slot_start_diff = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by finalized_epoch - Epoch of the finalized checkpoint that first covered this block (optional)
  NullableUInt32Filter finalized_epoch = 15 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_fast_confirmation_by_node to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 16 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockFastConfirmationByNode` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 17 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 18 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_fast_confirmation_by_node records
message ListFctBlockFastConfirmationByNodeResponse {
  // The list of fct_block_fast_confirmation_by_node.
  repeated FctBlockFastConfirmationByNode fct_block_fast_confirmation_by_node = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_fast_confirmation_by_node record by primary key
message GetFctBlockFastConfirmationByNodeRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_fast_confirmation_by_node record
message GetFctBlockFastConfirmationByNodeResponse {
  FctBlockFastConfirmationByNode item = 1;
}

// Query fct_block_fast_confirmation_by_node data
service FctBlockFastConfirmationByNodeService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockFastConfirmationByNodeRequest) returns (ListFctBlockFastConfirmationByNodeResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_fast_confirmation_by_node"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctBlockFastConfirmationByNodeRequest) returns (GetFctBlockFastConfirmationByNodeResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_fast_confirmation_by_node/{slot_start_date_time}"
    };
  }
}
