syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Hourly block arrival across every Xatu node: the spread of the per-node medians in fct_block_first_seen_by_node_hourly, one row per hour
message FctBlockFirstSeenByNetworkHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The wall clock time at the start of the hour, by slot
  uint32 hour_start_date_time = 12;
  // Xatu nodes with a row in fct_block_first_seen_by_node_hourly for the hour
  uint32 node_count = 13;
  // Slots in the hour that at least one Xatu node saw a block in
  uint32 slot_count = 14;
  // 10th percentile across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks
  double p10_median_seen_slot_start_diff = 15;
  // Median across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks
  double p50_median_seen_slot_start_diff = 16;
  // 90th percentile across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks
  double p90_median_seen_slot_start_diff = 17;
}

// Request for listing fct_block_first_seen_by_network_hourly records
message ListFctBlockFirstSeenByNetworkHourlyRequest {
  // Filter by hour_start_date_time - The wall clock time at the start of the hour, by slot (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_count - Xatu nodes with a row in fct_block_first_seen_by_node_hourly for the hour (optional)
  UInt32Filter node_count = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_count - Slots in the hour that at least one Xatu node saw a block in (optional)
  UInt32Filter slot_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p10_median_seen_slot_start_diff - 10th percentile across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks (optional)
  google.protobuf.DoubleValue p10_median_seen_slot_start_diff = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_median_seen_slot_start_diff - Median across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks (optional)
  google.protobuf.DoubleValue p50_median_seen_slot_start_diff = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p90_median_seen_slot_start_diff - 90th percentile across nodes of each node median block arrival (p50_seen_slot_start_diff in fct_block_first_seen_by_node_hourly), in milliseconds from slot start. Every node weighs the same, linear interpolation between ranks (optional)
  google.protobuf.DoubleValue p90_median_seen_slot_start_diff = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_first_seen_by_network_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockFirstSeenByNetworkHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_first_seen_by_network_hourly records
message ListFctBlockFirstSeenByNetworkHourlyResponse {
  // The list of fct_block_first_seen_by_network_hourly.
  repeated FctBlockFirstSeenByNetworkHourly fct_block_first_seen_by_network_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_first_seen_by_network_hourly record by primary key
message GetFctBlockFirstSeenByNetworkHourlyRequest {
  // The wall clock time at the start of the hour, by slot
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_first_seen_by_network_hourly record
message GetFctBlockFirstSeenByNetworkHourlyResponse {
  FctBlockFirstSeenByNetworkHourly item = 1;
}

// Query fct_block_first_seen_by_network_hourly data
service FctBlockFirstSeenByNetworkHourlyService {
  // List records | Hourly block arrival across every Xatu node: the spread of the per-node medians in fct_block_first_seen_by_node_hourly, one row per hour
  rpc List(ListFctBlockFirstSeenByNetworkHourlyRequest) returns (ListFctBlockFirstSeenByNetworkHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_first_seen_by_network_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctBlockFirstSeenByNetworkHourlyRequest) returns (GetFctBlockFirstSeenByNetworkHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_first_seen_by_network_hourly/{hour_start_date_time}"
    };
  }
}
