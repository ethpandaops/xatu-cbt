syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Hourly canonical block counts per proposer entity and consensus and execution client pair named by block graffiti

message FctBlockGraffitiClientByEntityHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 12;
  // Staking entity of the proposer from dim_node, empty when the validator has none
  string entity = 13;
  // Consensus client named by the block graffiti, or unknown
  string consensus_client = 14;
  // Execution client named by the block graffiti, or unknown
  string execution_client = 15;
  // Number of canonical blocks in the hour from this entity with this consensus and execution client pair
  uint32 block_count = 16;
}

// Request for listing fct_block_graffiti_client_by_entity_hourly records
message ListFctBlockGraffitiClientByEntityHourlyRequest {
  // Filter by hour_start_date_time - The wall clock time at the start of the hour (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity - Staking entity of the proposer from dim_node, empty when the validator has none (ORDER BY column 2 - optional)
  StringFilter entity = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by consensus_client - Consensus client named by the block graffiti, or unknown (ORDER BY column 3 - optional)
  StringFilter consensus_client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_client - Execution client named by the block graffiti, or unknown (ORDER BY column 4 - optional)
  StringFilter execution_client = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of canonical blocks in the hour from this entity with this consensus and execution client pair (optional)
  UInt32Filter block_count = 6 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_graffiti_client_by_entity_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockGraffitiClientByEntityHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_graffiti_client_by_entity_hourly records
message ListFctBlockGraffitiClientByEntityHourlyResponse {
  // The list of fct_block_graffiti_client_by_entity_hourly.
  repeated FctBlockGraffitiClientByEntityHourly fct_block_graffiti_client_by_entity_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_graffiti_client_by_entity_hourly record by primary key
message GetFctBlockGraffitiClientByEntityHourlyRequest {
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_graffiti_client_by_entity_hourly record
message GetFctBlockGraffitiClientByEntityHourlyResponse {
  FctBlockGraffitiClientByEntityHourly item = 1;
}

// Query fct_block_graffiti_client_by_entity_hourly data
service FctBlockGraffitiClientByEntityHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockGraffitiClientByEntityHourlyRequest) returns (ListFctBlockGraffitiClientByEntityHourlyResponse) {
