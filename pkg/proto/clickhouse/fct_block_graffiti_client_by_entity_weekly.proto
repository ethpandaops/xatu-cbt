// Request for getting a single fct_block_graffiti_client_by_entity_weekly record by primary key
message GetFctBlockGraffitiClientByEntityWeeklyRequest {
  // Start of the week period (Monday, UTC)
  string week_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_block_graffiti_client_by_entity_weekly record
message GetFctBlockGraffitiClientByEntityWeeklyResponse {
  FctBlockGraffitiClientByEntityWeekly item = 1;
}

// Query fct_block_graffiti_client_by_entity_weekly data
service FctBlockGraffitiClientByEntityWeeklyService {
