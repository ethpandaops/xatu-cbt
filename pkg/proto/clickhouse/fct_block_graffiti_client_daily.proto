syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily canonical block counts per consensus and execution client pair named by block graffiti, including unknown

message FctBlockGraffitiClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client named by the block graffiti, or unknown
  string consensus_client = 13;
  // Execution client named by the block graffiti, or unknown
  string execution_client = 14;
  // Number of canonical blocks in the day with this consensus and execution client pair
  uint32 block_count = 15;
}

// Request for listing fct_block_graffiti_client_daily records
message ListFctBlockGraffitiClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by consensus_client - Consensus client named by the block graffiti, or unknown (ORDER BY column 2 - optional)
  StringFilter consensus_client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_client - Execution client named by the block graffiti, or unknown (ORDER BY column 3 - optional)
  StringFilter execution_client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of canonical blocks in the day with this consensus and execution client pair (optional)
  UInt32Filter block_count = 5 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_graffiti_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 6 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockGraffitiClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 7 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 8 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_graffiti_client_daily records
message ListFctBlockGraffitiClientDailyResponse {
  // The list of fct_block_graffiti_client_daily.
  repeated FctBlockGraffitiClientDaily fct_block_graffiti_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_graffiti_client_daily record by primary key
message GetFctBlockGraffitiClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_block_graffiti_client_daily record
message GetFctBlockGraffitiClientDailyResponse {
  FctBlockGraffitiClientDaily item = 1;
}

// Query fct_block_graffiti_client_daily data
service FctBlockGraffitiClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockGraffitiClientDailyRequest) returns (ListFctBlockGraffitiClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctBlockGraffitiClientDailyRequest) returns (GetFctBlockGraffitiClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_daily/{day_start_date}"
    };
  }
}
