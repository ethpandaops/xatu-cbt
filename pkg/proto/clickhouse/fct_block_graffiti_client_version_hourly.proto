syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Hourly canonical block counts per consensus and execution client release resolved from block graffiti. Each block counts once per layer. release_status: commit_match (the graffiti commit is a release tag commit), commit_untagged (a default or release branch commit between tags, version is the release it builds on), commit_ambiguous (the prefix matches several commits), commit_unmatched (no release or branch commit, a custom or fork build), commit_short (a 2 character commit), commit_zero (an all-zero commit), version_match or version_unmatched (a version string with no commit, matched to a release tag or not), codes_min (client codes without commits), no_commit (no version information) or none (unknown client). Unresolved rows have an empty version

message FctBlockGraffitiClientVersionHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour period
  uint32 hour_start_date_time = 12;
  // Client layer: consensus or execution
  string layer = 13;
  // Client named by the block graffiti, or unknown
  string client = 14;
  // Release version the graffiti resolves to, empty when unresolved
  string version = 15;
  // Commit prefix from the graffiti, lowercase, empty when there is none
  string commit_prefix = 16;
  // How the version was resolved, see the table comment for values
  string release_status = 17;
  // Number of canonical blocks with this client, version and release status
  uint32 block_count = 18;
}

// Request for listing fct_block_graffiti_client_version_hourly records
message ListFctBlockGraffitiClientVersionHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour period (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by layer - Client layer: consensus or execution (ORDER BY column 2 - optional)
  StringFilter layer = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Client named by the block graffiti, or unknown (ORDER BY column 3 - optional)
  StringFilter client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by version - Release version the graffiti resolves to, empty when unresolved (ORDER BY column 4 - optional)
  StringFilter version = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by commit_prefix - Commit prefix from the graffiti, lowercase, empty when there is none (ORDER BY column 5 - optional)
  StringFilter commit_prefix = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by release_status - How the version was resolved, see the table comment for values (ORDER BY column 6 - optional)
  StringFilter release_status = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of canonical blocks with this client, version and release status (optional)
  UInt32Filter block_count = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_graffiti_client_version_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockGraffitiClientVersionHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_graffiti_client_version_hourly records
message ListFctBlockGraffitiClientVersionHourlyResponse {
  // The list of fct_block_graffiti_client_version_hourly.
  repeated FctBlockGraffitiClientVersionHourly fct_block_graffiti_client_version_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_graffiti_client_version_hourly record by primary key
message GetFctBlockGraffitiClientVersionHourlyRequest {
  // Start of the hour period
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_graffiti_client_version_hourly record
message GetFctBlockGraffitiClientVersionHourlyResponse {
  FctBlockGraffitiClientVersionHourly item = 1;
}

// Query fct_block_graffiti_client_version_hourly data
service FctBlockGraffitiClientVersionHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockGraffitiClientVersionHourlyRequest) returns (ListFctBlockGraffitiClientVersionHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_version_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctBlockGraffitiClientVersionHourlyRequest) returns (GetFctBlockGraffitiClientVersionHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_version_hourly/{hour_start_date_time}"
    };
  }
}
