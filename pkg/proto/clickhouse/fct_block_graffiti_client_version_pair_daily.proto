syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily canonical block counts per consensus and execution client release pair resolved from block graffiti, each block counted once, with builds of one version from different commits together. release_status: commit_match (the graffiti commit is a release tag commit), commit_untagged (a default or release branch commit between tags, version is the release it builds on), commit_ambiguous (the prefix matches several commits), commit_unmatched (no release or branch commit, a custom or fork build), commit_short (a 2 character commit), commit_zero (an all-zero commit), version_match or version_unmatched (a version string with no commit, matched to a release tag or not), codes_min (client codes without commits), no_commit (no version information) or none (unknown client). An unresolved side keeps the version its graffiti states, or is empty when it states none
message FctBlockGraffitiClientVersionPairDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client named by the block graffiti, or unknown
  string consensus_client = 13;
  // Consensus client release version the graffiti resolves to, or the version it states when unresolved, empty when there is none
  string consensus_version = 14;
  // How the consensus client version was resolved, see the table comment for values
  string consensus_release_status = 15;
  // Execution client named by the block graffiti, or unknown
  string execution_client = 16;
  // Execution client release version the graffiti resolves to, or the version it states when unresolved, empty when there is none
  string execution_version = 17;
  // How the execution client version was resolved, see the table comment for values
  string execution_release_status = 18;
  // Number of canonical blocks with this consensus and execution client release pair
  uint32 block_count = 19;
}

// Request for listing fct_block_graffiti_client_version_pair_daily records
message ListFctBlockGraffitiClientVersionPairDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by consensus_client - Consensus client named by the block graffiti, or unknown (ORDER BY column 2 - optional)
  StringFilter consensus_client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_client - Execution client named by the block graffiti, or unknown (ORDER BY column 3 - optional)
  StringFilter execution_client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by consensus_version - Consensus client release version the graffiti resolves to, or the version it states when unresolved, empty when there is none (ORDER BY column 4 - optional)
  StringFilter consensus_version = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_version - Execution client release version the graffiti resolves to, or the version it states when unresolved, empty when there is none (ORDER BY column 5 - optional)
  StringFilter execution_version = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by consensus_release_status - How the consensus client version was resolved, see the table comment for values (ORDER BY column 6 - optional)
  StringFilter consensus_release_status = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_release_status - How the execution client version was resolved, see the table comment for values (ORDER BY column 7 - optional)
  StringFilter execution_release_status = 7 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of canonical blocks with this consensus and execution client release pair (optional)
  UInt32Filter block_count = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_graffiti_client_version_pair_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockGraffitiClientVersionPairDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_graffiti_client_version_pair_daily records
message ListFctBlockGraffitiClientVersionPairDailyResponse {
  // The list of fct_block_graffiti_client_version_pair_daily.
  repeated FctBlockGraffitiClientVersionPairDaily fct_block_graffiti_client_version_pair_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_graffiti_client_version_pair_daily record by primary key
message GetFctBlockGraffitiClientVersionPairDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_block_graffiti_client_version_pair_daily record
message GetFctBlockGraffitiClientVersionPairDailyResponse {
  FctBlockGraffitiClientVersionPairDaily item = 1;
}

// Query fct_block_graffiti_client_version_pair_daily data
service FctBlockGraffitiClientVersionPairDailyService {
  // List records | Daily canonical block counts per consensus and execution client release pair resolved from block graffiti, each block counted once, with builds of one version from different commits together. release_status: commit_match (the graffiti commit is a release tag commit), commit_untagged (a default or release branch commit between tags, version is the release it builds on), commit_ambiguous (the prefix matches several commits), commit_unmatched (no release or branch commit, a custom or fork build), commit_short (a 2 character commit), commit_zero (an all-zero commit), version_match or version_unmatched (a version string with no commit, matched to a release tag or not), codes_min (client codes without commits), no_commit (no version information) or none (unknown client). An unresolved side keeps the version its graffiti states, or is empty when it states none
  rpc List(ListFctBlockGraffitiClientVersionPairDailyRequest) returns (ListFctBlockGraffitiClientVersionPairDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_version_pair_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctBlockGraffitiClientVersionPairDailyRequest) returns (GetFctBlockGraffitiClientVersionPairDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_graffiti_client_version_pair_daily/{day_start_date}"
    };
  }
}
