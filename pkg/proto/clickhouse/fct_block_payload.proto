syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) per-block execution payload facts: the winning bid commitment joined with what the revealed envelope actually contained, replacing the pre-gloas execution columns that no longer exist on the beacon block

message FctBlockPayload {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number of the block the payload belongs to
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root of the beacon block the payload belongs to
  string block_root = 16;
  // The beacon block version, e.g. gloas
  string block_version = 17;
  // Validator index of the builder, equal to the block proposer index for self-built payloads
  uint64 builder_index = 18;
  // The execution block hash of the payload
  string block_hash = 19;
  // The parent execution block hash
  string parent_block_hash = 20;
  // The winning bid value in wei
  string value = 21;
  // The gas limit committed to in the bid
  uint64 gas_limit = 22;
  // Number of blob KZG commitments in the bid
  uint32 blob_kzg_commitment_count = 23;
  // Number of transactions in the revealed payload
  uint32 transactions_count = 24;
  // Total bytes of transactions in the revealed payload
  uint64 transactions_total_bytes = 25;
  // Sum of per-transaction gas limits in the revealed payload
  uint64 transactions_total_gas_limit = 26;
  // Number of type-3 blob transactions in the revealed payload
  uint32 blob_transactions_count = 27;
}

// Request for listing fct_block_payload records
message ListFctBlockPayloadRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The root of the beacon block the payload belongs to (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number of the block the payload belongs to (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_version - The beacon block version, e.g. gloas (optional)
  StringFilter block_version = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by builder_index - Validator index of the builder, equal to the block proposer index for self-built payloads (optional)
  UInt64Filter builder_index = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_hash - The execution block hash of the payload (optional)
  StringFilter block_hash = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by parent_block_hash - The parent execution block hash (optional)
  StringFilter parent_block_hash = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by value - The winning bid value in wei (optional)
  StringFilter value = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_limit - The gas limit committed to in the bid (optional)
  UInt64Filter gas_limit = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_kzg_commitment_count - Number of blob KZG commitments in the bid (optional)
  UInt32Filter blob_kzg_commitment_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by transactions_count - Number of transactions in the revealed payload (optional)
  UInt32Filter transactions_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by transactions_total_bytes - Total bytes of transactions in the revealed payload (optional)
  UInt64Filter transactions_total_bytes = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by transactions_total_gas_limit - Sum of per-transaction gas limits in the revealed payload (optional)
  UInt64Filter transactions_total_gas_limit = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_transactions_count - Number of type-3 blob transactions in the revealed payload (optional)
  UInt32Filter blob_transactions_count = 17 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_payload to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockPayload` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_payload records
message ListFctBlockPayloadResponse {
  // The list of fct_block_payload.
  repeated FctBlockPayload fct_block_payload = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_payload record by primary key
message GetFctBlockPayloadRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_payload record
message GetFctBlockPayloadResponse {
  FctBlockPayload item = 1;
}

// Query fct_block_payload data
service FctBlockPayloadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockPayloadRequest) returns (ListFctBlockPayloadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctBlockPayloadRequest) returns (GetFctBlockPayloadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload/{slot_start_date_time}"
    };
  }
}
