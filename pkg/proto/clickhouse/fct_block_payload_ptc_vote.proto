syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) Payload Timeliness Committee verdict per attested block: canonical on-chain aggregates unioned with orphaned blocks only seen on the live stream

message FctBlockPayloadPtcVote {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The attested slot number
  uint32 slot = 12;
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the attested slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root being attested by the PTC
  string block_root = 16;
  // The beacon block version of the containing block, empty for orphaned rows
  string block_version = 17;
  // Slot of the canonical block that included the payload attestations, null for orphaned rows
  google.protobuf.UInt32Value included_in_slot = 18;
  // Root of the canonical block that included the payload attestations, null for orphaned rows
  google.protobuf.StringValue included_in_block_root = 19;
  // Total PTC validators covered: on-chain aggregate counts for canonical rows, distinct validators seen on the live stream for orphaned rows
  uint32 ptc_validators = 20;
  // PTC validators attesting the payload was present
  uint32 payload_present_votes = 21;
  // PTC validators attesting blob data was available
  uint32 blob_data_available_votes = 22;
  // Whether the attested block is canonical or orphaned
  string status = 23;
}

// Request for listing fct_block_payload_ptc_vote records
message ListFctBlockPayloadPtcVoteRequest {
  // Filter by slot_start_date_time - The wall clock time when the attested slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The beacon block root being attested by the PTC (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The attested slot number (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - The epoch number containing the attested slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_version - The beacon block version of the containing block, empty for orphaned rows (optional)
  StringFilter block_version = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_in_slot - Slot of the canonical block that included the payload attestations, null for orphaned rows (optional)
  NullableUInt32Filter included_in_slot = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_in_block_root - Root of the canonical block that included the payload attestations, null for orphaned rows (optional)
  NullableStringFilter included_in_block_root = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by ptc_validators - Total PTC validators covered: on-chain aggregate counts for canonical rows, distinct validators seen on the live stream for orphaned rows (optional)
  UInt32Filter ptc_validators = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by payload_present_votes - PTC validators attesting the payload was present (optional)
  UInt32Filter payload_present_votes = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_data_available_votes - PTC validators attesting blob data was available (optional)
  UInt32Filter blob_data_available_votes = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by status - Whether the attested block is canonical or orphaned (optional)
  StringFilter status = 13 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_payload_ptc_vote to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockPayloadPtcVote` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_payload_ptc_vote records
message ListFctBlockPayloadPtcVoteResponse {
  // The list of fct_block_payload_ptc_vote.
  repeated FctBlockPayloadPtcVote fct_block_payload_ptc_vote = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_payload_ptc_vote record by primary key
message GetFctBlockPayloadPtcVoteRequest {
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_payload_ptc_vote record
message GetFctBlockPayloadPtcVoteResponse {
  FctBlockPayloadPtcVote item = 1;
}

// Query fct_block_payload_ptc_vote data
service FctBlockPayloadPtcVoteService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockPayloadPtcVoteRequest) returns (ListFctBlockPayloadPtcVoteResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_ptc_vote"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctBlockPayloadPtcVoteRequest) returns (GetFctBlockPayloadPtcVoteResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_ptc_vote/{slot_start_date_time}"
    };
  }
}
