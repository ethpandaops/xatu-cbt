syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) Payload Timeliness Committee votes per attested block, observed on the live beacon API event stream. Available at head without waiting for finalization.

message FctBlockPayloadPtcVoteHead {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The attested slot number
  uint32 slot = 12;
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the attested slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root being attested by the PTC
  string block_root = 16;
  // Distinct PTC validators whose payload attestation was seen on the live event stream
  uint32 ptc_validators_seen = 17;
  // Distinct PTC validators attesting the payload was present
  uint32 payload_present_votes = 18;
  // Distinct PTC validators attesting blob data was available
  uint32 blob_data_available_votes = 19;
  // Time from slot start that the first payload attestation was seen in ms
  uint32 first_seen_slot_start_diff = 20;
  // Time from slot start that the last payload attestation was seen in ms
  uint32 last_seen_slot_start_diff = 21;
}

// Request for listing fct_block_payload_ptc_vote_head records
message ListFctBlockPayloadPtcVoteHeadRequest {
  // Filter by slot_start_date_time - The wall clock time when the attested slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The beacon block root being attested by the PTC (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The attested slot number (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - The epoch number containing the attested slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by ptc_validators_seen - Distinct PTC validators whose payload attestation was seen on the live event stream (optional)
  UInt32Filter ptc_validators_seen = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by payload_present_votes - Distinct PTC validators attesting the payload was present (optional)
  UInt32Filter payload_present_votes = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_data_available_votes - Distinct PTC validators attesting blob data was available (optional)
  UInt32Filter blob_data_available_votes = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by first_seen_slot_start_diff - Time from slot start that the first payload attestation was seen in ms (optional)
  UInt32Filter first_seen_slot_start_diff = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by last_seen_slot_start_diff - Time from slot start that the last payload attestation was seen in ms (optional)
  UInt32Filter last_seen_slot_start_diff = 11 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_payload_ptc_vote_head to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockPayloadPtcVoteHead` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_payload_ptc_vote_head records
message ListFctBlockPayloadPtcVoteHeadResponse {
  // The list of fct_block_payload_ptc_vote_head.
  repeated FctBlockPayloadPtcVoteHead fct_block_payload_ptc_vote_head = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_payload_ptc_vote_head record by primary key
message GetFctBlockPayloadPtcVoteHeadRequest {
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_payload_ptc_vote_head record
message GetFctBlockPayloadPtcVoteHeadResponse {
  FctBlockPayloadPtcVoteHead item = 1;
}

// Query fct_block_payload_ptc_vote_head data
service FctBlockPayloadPtcVoteHeadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockPayloadPtcVoteHeadRequest) returns (ListFctBlockPayloadPtcVoteHeadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_ptc_vote_head"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctBlockPayloadPtcVoteHeadRequest) returns (GetFctBlockPayloadPtcVoteHeadResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_ptc_vote_head/{slot_start_date_time}"
    };
  }
}
