syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) hourly payload delivery outcomes judged by the PTC, for delivery-rate charts

message FctBlockPayloadStatusHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 12;
  // PTC verdict bucket: delivered or absent
  string status = 13;
  // Number of blocks with this payload outcome in the hour
  uint32 slot_count = 14;
}

// Request for listing fct_block_payload_status_hourly records
message ListFctBlockPayloadStatusHourlyRequest {
  // Filter by hour_start_date_time - The wall clock time at the start of the hour (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by status - PTC verdict bucket: delivered or absent (ORDER BY column 2 - optional)
  StringFilter status = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_count - Number of blocks with this payload outcome in the hour (optional)
  UInt32Filter slot_count = 4 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_payload_status_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 5 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockPayloadStatusHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 6 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_payload_status_hourly records
message ListFctBlockPayloadStatusHourlyResponse {
  // The list of fct_block_payload_status_hourly.
  repeated FctBlockPayloadStatusHourly fct_block_payload_status_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_payload_status_hourly record by primary key
message GetFctBlockPayloadStatusHourlyRequest {
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_payload_status_hourly record
message GetFctBlockPayloadStatusHourlyResponse {
  FctBlockPayloadStatusHourly item = 1;
}

// Query fct_block_payload_status_hourly data
service FctBlockPayloadStatusHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockPayloadStatusHourlyRequest) returns (ListFctBlockPayloadStatusHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_status_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctBlockPayloadStatusHourlyRequest) returns (GetFctBlockPayloadStatusHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_payload_status_hourly/{hour_start_date_time}"
    };
  }
}
