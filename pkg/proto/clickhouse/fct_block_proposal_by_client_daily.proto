syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily block proposals per consensus and execution client: blocks, MEV share and value, gas, blobs, first-seen propagation, orphaned blocks and missed slots. Canonical blocks use their own graffiti. Orphaned and missed proposals use the proposer most recent identifying graffiti from the previous 365 days.

message FctBlockProposalByClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Client layer: consensus or execution
  string layer = 13;
  // Proposer client from the block graffiti, or for orphaned blocks and missed slots from the proposer most recent identifying graffiti, else unknown
  string client = 14;
  // Canonical blocks proposed
  uint32 block_count = 15;
  // Canonical blocks delivered by an MEV relay, the rest were built locally
  uint32 mev_block_count = 16;
  // Mean relay-reported value of the MEV blocks in ETH, NULL when there were none
  google.protobuf.DoubleValue avg_mev_value_eth = 17;
  // Mean execution gas used per canonical block
  google.protobuf.DoubleValue avg_gas_used = 18;
  // Mean blobs per canonical block
  google.protobuf.DoubleValue avg_blob_count = 19;
  // Blobs in the canonical blocks
  uint32 blob_count = 20;
  // Median over blocks of the median time sentry nodes first saw the block, in ms from slot start
  google.protobuf.DoubleValue block_first_seen_p50_ms = 21;
  // 90th percentile over blocks of the median time sentry nodes first saw the block, in ms from slot start
  google.protobuf.DoubleValue block_first_seen_p90_ms = 22;
  // Orphaned blocks, attributed through the proposer most recent identifying graffiti
  uint32 orphaned_block_count = 23;
  // Missed slots, attributed through the scheduled proposer most recent identifying graffiti
  uint32 missed_slot_count = 24;
}

// Request for listing fct_block_proposal_by_client_daily records
message ListFctBlockProposalByClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by layer - Client layer: consensus or execution (ORDER BY column 2 - optional)
  StringFilter layer = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Proposer client from the block graffiti, or for orphaned blocks and missed slots from the proposer most recent identifying graffiti, else unknown (ORDER BY column 3 - optional)
  StringFilter client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Canonical blocks proposed (optional)
  UInt32Filter block_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by mev_block_count - Canonical blocks delivered by an MEV relay, the rest were built locally (optional)
  UInt32Filter mev_block_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_mev_value_eth - Mean relay-reported value of the MEV blocks in ETH, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_mev_value_eth = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_gas_used - Mean execution gas used per canonical block (optional)
  google.protobuf.DoubleValue avg_gas_used = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_blob_count - Mean blobs per canonical block (optional)
  google.protobuf.DoubleValue avg_blob_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_count - Blobs in the canonical blocks (optional)
  UInt32Filter blob_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_first_seen_p50_ms - Median over blocks of the median time sentry nodes first saw the block, in ms from slot start (optional)
  google.protobuf.DoubleValue block_first_seen_p50_ms = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_first_seen_p90_ms - 90th percentile over blocks of the median time sentry nodes first saw the block, in ms from slot start (optional)
  google.protobuf.DoubleValue block_first_seen_p90_ms = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by orphaned_block_count - Orphaned blocks, attributed through the proposer most recent identifying graffiti (optional)
  UInt32Filter orphaned_block_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_slot_count - Missed slots, attributed through the scheduled proposer most recent identifying graffiti (optional)
  UInt32Filter missed_slot_count = 14 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_proposal_by_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 15 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockProposalByClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 16 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 17 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_proposal_by_client_daily records
message ListFctBlockProposalByClientDailyResponse {
  // The list of fct_block_proposal_by_client_daily.
  repeated FctBlockProposalByClientDaily fct_block_proposal_by_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_proposal_by_client_daily record by primary key
message GetFctBlockProposalByClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_block_proposal_by_client_daily record
message GetFctBlockProposalByClientDailyResponse {
  FctBlockProposalByClientDaily item = 1;
}

// Query fct_block_proposal_by_client_daily data
service FctBlockProposalByClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockProposalByClientDailyRequest) returns (ListFctBlockProposalByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposal_by_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctBlockProposalByClientDailyRequest) returns (GetFctBlockProposalByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposal_by_client_daily/{day_start_date}"
    };
  }
}
