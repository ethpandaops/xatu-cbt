syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily block proposals per staking entity on the finalized chain: canonical blocks, MEV share and value, orphaned blocks and missed slots. Proposals due are block_count + orphaned_block_count + missed_slot_count. Validators map to their current entity in dim_node, and validators it does not name are unknown, so the rows of a day sum to the whole network
message FctBlockProposalByEntityDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Staking entity of the scheduled proposer in dim_node, or unknown
  string entity = 13;
  // Canonical blocks proposed
  uint32 block_count = 14;
  // Canonical blocks delivered by an MEV relay, the rest were built locally
  uint32 mev_block_count = 15;
  // Mean relay-reported value of the MEV blocks in ETH, NULL when there were none
  google.protobuf.DoubleValue avg_mev_value_eth = 16;
  // Blocks proposed that did not make the finalized chain
  uint32 orphaned_block_count = 17;
  // Slots the entity was scheduled to propose where no block was seen
  uint32 missed_slot_count = 18;
}

// Request for listing fct_block_proposal_by_entity_daily records
message ListFctBlockProposalByEntityDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity - Staking entity of the scheduled proposer in dim_node, or unknown (ORDER BY column 2 - optional)
  StringFilter entity = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Canonical blocks proposed (optional)
  UInt32Filter block_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by mev_block_count - Canonical blocks delivered by an MEV relay, the rest were built locally (optional)
  UInt32Filter mev_block_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_mev_value_eth - Mean relay-reported value of the MEV blocks in ETH, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_mev_value_eth = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by orphaned_block_count - Blocks proposed that did not make the finalized chain (optional)
  UInt32Filter orphaned_block_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_slot_count - Slots the entity was scheduled to propose where no block was seen (optional)
  UInt32Filter missed_slot_count = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_proposal_by_entity_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockProposalByEntityDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_proposal_by_entity_daily records
message ListFctBlockProposalByEntityDailyResponse {
  // The list of fct_block_proposal_by_entity_daily.
  repeated FctBlockProposalByEntityDaily fct_block_proposal_by_entity_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_proposal_by_entity_daily record by primary key
message GetFctBlockProposalByEntityDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_block_proposal_by_entity_daily record
message GetFctBlockProposalByEntityDailyResponse {
  FctBlockProposalByEntityDaily item = 1;
}

// Query fct_block_proposal_by_entity_daily data
service FctBlockProposalByEntityDailyService {
  // List records | Daily block proposals per staking entity on the finalized chain: canonical blocks, MEV share and value, orphaned blocks and missed slots. Proposals due are block_count + orphaned_block_count + missed_slot_count. Validators map to their current entity in dim_node, and validators it does not name are unknown, so the rows of a day sum to the whole network
  rpc List(ListFctBlockProposalByEntityDailyRequest) returns (ListFctBlockProposalByEntityDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposal_by_entity_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctBlockProposalByEntityDailyRequest) returns (GetFctBlockProposalByEntityDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposal_by_entity_daily/{day_start_date}"
    };
  }
}
