syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Every slot of the finalized chain with the staking entity of its scheduled proposer and how the proposal ended: canonical, orphaned or missed. Validators map to their current entity in dim_node, and validators it does not name are unknown
message FctBlockProposerByEntity {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // Staking entity of the scheduled proposer in dim_node, or unknown
  string entity = 16;
  // The validator index of the scheduled proposer
  uint32 proposer_validator_index = 17;
  // The beacon block root, NULL when the slot was missed
  google.protobuf.StringValue block_root = 18;
  // canonical, orphaned (a block was seen but is not on the finalized chain) or missed (no block was seen)
  string status = 19;
}

// Request for listing fct_block_proposer_by_entity records
message ListFctBlockProposerByEntityRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: entity)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number (optional)
  UInt32Filter slot = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by entity - Staking entity of the scheduled proposer in dim_node, or unknown (PROJECTION: p_by_entity - alternative to slot_start_date_time)
  StringFilter entity = 6 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_entity", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by proposer_validator_index - The validator index of the scheduled proposer (optional)
  UInt32Filter proposer_validator_index = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_root - The beacon block root, NULL when the slot was missed (optional)
  NullableStringFilter block_root = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by status - canonical, orphaned (a block was seen but is not on the finalized chain) or missed (no block was seen) (optional)
  StringFilter status = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_proposer_by_entity to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockProposerByEntity` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_proposer_by_entity records
message ListFctBlockProposerByEntityResponse {
  // The list of fct_block_proposer_by_entity.
  repeated FctBlockProposerByEntity fct_block_proposer_by_entity = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_proposer_by_entity record by primary key
message GetFctBlockProposerByEntityRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_block_proposer_by_entity record
message GetFctBlockProposerByEntityResponse {
  FctBlockProposerByEntity item = 1;
}

// Query fct_block_proposer_by_entity data
service FctBlockProposerByEntityService {
  // List records | Every slot of the finalized chain with the staking entity of its scheduled proposer and how the proposal ended: canonical, orphaned or missed. Validators map to their current entity in dim_node, and validators it does not name are unknown
  rpc List(ListFctBlockProposerByEntityRequest) returns (ListFctBlockProposerByEntityResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_by_entity"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctBlockProposerByEntityRequest) returns (GetFctBlockProposerByEntityResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_by_entity/{slot_start_date_time}"
    };
  }
}
