syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Consensus layer reward of each canonical block's proposer

message FctBlockProposerReward {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The canonical block root
  string block_root = 16;
  // The validator index of the proposer
  uint32 proposer_index = 17;
  // Total consensus layer proposer reward in Gwei
  uint64 total = 18;
  // Reward for included attestations in Gwei
  uint64 attestations = 19;
  // Reward for the included sync aggregate in Gwei
  uint64 sync_aggregate = 20;
  // Reward for included proposer slashings in Gwei
  uint64 proposer_slashings = 21;
  // Reward for included attester slashings in Gwei
  uint64 attester_slashings = 22;
}

// Request for listing fct_block_proposer_reward records
message ListFctBlockProposerRewardRequest {
  // Filter by proposer_index - The validator index of the proposer (PRIMARY KEY - required unless using alternatives: slot_start_date_time)
  UInt32Filter proposer_index = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number (optional)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_root - The canonical block root (optional)
  StringFilter block_root = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total - Total consensus layer proposer reward in Gwei (optional)
  UInt64Filter total = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestations - Reward for included attestations in Gwei (optional)
  UInt64Filter attestations = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sync_aggregate - Reward for the included sync aggregate in Gwei (optional)
  UInt64Filter sync_aggregate = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_slashings - Reward for included proposer slashings in Gwei (optional)
  UInt64Filter proposer_slashings = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attester_slashings - Reward for included attester slashings in Gwei (optional)
  UInt64Filter attester_slashings = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_proposer_reward to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockProposerReward` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_proposer_reward records
message ListFctBlockProposerRewardResponse {
  // The list of fct_block_proposer_reward.
  repeated FctBlockProposerReward fct_block_proposer_reward = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_proposer_reward record by primary key
message GetFctBlockProposerRewardRequest {
  // The validator index of the proposer
  uint32 proposer_index = 1; // Primary key (required)
}

// Response for getting a single fct_block_proposer_reward record
message GetFctBlockProposerRewardResponse {
  FctBlockProposerReward item = 1;
}

// Query fct_block_proposer_reward data
service FctBlockProposerRewardService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockProposerRewardRequest) returns (ListFctBlockProposerRewardResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_reward"
    };
  }
  // Get record | Retrieve a single record by proposer_index
  rpc Get(GetFctBlockProposerRewardRequest) returns (GetFctBlockProposerRewardResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_reward/{proposer_index}"
    };
  }
}
