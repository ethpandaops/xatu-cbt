syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Consensus layer proposer rewards per proposer per day

message FctBlockProposerRewardByValidatorDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // The validator index of the proposer
  uint32 proposer_index = 13;
  // Canonical blocks proposed
  uint32 block_count = 14;
  // Total consensus layer proposer reward in Gwei
  uint64 total = 15;
  // Reward for included attestations in Gwei
  uint64 attestations = 16;
  // Reward for included sync aggregates in Gwei
  uint64 sync_aggregate = 17;
  // Reward for included proposer slashings in Gwei
  uint64 proposer_slashings = 18;
  // Reward for included attester slashings in Gwei
  uint64 attester_slashings = 19;
}

// Request for listing fct_block_proposer_reward_by_validator_daily records
message ListFctBlockProposerRewardByValidatorDailyRequest {
  // Filter by proposer_index - The validator index of the proposer (PRIMARY KEY - required)
  UInt32Filter proposer_index = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by day_start_date - The day (UTC) (ORDER BY column 2 - optional)
  StringFilter day_start_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Canonical blocks proposed (optional)
  UInt32Filter block_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total - Total consensus layer proposer reward in Gwei (optional)
  UInt64Filter total = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestations - Reward for included attestations in Gwei (optional)
  UInt64Filter attestations = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sync_aggregate - Reward for included sync aggregates in Gwei (optional)
  UInt64Filter sync_aggregate = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_slashings - Reward for included proposer slashings in Gwei (optional)
  UInt64Filter proposer_slashings = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attester_slashings - Reward for included attester slashings in Gwei (optional)
  UInt64Filter attester_slashings = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_block_proposer_reward_by_validator_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctBlockProposerRewardByValidatorDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_block_proposer_reward_by_validator_daily records
message ListFctBlockProposerRewardByValidatorDailyResponse {
  // The list of fct_block_proposer_reward_by_validator_daily.
  repeated FctBlockProposerRewardByValidatorDaily fct_block_proposer_reward_by_validator_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_block_proposer_reward_by_validator_daily record by primary key
message GetFctBlockProposerRewardByValidatorDailyRequest {
  // The validator index of the proposer
  uint32 proposer_index = 1; // Primary key (required)
}

// Response for getting a single fct_block_proposer_reward_by_validator_daily record
message GetFctBlockProposerRewardByValidatorDailyResponse {
  FctBlockProposerRewardByValidatorDaily item = 1;
}

// Query fct_block_proposer_reward_by_validator_daily data
service FctBlockProposerRewardByValidatorDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctBlockProposerRewardByValidatorDailyRequest) returns (ListFctBlockProposerRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_reward_by_validator_daily"
    };
  }
  // Get record | Retrieve a single record by proposer_index
  rpc Get(GetFctBlockProposerRewardByValidatorDailyRequest) returns (GetFctBlockProposerRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_block_proposer_reward_by_validator_daily/{proposer_index}"
    };
  }
}
