syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily data column custody probe outcomes by the probed peer client and release (its latest agent in the day), from int_custody_probe. How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states

message FctCustodyProbeByClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the peer agent (erigon reported as caplin), unknown when the agent was never seen, other for unparseable names
  string client = 13;
  // Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none
  string version = 14;
  // How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states
  string release_status = 15;
  // Probed peers
  uint32 peer_count = 16;
  // Probes
  uint32 probe_count = 17;
  // Probes returning the columns
  uint32 success_count = 18;
  // Probes where the peer did not return a column it should custody
  uint32 missing_count = 19;
  // Probes that failed
  uint32 failure_count = 20;
  // Peers with at least one missing probe
  uint32 missing_peer_count = 21;
  // Median response time of successful probes in ms
  google.protobuf.DoubleValue response_time_p50_ms = 22;
  // 90th percentile response time of successful probes in ms
  google.protobuf.DoubleValue response_time_p90_ms = 23;
}

// Request for listing fct_custody_probe_by_client_daily records
message ListFctCustodyProbeByClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the peer agent (erigon reported as caplin), unknown when the agent was never seen, other for unparseable names (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by version - Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none (ORDER BY column 3 - optional)
  StringFilter version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by release_status - How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states (ORDER BY column 4 - optional)
  StringFilter release_status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Probed peers (optional)
  UInt32Filter peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by probe_count - Probes (optional)
  UInt32Filter probe_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by success_count - Probes returning the columns (optional)
  UInt32Filter success_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missing_count - Probes where the peer did not return a column it should custody (optional)
  UInt32Filter missing_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by failure_count - Probes that failed (optional)
  UInt32Filter failure_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missing_peer_count - Peers with at least one missing probe (optional)
  UInt32Filter missing_peer_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by response_time_p50_ms - Median response time of successful probes in ms (optional)
  google.protobuf.DoubleValue response_time_p50_ms = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by response_time_p90_ms - 90th percentile response time of successful probes in ms (optional)
  google.protobuf.DoubleValue response_time_p90_ms = 13 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_custody_probe_by_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctCustodyProbeByClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_custody_probe_by_client_daily records
message ListFctCustodyProbeByClientDailyResponse {
  // The list of fct_custody_probe_by_client_daily.
  repeated FctCustodyProbeByClientDaily fct_custody_probe_by_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_custody_probe_by_client_daily record by primary key
message GetFctCustodyProbeByClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_custody_probe_by_client_daily record
message GetFctCustodyProbeByClientDailyResponse {
  FctCustodyProbeByClientDaily item = 1;
}

// Query fct_custody_probe_by_client_daily data
service FctCustodyProbeByClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctCustodyProbeByClientDailyRequest) returns (ListFctCustodyProbeByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctCustodyProbeByClientDailyRequest) returns (GetFctCustodyProbeByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_client_daily/{day_start_date}"
    };
  }
}
