syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily data column custody probes by the probed peer country (its latest location in the day). Crawlers and probes are excluded.
message FctCustodyProbeByCountryDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Continent code of the address, unknown when not geolocated
  string continent_code = 13;
  // Country code of the address, unknown when not geolocated
  string country_code = 14;
  // Country name, Unknown when not geolocated
  string country = 15;
  // Peers probed in the day
  uint32 peer_count = 16;
  // Custody probes
  uint32 probe_count = 17;
  // Probes the peer answered with the column
  uint32 success_count = 18;
  // Probes the peer answered without the column
  uint32 missing_count = 19;
  // Probes that errored or timed out
  uint32 failure_count = 20;
  // Peers with at least one missing probe
  uint32 missing_peer_count = 21;
  // Median response time of successful probes in ms, NULL without any
  google.protobuf.DoubleValue response_time_p50_ms = 22;
  // 90th percentile response time of successful probes in ms, NULL without any
  google.protobuf.DoubleValue response_time_p90_ms = 23;
}

// Request for listing fct_custody_probe_by_country_daily records
message ListFctCustodyProbeByCountryDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by continent_code - Continent code of the address, unknown when not geolocated (ORDER BY column 2 - optional)
  StringFilter continent_code = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country_code - Country code of the address, unknown when not geolocated (ORDER BY column 3 - optional)
  StringFilter country_code = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country - Country name, Unknown when not geolocated (ORDER BY column 4 - optional)
  StringFilter country = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers probed in the day (optional)
  UInt32Filter peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by probe_count - Custody probes (optional)
  UInt32Filter probe_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by success_count - Probes the peer answered with the column (optional)
  UInt32Filter success_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missing_count - Probes the peer answered without the column (optional)
  UInt32Filter missing_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by failure_count - Probes that errored or timed out (optional)
  UInt32Filter failure_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missing_peer_count - Peers with at least one missing probe (optional)
  UInt32Filter missing_peer_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by response_time_p50_ms - Median response time of successful probes in ms, NULL without any (optional)
  google.protobuf.DoubleValue response_time_p50_ms = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by response_time_p90_ms - 90th percentile response time of successful probes in ms, NULL without any (optional)
  google.protobuf.DoubleValue response_time_p90_ms = 13 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_custody_probe_by_country_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctCustodyProbeByCountryDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_custody_probe_by_country_daily records
message ListFctCustodyProbeByCountryDailyResponse {
  // The list of fct_custody_probe_by_country_daily.
  repeated FctCustodyProbeByCountryDaily fct_custody_probe_by_country_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_custody_probe_by_country_daily record by primary key
message GetFctCustodyProbeByCountryDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_custody_probe_by_country_daily record
message GetFctCustodyProbeByCountryDailyResponse {
  FctCustodyProbeByCountryDaily item = 1;
}

// Query fct_custody_probe_by_country_daily data
service FctCustodyProbeByCountryDailyService {
  // List records | Daily data column custody probes by the probed peer country (its latest location in the day). Crawlers and probes are excluded.
  rpc List(ListFctCustodyProbeByCountryDailyRequest) returns (ListFctCustodyProbeByCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_country_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctCustodyProbeByCountryDailyRequest) returns (GetFctCustodyProbeByCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_country_daily/{day_start_date}"
    };
  }
}
