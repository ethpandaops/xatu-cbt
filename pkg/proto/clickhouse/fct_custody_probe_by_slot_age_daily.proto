syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Data column custody probes per UTC day the probes ran, age of the probed slot and P2P peer client. Late age buckets show peers that stop custodying columns before retention ends
message FctCustodyProbeBySlotAgeDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The UTC day the probes ran
  string day_start_date = 12;
  // Age of the probed slot when the probe ran: 0-1d, 1-3d, 3-7d, 7-14d, 14-18d, or 18d+ (past the 4096-epoch retention of about 18.2 days)
  string slot_age_bucket = 13;
  // Start of the slot age bucket in days, for ordering the buckets
  uint32 slot_age_min_days = 14;
  // Consensus client of the probed P2P peer, from its agent (erigon is caplin, unknown when the agent is empty)
  string client = 15;
  // Number of column probes, one per column a probe asked for
  uint64 probe_count = 16;
  // Column probes the peer answered with the column
  uint64 success_count = 17;
  // Column probes the peer answered without the column
  uint64 missing_count = 18;
  // Column probes that failed
  uint64 failure_count = 19;
}

// Request for listing fct_custody_probe_by_slot_age_daily records
message ListFctCustodyProbeBySlotAgeDailyRequest {
  // Filter by day_start_date - The UTC day the probes ran (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by slot_age_bucket - Age of the probed slot when the probe ran: 0-1d, 1-3d, 3-7d, 7-14d, 14-18d, or 18d+ (past the 4096-epoch retention of about 18.2 days) (ORDER BY column 2 - optional)
  StringFilter slot_age_bucket = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Consensus client of the probed P2P peer, from its agent (erigon is caplin, unknown when the agent is empty) (ORDER BY column 3 - optional)
  StringFilter client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_age_min_days - Start of the slot age bucket in days, for ordering the buckets (optional)
  UInt32Filter slot_age_min_days = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by probe_count - Number of column probes, one per column a probe asked for (optional)
  UInt64Filter probe_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by success_count - Column probes the peer answered with the column (optional)
  UInt64Filter success_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missing_count - Column probes the peer answered without the column (optional)
  UInt64Filter missing_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by failure_count - Column probes that failed (optional)
  UInt64Filter failure_count = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_custody_probe_by_slot_age_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctCustodyProbeBySlotAgeDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_custody_probe_by_slot_age_daily records
message ListFctCustodyProbeBySlotAgeDailyResponse {
  // The list of fct_custody_probe_by_slot_age_daily.
  repeated FctCustodyProbeBySlotAgeDaily fct_custody_probe_by_slot_age_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_custody_probe_by_slot_age_daily record by primary key
message GetFctCustodyProbeBySlotAgeDailyRequest {
  // The UTC day the probes ran
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_custody_probe_by_slot_age_daily record
message GetFctCustodyProbeBySlotAgeDailyResponse {
  FctCustodyProbeBySlotAgeDaily item = 1;
}

// Query fct_custody_probe_by_slot_age_daily data
service FctCustodyProbeBySlotAgeDailyService {
  // List records | Data column custody probes per UTC day the probes ran, age of the probed slot and P2P peer client. Late age buckets show peers that stop custodying columns before retention ends
  rpc List(ListFctCustodyProbeBySlotAgeDailyRequest) returns (ListFctCustodyProbeBySlotAgeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_slot_age_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctCustodyProbeBySlotAgeDailyRequest) returns (GetFctCustodyProbeBySlotAgeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_custody_probe_by_slot_age_daily/{day_start_date}"
    };
  }
}
