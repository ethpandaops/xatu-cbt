syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// How each data column of a block became available across sentry nodes: completions by path, cells from gossip and the execution layer, and gossipsub partial message traffic

message FctDataColumnCompletionBySlot {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root hash
  string block_root = 16;
  // The data column index
  uint64 column_index = 17;
  // Number of blobs in the block, the number of cells in the column
  uint32 blob_count = 18;
  // Number of sentry nodes that reported the column complete
  uint32 completion_node_count = 19;
  // Number of nodes whose column was completed by a full gossip message
  uint32 full_gossip_completion_count = 20;
  // Number of nodes whose column was completed from cells received as gossipsub partial messages
  uint32 partial_gossip_completion_count = 21;
  // Number of nodes whose column was built from blobs returned by the execution layer
  uint32 el_completion_count = 22;
  // Number of nodes whose column was recovered by reconstruction from other columns
  uint32 reconstruction_completion_count = 23;
  // Number of nodes whose column was completed by a path the node did not report
  uint32 unknown_completion_count = 24;
  // Cells in the completed columns, summed over the nodes that completed it
  uint64 cells_total = 25;
  // Cells received over gossip, summed over the nodes that completed the column
  uint64 cells_from_gossip = 26;
  // Cells built from blobs returned by the execution layer, summed over the nodes that completed the column
  uint64 cells_from_el = 27;
  // Average number of distinct peers that contributed cells to a PARTIAL_GOSSIP completion, 0 when there was none
  double avg_partial_contributing_peers = 28;
  // Earliest completion of the column by any node, in milliseconds from slot start
  uint32 min_completion_slot_start_diff = 29;
  // Median completion time across nodes, in milliseconds from slot start
  uint32 p50_completion_slot_start_diff = 30;
  // 90th percentile completion time across nodes, in milliseconds from slot start
  uint32 p90_completion_slot_start_diff = 31;
  // Latest completion of the column by any node, in milliseconds from slot start
  uint32 max_completion_slot_start_diff = 32;
  // Median completion time across FULL_GOSSIP completions, in milliseconds from slot start, 0 when there was none
  uint32 p50_full_gossip_completion_slot_start_diff = 33;
  // Median completion time across PARTIAL_GOSSIP completions, in milliseconds from slot start, 0 when there was none
  uint32 p50_partial_gossip_completion_slot_start_diff = 34;
  // Median completion time across EL completions, in milliseconds from slot start, 0 when there was none
  uint32 p50_el_completion_slot_start_diff = 35;
  // Partial messages with a body received by sentry nodes, summed over nodes. WIRE capture points count every part, APP capture points only those the gossipsub router passed on
  uint32 partial_received_message_count = 36;
  // Cells carried by the partial messages received by sentry nodes, duplicates included
  uint64 partial_received_cells = 37;
  // Distinct peers that sent a partial message with a body for the column to a sentry node
  uint32 partial_sender_peer_count = 38;
  // Partial messages with a body sent by sentry nodes, summed over nodes
  uint32 partial_sent_message_count = 39;
  // Cells carried by the partial messages sent by sentry nodes
  uint64 partial_sent_cells = 40;
  // Validation verdicts on received partial messages that accepted them
  uint32 partial_accept_verdict_count = 41;
  // Validation verdicts on received partial messages that ignored them
  uint32 partial_ignore_verdict_count = 42;
  // Validation verdicts on received partial messages that rejected them
  uint32 partial_reject_verdict_count = 43;
  // Cells new to the receiving node that passed verification. Divided by partial_received_cells this approximates the useful cell ratio
  uint64 partial_new_cells = 44;
}

// Request for listing fct_data_column_completion_by_slot records
message ListFctDataColumnCompletionBySlotRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The beacon block root hash (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by column_index - The data column index (ORDER BY column 3 - optional)
  UInt64Filter column_index = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 5 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_count - Number of blobs in the block, the number of cells in the column (optional)
  UInt32Filter blob_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by completion_node_count - Number of sentry nodes that reported the column complete (optional)
  UInt32Filter completion_node_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by full_gossip_completion_count - Number of nodes whose column was completed by a full gossip message (optional)
  UInt32Filter full_gossip_completion_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_gossip_completion_count - Number of nodes whose column was completed from cells received as gossipsub partial messages (optional)
  UInt32Filter partial_gossip_completion_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by el_completion_count - Number of nodes whose column was built from blobs returned by the execution layer (optional)
  UInt32Filter el_completion_count = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by reconstruction_completion_count - Number of nodes whose column was recovered by reconstruction from other columns (optional)
  UInt32Filter reconstruction_completion_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unknown_completion_count - Number of nodes whose column was completed by a path the node did not report (optional)
  UInt32Filter unknown_completion_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cells_total - Cells in the completed columns, summed over the nodes that completed it (optional)
  UInt64Filter cells_total = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cells_from_gossip - Cells received over gossip, summed over the nodes that completed the column (optional)
  UInt64Filter cells_from_gossip = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cells_from_el - Cells built from blobs returned by the execution layer, summed over the nodes that completed the column (optional)
  UInt64Filter cells_from_el = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_partial_contributing_peers - Average number of distinct peers that contributed cells to a PARTIAL_GOSSIP completion, 0 when there was none (optional)
  google.protobuf.DoubleValue avg_partial_contributing_peers = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_completion_slot_start_diff - Earliest completion of the column by any node, in milliseconds from slot start (optional)
  UInt32Filter min_completion_slot_start_diff = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_completion_slot_start_diff - Median completion time across nodes, in milliseconds from slot start (optional)
  UInt32Filter p50_completion_slot_start_diff = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p90_completion_slot_start_diff - 90th percentile completion time across nodes, in milliseconds from slot start (optional)
  UInt32Filter p90_completion_slot_start_diff = 21 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_completion_slot_start_diff - Latest completion of the column by any node, in milliseconds from slot start (optional)
  UInt32Filter max_completion_slot_start_diff = 22 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_full_gossip_completion_slot_start_diff - Median completion time across FULL_GOSSIP completions, in milliseconds from slot start, 0 when there was none (optional)
  UInt32Filter p50_full_gossip_completion_slot_start_diff = 23 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_partial_gossip_completion_slot_start_diff - Median completion time across PARTIAL_GOSSIP completions, in milliseconds from slot start, 0 when there was none (optional)
  UInt32Filter p50_partial_gossip_completion_slot_start_diff = 24 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_el_completion_slot_start_diff - Median completion time across EL completions, in milliseconds from slot start, 0 when there was none (optional)
  UInt32Filter p50_el_completion_slot_start_diff = 25 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_received_message_count - Partial messages with a body received by sentry nodes, summed over nodes. WIRE capture points count every part, APP capture points only those the gossipsub router passed on (optional)
  UInt32Filter partial_received_message_count = 26 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_received_cells - Cells carried by the partial messages received by sentry nodes, duplicates included (optional)
  UInt64Filter partial_received_cells = 27 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_sender_peer_count - Distinct peers that sent a partial message with a body for the column to a sentry node (optional)
  UInt32Filter partial_sender_peer_count = 28 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_sent_message_count - Partial messages with a body sent by sentry nodes, summed over nodes (optional)
  UInt32Filter partial_sent_message_count = 29 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_sent_cells - Cells carried by the partial messages sent by sentry nodes (optional)
  UInt64Filter partial_sent_cells = 30 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_accept_verdict_count - Validation verdicts on received partial messages that accepted them (optional)
  UInt32Filter partial_accept_verdict_count = 31 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_ignore_verdict_count - Validation verdicts on received partial messages that ignored them (optional)
  UInt32Filter partial_ignore_verdict_count = 32 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_reject_verdict_count - Validation verdicts on received partial messages that rejected them (optional)
  UInt32Filter partial_reject_verdict_count = 33 [(google.api.field_behavior) = OPTIONAL];
  // Filter by partial_new_cells - Cells new to the receiving node that passed verification. Divided by partial_received_cells this approximates the useful cell ratio (optional)
  UInt64Filter partial_new_cells = 34 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_data_column_completion_by_slot to return.
  // If unspecified, at most 100 items will be returned.
