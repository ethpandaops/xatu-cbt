// Request for getting a single fct_data_column_completion_by_slot record by primary key
message GetFctDataColumnCompletionBySlotRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_data_column_completion_by_slot record
message GetFctDataColumnCompletionBySlotResponse {
  FctDataColumnCompletionBySlot item = 1;
}

// Query fct_data_column_completion_by_slot data
service FctDataColumnCompletionBySlotService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctDataColumnCompletionBySlotRequest) returns (ListFctDataColumnCompletionBySlotResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_data_column_completion_by_slot"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctDataColumnCompletionBySlotRequest) returns (GetFctDataColumnCompletionBySlotResponse) {
    option (google.api.http) = {
