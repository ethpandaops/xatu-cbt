  // Filter by cells_ignore_count - Cell verdicts that ignored a received partial message, for example because its cells were already known (optional)
  UInt32Filter cells_ignore_count = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cells_reject_count - Cell verdicts that rejected a received partial message (optional)
  UInt32Filter cells_reject_count = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by verdict_cells - Cells carried by the partial messages that got a cell verdict (optional)
  UInt64Filter verdict_cells = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by new_cells - Cells new to the receiving node that passed verification. Divided by verdict_cells this is the useful cell ratio (optional)
  UInt64Filter new_cells = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by header_accept_count - Header verdicts that accepted a partial data column header (optional)
  UInt32Filter header_accept_count = 21 [(google.api.field_behavior) = OPTIONAL];
