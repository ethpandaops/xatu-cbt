  // Filter by meta_consensus_implementation - Consensus client of the sentry nodes. Prysm sentries capture every partial RPC on the wire, Lighthouse sentries only those the gossipsub router passed on (ORDER BY column 2 - optional)
  StringFilter meta_consensus_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

