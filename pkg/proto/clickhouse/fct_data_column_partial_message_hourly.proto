  UInt32Filter header_reject_count = 23 [(google.api.field_behavior) = OPTIONAL];
  // Filter by header_node_block_count - Node and Fulu block pairs where the node received a partial data column header (optional)
  UInt32Filter header_node_block_count = 24 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_header_seen_slot_start_diff - Median time a node first received the header for a block, in milliseconds from slot start, 0 when there was none (optional)
  UInt32Filter p50_header_seen_slot_start_diff = 25 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p90_header_seen_slot_start_diff - 90th percentile time a node first received the header for a block, in milliseconds from slot start, 0 when there was none (optional)
  UInt32Filter p90_header_seen_slot_start_diff = 26 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_data_column_partial_message_hourly to return.
