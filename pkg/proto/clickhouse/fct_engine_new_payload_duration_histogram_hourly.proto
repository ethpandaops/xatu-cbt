syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload duration histogram with log-scaled buckets, 1ms wide below 25ms and about 4% wide above, per hour, node class, execution client and status, from int_engine_new_payload. Summed over any range it gives the range percentiles within one bucket
message FctEngineNewPayloadDurationHistogramHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour
  uint32 hour_start_date_time = 12;
  // Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes)
  string node_class = 13;
  // Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth)
  string meta_execution_implementation = 14;
  // Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR)
  string status = 15;
  // Duration bucket: 0 to 24 are 1ms wide, from 25 each bucket is about 4% wider than the last
  uint32 bucket_index = 16;
  // Lower bound of the bucket in milliseconds, inclusive
  uint32 bucket_lower_ms = 17;
  // Upper bound of the bucket in milliseconds, exclusive
  uint32 bucket_upper_ms = 18;
  // Number of engine_newPayload calls whose duration falls in the bucket
  uint32 observation_count = 19;
}

// Request for listing fct_engine_new_payload_duration_histogram_hourly records
message ListFctEngineNewPayloadDurationHistogramHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by node_class - Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes) (ORDER BY column 2 - optional)
  StringFilter node_class = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_execution_implementation - Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth) (ORDER BY column 3 - optional)
  StringFilter meta_execution_implementation = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by status - Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR) (ORDER BY column 4 - optional)
  StringFilter status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by bucket_index - Duration bucket: 0 to 24 are 1ms wide, from 25 each bucket is about 4% wider than the last (ORDER BY column 5 - optional)
  UInt32Filter bucket_index = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by bucket_lower_ms - Lower bound of the bucket in milliseconds, inclusive (optional)
  UInt32Filter bucket_lower_ms = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by bucket_upper_ms - Upper bound of the bucket in milliseconds, exclusive (optional)
  UInt32Filter bucket_upper_ms = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by observation_count - Number of engine_newPayload calls whose duration falls in the bucket (optional)
  UInt32Filter observation_count = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_duration_histogram_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadDurationHistogramHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_duration_histogram_hourly records
message ListFctEngineNewPayloadDurationHistogramHourlyResponse {
  // The list of fct_engine_new_payload_duration_histogram_hourly.
  repeated FctEngineNewPayloadDurationHistogramHourly fct_engine_new_payload_duration_histogram_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_duration_histogram_hourly record by primary key
message GetFctEngineNewPayloadDurationHistogramHourlyRequest {
  // Start of the hour
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_duration_histogram_hourly record
message GetFctEngineNewPayloadDurationHistogramHourlyResponse {
  FctEngineNewPayloadDurationHistogramHourly item = 1;
}

// Query fct_engine_new_payload_duration_histogram_hourly data
service FctEngineNewPayloadDurationHistogramHourlyService {
  // List records | engine_newPayload duration histogram with log-scaled buckets, 1ms wide below 25ms and about 4% wide above, per hour, node class, execution client and status, from int_engine_new_payload. Summed over any range it gives the range percentiles within one bucket
  rpc List(ListFctEngineNewPayloadDurationHistogramHourlyRequest) returns (ListFctEngineNewPayloadDurationHistogramHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_histogram_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctEngineNewPayloadDurationHistogramHourlyRequest) returns (GetFctEngineNewPayloadDurationHistogramHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_histogram_hourly/{hour_start_date_time}"
    };
  }
}
