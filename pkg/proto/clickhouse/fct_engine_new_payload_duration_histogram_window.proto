syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload duration histograms per window (1h to all, aligned like Lab ranges), node class, execution client, version and status, recomputed hourly, for true range percentiles per client and version
message FctEngineNewPayloadDurationHistogramWindow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The window: 1h, 6h, 24h, 7d or 31d ending at the last complete hour, or 90d, 180d, 1y or all ending at the end of yesterday (UTC)
  string window_name = 12;
  // Start of the window, inclusive
  uint32 window_start_date_time = 13;
  // End of the window, exclusive
  uint32 window_end_date_time = 14;
  // Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes)
  string node_class = 15;
  // Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth)
  string meta_execution_implementation = 16;
  // Full execution client version string from web3_clientVersion RPC
  string meta_execution_version = 17;
  // Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR)
  string status = 18;
  // Duration bucket: 0 to 24 are 1ms wide, from 25 each bucket is about 4% wider than the last
  uint32 bucket_index = 19;
  // Lower bound of the bucket in milliseconds, inclusive
  uint32 bucket_lower_ms = 20;
  // Upper bound of the bucket in milliseconds, exclusive
  uint32 bucket_upper_ms = 21;
  // Number of engine_newPayload calls in the window whose duration falls in the bucket, 0 for a key that left the window
  uint32 observation_count = 22;
}

// Request for listing fct_engine_new_payload_duration_histogram_window records
message ListFctEngineNewPayloadDurationHistogramWindowRequest {
  // Filter by window_name - The window: 1h, 6h, 24h, 7d or 31d ending at the last complete hour, or 90d, 180d, 1y or all ending at the end of yesterday (UTC) (PRIMARY KEY - required)
  StringFilter window_name = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by node_class - Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes) (ORDER BY column 2 - optional)
  StringFilter node_class = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_execution_implementation - Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth) (ORDER BY column 3 - optional)
  StringFilter meta_execution_implementation = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_execution_version - Full execution client version string from web3_clientVersion RPC (ORDER BY column 4 - optional)
  StringFilter meta_execution_version = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by status - Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR) (ORDER BY column 5 - optional)
  StringFilter status = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by bucket_index - Duration bucket: 0 to 24 are 1ms wide, from 25 each bucket is about 4% wider than the last (ORDER BY column 6 - optional)
  UInt32Filter bucket_index = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_start_date_time - Start of the window, inclusive (optional)
  UInt32Filter window_start_date_time = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_end_date_time - End of the window, exclusive (optional)
  UInt32Filter window_end_date_time = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by bucket_lower_ms - Lower bound of the bucket in milliseconds, inclusive (optional)
  UInt32Filter bucket_lower_ms = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by bucket_upper_ms - Upper bound of the bucket in milliseconds, exclusive (optional)
  UInt32Filter bucket_upper_ms = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by observation_count - Number of engine_newPayload calls in the window whose duration falls in the bucket, 0 for a key that left the window (optional)
  UInt32Filter observation_count = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_duration_histogram_window to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadDurationHistogramWindow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_duration_histogram_window records
message ListFctEngineNewPayloadDurationHistogramWindowResponse {
  // The list of fct_engine_new_payload_duration_histogram_window.
  repeated FctEngineNewPayloadDurationHistogramWindow fct_engine_new_payload_duration_histogram_window = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_duration_histogram_window record by primary key
message GetFctEngineNewPayloadDurationHistogramWindowRequest {
  // The window: 1h, 6h, 24h, 7d or 31d ending at the last complete hour, or 90d, 180d, 1y or all ending at the end of yesterday (UTC)
  string window_name = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_duration_histogram_window record
message GetFctEngineNewPayloadDurationHistogramWindowResponse {
  FctEngineNewPayloadDurationHistogramWindow item = 1;
}

// Query fct_engine_new_payload_duration_histogram_window data
service FctEngineNewPayloadDurationHistogramWindowService {
  // List records | engine_newPayload duration histograms per window (1h to all, aligned like Lab ranges), node class, execution client, version and status, recomputed hourly, for true range percentiles per client and version
  rpc List(ListFctEngineNewPayloadDurationHistogramWindowRequest) returns (ListFctEngineNewPayloadDurationHistogramWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_histogram_window"
    };
  }
  // Get record | Retrieve a single record by window_name
  rpc Get(GetFctEngineNewPayloadDurationHistogramWindowRequest) returns (GetFctEngineNewPayloadDurationHistogramWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_histogram_window/{window_name}"
    };
  }
}
