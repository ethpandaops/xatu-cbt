syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload duration P50 and P95 per window (1 hour to all history, aligned like Lab ranges), node class, execution client, version (empty for all versions) and status, recomputed hourly
message FctEngineNewPayloadDurationPercentileWindow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // hour for windows ending at the last complete hour, day for windows of complete UTC days ending yesterday
  string window_grain = 12;
  // Window length in hours (1, 6, 24, 168 or 744) or days (7, 14, 30, 60, 90, 180 or 365), 0 for all history
  uint32 window_length = 13;
  // Start of the window, inclusive
  uint32 window_start_date_time = 14;
  // End of the window, exclusive
  uint32 window_end_date_time = 15;
  // Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes)
  string node_class = 16;
  // Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth)
  string meta_execution_implementation = 17;
  // Full execution client version string from web3_clientVersion RPC, empty for all versions of the client together
  string meta_execution_version = 18;
  // Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR)
  string status = 19;
  // Number of engine_newPayload calls in the window, 0 for a key that left the window
  uint64 observation_count = 20;
  // Median engine_newPayload duration in milliseconds over the window, interpolated inside its log-scaled bucket (about 4% wide)
  float p50_duration_ms = 21;
  // 95th percentile engine_newPayload duration in milliseconds over the window, interpolated inside its log-scaled bucket (about 4% wide)
  float p95_duration_ms = 22;
}

// Request for listing fct_engine_new_payload_duration_percentile_window records
message ListFctEngineNewPayloadDurationPercentileWindowRequest {
  // Filter by window_grain - hour for windows ending at the last complete hour, day for windows of complete UTC days ending yesterday (PRIMARY KEY - required)
  StringFilter window_grain = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by window_length - Window length in hours (1, 6, 24, 168 or 744) or days (7, 14, 30, 60, 90, 180 or 365), 0 for all history (ORDER BY column 2 - optional)
  UInt32Filter window_length = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by node_class - Node classification (eip7870-block-builder for reference nodes, empty for other Xatu nodes) (ORDER BY column 3 - optional)
  StringFilter node_class = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_execution_implementation - Execution client implementation name (e.g., Geth, Nethermind, Besu, Reth) (ORDER BY column 4 - optional)
  StringFilter meta_execution_implementation = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_execution_version - Full execution client version string from web3_clientVersion RPC, empty for all versions of the client together (ORDER BY column 5 - optional)
  StringFilter meta_execution_version = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by status - Engine API response status (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH, ERROR) (ORDER BY column 6 - optional)
  StringFilter status = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_start_date_time - Start of the window, inclusive (optional)
  UInt32Filter window_start_date_time = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_end_date_time - End of the window, exclusive (optional)
  UInt32Filter window_end_date_time = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by observation_count - Number of engine_newPayload calls in the window, 0 for a key that left the window (optional)
  UInt64Filter observation_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_duration_ms - Median engine_newPayload duration in milliseconds over the window, interpolated inside its log-scaled bucket (about 4% wide) (optional)
  google.protobuf.FloatValue p50_duration_ms = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_duration_ms - 95th percentile engine_newPayload duration in milliseconds over the window, interpolated inside its log-scaled bucket (about 4% wide) (optional)
  google.protobuf.FloatValue p95_duration_ms = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_duration_percentile_window to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadDurationPercentileWindow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_duration_percentile_window records
message ListFctEngineNewPayloadDurationPercentileWindowResponse {
  // The list of fct_engine_new_payload_duration_percentile_window.
  repeated FctEngineNewPayloadDurationPercentileWindow fct_engine_new_payload_duration_percentile_window = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

