  rpc List(ListFctEngineNewPayloadDurationPercentileWindowRequest) returns (ListFctEngineNewPayloadDurationPercentileWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_percentile_window"
    };
  }
  // Get record | Retrieve a single record by window_grain
  rpc Get(GetFctEngineNewPayloadDurationPercentileWindowRequest) returns (GetFctEngineNewPayloadDurationPercentileWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_duration_percentile_window/{window_grain}"
    };
