syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload timings of VALID payloads per UTC day, node scope, execution client and 5 Mgas block size bucket, as counts and sums from which a least-squares cost model and throughput can be computed exactly over any range
message FctEngineNewPayloadGasBucketDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The UTC day
  string day_start_date = 12;
  // Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node
  string node_scope = 13;
  // Execution client, lowercased, with go-ethereum as geth
  string client = 14;
  // Block size bucket, the lower bound in Mgas of a 5 Mgas wide bucket
  uint32 gas_bucket_mgas = 15;
  // Number of blocks
  uint32 block_count = 16;
  // Sum of block gas used in Mgas
  double gas_mgas_sum = 17;
  // Sum of squared block gas used in Mgas
  double gas_mgas_sq_sum = 18;
  // Sum over blocks of the mean engine_newPayload duration across Xatu nodes, in milliseconds
  double avg_ms_sum = 19;
  // Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds
  double p50_ms_sum = 20;
  // Sum over blocks of the squared median duration
  double p50_ms_sq_sum = 21;
  // Sum over blocks of Mgas times the median duration
  double gas_p50_product_sum = 22;
  // Sum over blocks of the 95th percentile engine_newPayload duration across Xatu nodes, in milliseconds
  double p95_ms_sum = 23;
  // Sum over blocks of the squared 95th percentile duration
  double p95_ms_sq_sum = 24;
  // Sum over blocks of Mgas times the 95th percentile duration
  double gas_p95_product_sum = 25;
}

// Request for listing fct_engine_new_payload_gas_bucket_daily records
message ListFctEngineNewPayloadGasBucketDailyRequest {
  // Filter by day_start_date - The UTC day (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by node_scope - Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node (ORDER BY column 2 - optional)
  StringFilter node_scope = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Execution client, lowercased, with go-ethereum as geth (ORDER BY column 3 - optional)
  StringFilter client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by gas_bucket_mgas - Block size bucket, the lower bound in Mgas of a 5 Mgas wide bucket (ORDER BY column 4 - optional)
  UInt32Filter gas_bucket_mgas = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of blocks (optional)
  UInt32Filter block_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sum - Sum of block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sum = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sq_sum - Sum of squared block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sq_sum = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_ms_sum - Sum over blocks of the mean engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue avg_ms_sum = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sum - Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue p50_ms_sum = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sq_sum - Sum over blocks of the squared median duration (optional)
  google.protobuf.DoubleValue p50_ms_sq_sum = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_p50_product_sum - Sum over blocks of Mgas times the median duration (optional)
  google.protobuf.DoubleValue gas_p50_product_sum = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_ms_sum - Sum over blocks of the 95th percentile engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue p95_ms_sum = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_ms_sq_sum - Sum over blocks of the squared 95th percentile duration (optional)
  google.protobuf.DoubleValue p95_ms_sq_sum = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_p95_product_sum - Sum over blocks of Mgas times the 95th percentile duration (optional)
  google.protobuf.DoubleValue gas_p95_product_sum = 15 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_gas_bucket_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 16 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadGasBucketDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 17 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 18 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_gas_bucket_daily records
message ListFctEngineNewPayloadGasBucketDailyResponse {
  // The list of fct_engine_new_payload_gas_bucket_daily.
  repeated FctEngineNewPayloadGasBucketDaily fct_engine_new_payload_gas_bucket_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_gas_bucket_daily record by primary key
message GetFctEngineNewPayloadGasBucketDailyRequest {
  // The UTC day
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_gas_bucket_daily record
message GetFctEngineNewPayloadGasBucketDailyResponse {
  FctEngineNewPayloadGasBucketDaily item = 1;
}

// Query fct_engine_new_payload_gas_bucket_daily data
service FctEngineNewPayloadGasBucketDailyService {
  // List records | engine_newPayload timings of VALID payloads per UTC day, node scope, execution client and 5 Mgas block size bucket, as counts and sums from which a least-squares cost model and throughput can be computed exactly over any range
  rpc List(ListFctEngineNewPayloadGasBucketDailyRequest) returns (ListFctEngineNewPayloadGasBucketDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_gas_bucket_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctEngineNewPayloadGasBucketDailyRequest) returns (GetFctEngineNewPayloadGasBucketDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_gas_bucket_daily/{day_start_date}"
    };
  }
}
