syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload cost-model sums per 5 Mgas block size bucket summed over the last 24, 168 and 744 hours and all history, recomputed hourly from fct_engine_new_payload_gas_bucket_hourly and _daily
message FctEngineNewPayloadGasBucketWindow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // hour for windows of hours, day for all history in complete UTC days ending yesterday
  string window_grain = 12;
  // Window length in hours (24, 168 or 744), 0 for all history
  uint32 window_length = 13;
  // Start of the window, inclusive
  uint32 window_start_date_time = 14;
  // End of the window, exclusive. Hour windows end at the last complete hour, or for resource share at the last hour its hourly table has counted
  uint32 window_end_date_time = 15;
  // Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node
  string node_scope = 16;
  // Execution client, lowercased, with go-ethereum as geth
  string client = 17;
  // Block size bucket, the lower bound in Mgas of a 5 Mgas wide bucket
  uint32 gas_bucket_mgas = 18;
  // Number of blocks
  uint32 block_count = 19;
  // Sum of block gas used in Mgas
  double gas_mgas_sum = 20;
  // Sum of squared block gas used in Mgas
  double gas_mgas_sq_sum = 21;
  // Sum over blocks of the mean engine_newPayload duration across Xatu nodes, in milliseconds
  double avg_ms_sum = 22;
  // Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds
  double p50_ms_sum = 23;
  // Sum over blocks of the squared median duration
  double p50_ms_sq_sum = 24;
  // Sum over blocks of Mgas times the median duration
  double gas_p50_product_sum = 25;
  // Sum over blocks of the 95th percentile engine_newPayload duration across Xatu nodes, in milliseconds
  double p95_ms_sum = 26;
  // Sum over blocks of the squared 95th percentile duration
  double p95_ms_sq_sum = 27;
  // Sum over blocks of Mgas times the 95th percentile duration
  double gas_p95_product_sum = 28;
}

// Request for listing fct_engine_new_payload_gas_bucket_window records
message ListFctEngineNewPayloadGasBucketWindowRequest {
  // Filter by window_grain - hour for windows of hours, day for all history in complete UTC days ending yesterday (PRIMARY KEY - required)
  StringFilter window_grain = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by window_length - Window length in hours (24, 168 or 744), 0 for all history (ORDER BY column 2 - optional)
  UInt32Filter window_length = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by node_scope - Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node (ORDER BY column 3 - optional)
  StringFilter node_scope = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Execution client, lowercased, with go-ethereum as geth (ORDER BY column 4 - optional)
  StringFilter client = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by gas_bucket_mgas - Block size bucket, the lower bound in Mgas of a 5 Mgas wide bucket (ORDER BY column 5 - optional)
  UInt32Filter gas_bucket_mgas = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_start_date_time - Start of the window, inclusive (optional)
  UInt32Filter window_start_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_end_date_time - End of the window, exclusive. Hour windows end at the last complete hour, or for resource share at the last hour its hourly table has counted (optional)
  UInt32Filter window_end_date_time = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of blocks (optional)
  UInt32Filter block_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sum - Sum of block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sum = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sq_sum - Sum of squared block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sq_sum = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_ms_sum - Sum over blocks of the mean engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue avg_ms_sum = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sum - Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue p50_ms_sum = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sq_sum - Sum over blocks of the squared median duration (optional)
  google.protobuf.DoubleValue p50_ms_sq_sum = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_p50_product_sum - Sum over blocks of Mgas times the median duration (optional)
  google.protobuf.DoubleValue gas_p50_product_sum = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_ms_sum - Sum over blocks of the 95th percentile engine_newPayload duration across Xatu nodes, in milliseconds (optional)
  google.protobuf.DoubleValue p95_ms_sum = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_ms_sq_sum - Sum over blocks of the squared 95th percentile duration (optional)
  google.protobuf.DoubleValue p95_ms_sq_sum = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_p95_product_sum - Sum over blocks of Mgas times the 95th percentile duration (optional)
  google.protobuf.DoubleValue gas_p95_product_sum = 18 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_gas_bucket_window to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 19 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadGasBucketWindow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 20 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 21 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_gas_bucket_window records
message ListFctEngineNewPayloadGasBucketWindowResponse {
  // The list of fct_engine_new_payload_gas_bucket_window.
  repeated FctEngineNewPayloadGasBucketWindow fct_engine_new_payload_gas_bucket_window = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_gas_bucket_window record by primary key
message GetFctEngineNewPayloadGasBucketWindowRequest {
  // hour for windows of hours, day for all history in complete UTC days ending yesterday
  string window_grain = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_gas_bucket_window record
message GetFctEngineNewPayloadGasBucketWindowResponse {
  FctEngineNewPayloadGasBucketWindow item = 1;
}

// Query fct_engine_new_payload_gas_bucket_window data
service FctEngineNewPayloadGasBucketWindowService {
  // List records | engine_newPayload cost-model sums per 5 Mgas block size bucket summed over the last 24, 168 and 744 hours and all history, recomputed hourly from fct_engine_new_payload_gas_bucket_hourly and _daily
  rpc List(ListFctEngineNewPayloadGasBucketWindowRequest) returns (ListFctEngineNewPayloadGasBucketWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_gas_bucket_window"
    };
  }
  // Get record | Retrieve a single record by window_grain
  rpc Get(GetFctEngineNewPayloadGasBucketWindowRequest) returns (GetFctEngineNewPayloadGasBucketWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_gas_bucket_window/{window_grain}"
    };
  }
}
