syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload throughput of VALID payloads of at least 10 Mgas per hour, node scope, execution client, gas resource and fixed 10% bucket of the share of block resource gas that resource took
message FctEngineNewPayloadResourceShareHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour
  uint32 hour_start_date_time = 12;
  // Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node
  string node_scope = 13;
  // Execution client, lowercased, with go-ethereum as geth
  string client = 14;
  // Gas resource: compute, memory, address_access, state_growth, history, bloom_topics or block_size
  string resource = 15;
  // Share of the block resource gas this resource took, the lower bound of a 10 percentage point bucket (0 to 90)
  uint32 share_bucket_pct = 16;
  // Number of blocks of at least 10 Mgas in the bucket
  uint32 block_count = 17;
  // Sum of block gas used in Mgas
  double gas_mgas_sum = 18;
  // Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds. gas_mgas_sum over p50_ms_sum times 1000 is the throughput in Mgas/s
  double p50_ms_sum = 19;
}

// Request for listing fct_engine_new_payload_resource_share_hourly records
message ListFctEngineNewPayloadResourceShareHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by node_scope - Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node (ORDER BY column 2 - optional)
  StringFilter node_scope = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Execution client, lowercased, with go-ethereum as geth (ORDER BY column 3 - optional)
  StringFilter client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by resource - Gas resource: compute, memory, address_access, state_growth, history, bloom_topics or block_size (ORDER BY column 4 - optional)
  StringFilter resource = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by share_bucket_pct - Share of the block resource gas this resource took, the lower bound of a 10 percentage point bucket (0 to 90) (ORDER BY column 5 - optional)
  UInt32Filter share_bucket_pct = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of blocks of at least 10 Mgas in the bucket (optional)
  UInt32Filter block_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sum - Sum of block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sum = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sum - Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds. gas_mgas_sum over p50_ms_sum times 1000 is the throughput in Mgas/s (optional)
  google.protobuf.DoubleValue p50_ms_sum = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_resource_share_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadResourceShareHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_resource_share_hourly records
message ListFctEngineNewPayloadResourceShareHourlyResponse {
  // The list of fct_engine_new_payload_resource_share_hourly.
  repeated FctEngineNewPayloadResourceShareHourly fct_engine_new_payload_resource_share_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_resource_share_hourly record by primary key
message GetFctEngineNewPayloadResourceShareHourlyRequest {
  // Start of the hour
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_resource_share_hourly record
message GetFctEngineNewPayloadResourceShareHourlyResponse {
  FctEngineNewPayloadResourceShareHourly item = 1;
}

// Query fct_engine_new_payload_resource_share_hourly data
service FctEngineNewPayloadResourceShareHourlyService {
  // List records | engine_newPayload throughput of VALID payloads of at least 10 Mgas per hour, node scope, execution client, gas resource and fixed 10% bucket of the share of block resource gas that resource took
  rpc List(ListFctEngineNewPayloadResourceShareHourlyRequest) returns (ListFctEngineNewPayloadResourceShareHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_resource_share_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctEngineNewPayloadResourceShareHourlyRequest) returns (GetFctEngineNewPayloadResourceShareHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_resource_share_hourly/{hour_start_date_time}"
    };
  }
}
