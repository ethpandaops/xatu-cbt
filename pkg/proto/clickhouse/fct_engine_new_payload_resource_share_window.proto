syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// engine_newPayload throughput sums per gas resource and 10% resource share bucket summed over the last 24, 168 and 744 hours and all history, recomputed hourly from fct_engine_new_payload_resource_share_hourly and _daily
message FctEngineNewPayloadResourceShareWindow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // hour for windows of hours, day for all history in complete UTC days ending yesterday
  string window_grain = 12;
  // Window length in hours (24, 168 or 744), 0 for all history
  uint32 window_length = 13;
  // Start of the window, inclusive
  uint32 window_start_date_time = 14;
  // End of the window, exclusive. Hour windows end at the last complete hour, or for resource share at the last hour its hourly table has counted
  uint32 window_end_date_time = 15;
  // Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node
  string node_scope = 16;
  // Execution client, lowercased, with go-ethereum as geth
  string client = 17;
  // Gas resource: compute, memory, address_access, state_growth, history, bloom_topics or block_size
  string resource = 18;
  // Share of the block resource gas this resource took, the lower bound of a 10 percentage point bucket (0 to 90)
  uint32 share_bucket_pct = 19;
  // Number of blocks of at least 10 Mgas in the bucket
  uint32 block_count = 20;
  // Sum of block gas used in Mgas
  double gas_mgas_sum = 21;
  // Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds. gas_mgas_sum over p50_ms_sum times 1000 is the throughput in Mgas/s
  double p50_ms_sum = 22;
}

// Request for listing fct_engine_new_payload_resource_share_window records
message ListFctEngineNewPayloadResourceShareWindowRequest {
  // Filter by window_grain - hour for windows of hours, day for all history in complete UTC days ending yesterday (PRIMARY KEY - required)
  StringFilter window_grain = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by window_length - Window length in hours (24, 168 or 744), 0 for all history (ORDER BY column 2 - optional)
  UInt32Filter window_length = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by node_scope - Which Xatu nodes the timings come from: reference for reference nodes (node_class eip7870-block-builder), all for every Xatu node (ORDER BY column 3 - optional)
  StringFilter node_scope = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by client - Execution client, lowercased, with go-ethereum as geth (ORDER BY column 4 - optional)
  StringFilter client = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by resource - Gas resource: compute, memory, address_access, state_growth, history, bloom_topics or block_size (ORDER BY column 5 - optional)
  StringFilter resource = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by share_bucket_pct - Share of the block resource gas this resource took, the lower bound of a 10 percentage point bucket (0 to 90) (ORDER BY column 6 - optional)
  UInt32Filter share_bucket_pct = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_start_date_time - Start of the window, inclusive (optional)
  UInt32Filter window_start_date_time = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_end_date_time - End of the window, exclusive. Hour windows end at the last complete hour, or for resource share at the last hour its hourly table has counted (optional)
  UInt32Filter window_end_date_time = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Number of blocks of at least 10 Mgas in the bucket (optional)
  UInt32Filter block_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_mgas_sum - Sum of block gas used in Mgas (optional)
  google.protobuf.DoubleValue gas_mgas_sum = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_ms_sum - Sum over blocks of the median engine_newPayload duration across Xatu nodes, in milliseconds. gas_mgas_sum over p50_ms_sum times 1000 is the throughput in Mgas/s (optional)
  google.protobuf.DoubleValue p50_ms_sum = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_engine_new_payload_resource_share_window to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEngineNewPayloadResourceShareWindow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_engine_new_payload_resource_share_window records
message ListFctEngineNewPayloadResourceShareWindowResponse {
  // The list of fct_engine_new_payload_resource_share_window.
  repeated FctEngineNewPayloadResourceShareWindow fct_engine_new_payload_resource_share_window = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_engine_new_payload_resource_share_window record by primary key
message GetFctEngineNewPayloadResourceShareWindowRequest {
  // hour for windows of hours, day for all history in complete UTC days ending yesterday
  string window_grain = 1; // Primary key (required)
}

// Response for getting a single fct_engine_new_payload_resource_share_window record
message GetFctEngineNewPayloadResourceShareWindowResponse {
  FctEngineNewPayloadResourceShareWindow item = 1;
}

// Query fct_engine_new_payload_resource_share_window data
service FctEngineNewPayloadResourceShareWindowService {
  // List records | engine_newPayload throughput sums per gas resource and 10% resource share bucket summed over the last 24, 168 and 744 hours and all history, recomputed hourly from fct_engine_new_payload_resource_share_hourly and _daily
  rpc List(ListFctEngineNewPayloadResourceShareWindowRequest) returns (ListFctEngineNewPayloadResourceShareWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_resource_share_window"
    };
  }
  // Get record | Retrieve a single record by window_grain
  rpc Get(GetFctEngineNewPayloadResourceShareWindowRequest) returns (GetFctEngineNewPayloadResourceShareWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_engine_new_payload_resource_share_window/{window_grain}"
    };
  }
}
