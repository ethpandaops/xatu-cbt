syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// One row per epoch of the finalized chain with its proposer duties, canonical blocks, slots without a canonical block and attestation participation, from int_block_proposer_canonical and fct_attestation_correctness_canonical
message FctEpochSummaryCanonical {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The epoch number
  uint32 epoch = 12;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 13;
  // Slots of the epoch with a proposer duty or block, 32 once the epoch is complete
  uint32 slot_count = 14;
  // Slots with a block on the finalized chain
  uint32 canonical_block_count = 15;
  // Slots without a block on the finalized chain, whether the proposer missed or the block was orphaned
  uint32 missed_slot_count = 16;
  // Attestations scheduled across the epoch slots
  uint32 votes_max = 17;
  // Attestations included on chain that voted for the block of their own slot
  uint32 votes_head = 18;
  // Attestations included on chain that voted for another block
  uint32 votes_other = 19;
  // Share of scheduled attestations included on chain, (votes_head + votes_other) / votes_max from 0 to 1, NULL when none were scheduled
  google.protobuf.DoubleValue participation_rate = 20;
}

// Request for listing fct_epoch_summary_canonical records
message ListFctEpochSummaryCanonicalRequest {
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (PRIMARY KEY - required)
  UInt32Filter epoch_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number (optional)
  UInt32Filter epoch = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_count - Slots of the epoch with a proposer duty or block, 32 once the epoch is complete (optional)
  UInt32Filter slot_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by canonical_block_count - Slots with a block on the finalized chain (optional)
  UInt32Filter canonical_block_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_slot_count - Slots without a block on the finalized chain, whether the proposer missed or the block was orphaned (optional)
  UInt32Filter missed_slot_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by votes_max - Attestations scheduled across the epoch slots (optional)
  UInt32Filter votes_max = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by votes_head - Attestations included on chain that voted for the block of their own slot (optional)
  UInt32Filter votes_head = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by votes_other - Attestations included on chain that voted for another block (optional)
  UInt32Filter votes_other = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by participation_rate - Share of scheduled attestations included on chain, (votes_head + votes_other) / votes_max from 0 to 1, NULL when none were scheduled (optional)
  google.protobuf.DoubleValue participation_rate = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_epoch_summary_canonical to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctEpochSummaryCanonical` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_epoch_summary_canonical records
message ListFctEpochSummaryCanonicalResponse {
  // The list of fct_epoch_summary_canonical.
  repeated FctEpochSummaryCanonical fct_epoch_summary_canonical = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_epoch_summary_canonical record by primary key
message GetFctEpochSummaryCanonicalRequest {
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_epoch_summary_canonical record
message GetFctEpochSummaryCanonicalResponse {
  FctEpochSummaryCanonical item = 1;
}

// Query fct_epoch_summary_canonical data
service FctEpochSummaryCanonicalService {
  // List records | One row per epoch of the finalized chain with its proposer duties, canonical blocks, slots without a canonical block and attestation participation, from int_block_proposer_canonical and fct_attestation_correctness_canonical
  rpc List(ListFctEpochSummaryCanonicalRequest) returns (ListFctEpochSummaryCanonicalResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_epoch_summary_canonical"
    };
  }
  // Get record | Retrieve a single record by epoch_start_date_time
  rpc Get(GetFctEpochSummaryCanonicalRequest) returns (GetFctEpochSummaryCanonicalResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_epoch_summary_canonical/{epoch_start_date_time}"
    };
  }
}
