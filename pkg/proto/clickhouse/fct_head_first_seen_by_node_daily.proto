syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily head event arrival per node

message FctHeadFirstSeenByNodeDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period, by slot
  string day_start_date = 12;
  // ID of the node
  string node_id = 13;
  // Username of the node
  string username = 14;
  // Classification of the node, e.g. "individual", "corporate", "internal" (aka ethPandaOps) or "unclassified"
  string classification = 15;
  // Latest client name of the node in the period
  string meta_client_name = 16;
  // Latest collector implementation of the node in the period
  string meta_client_implementation = 17;
  // Latest collector version of the node in the period
  string meta_client_version = 18;
  // Latest consensus client implementation of the node in the period
  string meta_consensus_implementation = 19;
  // Latest consensus client version of the node in the period
  string meta_consensus_version = 20;
  // Slots the node saw a head event in
  uint32 slot_count = 21;
  // Earliest head event arrival, in milliseconds from slot start
  uint32 min_seen_slot_start_diff = 22;
  // 10th percentile head event arrival, in milliseconds from slot start
  uint32 p10_seen_slot_start_diff = 23;
  // Median head event arrival, in milliseconds from slot start
  uint32 p50_seen_slot_start_diff = 24;
  // 90th percentile head event arrival, in milliseconds from slot start
  uint32 p90_seen_slot_start_diff = 25;
  // 95th percentile head event arrival, in milliseconds from slot start
  uint32 p95_seen_slot_start_diff = 26;
  // Latest head event arrival, in milliseconds from slot start
  uint32 max_seen_slot_start_diff = 27;
}

// Request for listing fct_head_first_seen_by_node_daily records
message ListFctHeadFirstSeenByNodeDailyRequest {
  // Filter by day_start_date - Start of the day period, by slot (PRIMARY KEY - required unless using alternatives: node_id)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by node_id - ID of the node (ORDER BY column 2 - optional)
  StringFilter node_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by username - Username of the node (optional)
  StringFilter username = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by classification - Classification of the node, e.g. "individual", "corporate", "internal" (aka ethPandaOps) or "unclassified" (optional)
  StringFilter classification = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_name - Latest client name of the node in the period (optional)
  StringFilter meta_client_name = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_implementation - Latest collector implementation of the node in the period (optional)
  StringFilter meta_client_implementation = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_version - Latest collector version of the node in the period (optional)
  StringFilter meta_client_version = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_implementation - Latest consensus client implementation of the node in the period (optional)
  StringFilter meta_consensus_implementation = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_version - Latest consensus client version of the node in the period (optional)
  StringFilter meta_consensus_version = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_count - Slots the node saw a head event in (optional)
  UInt32Filter slot_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_seen_slot_start_diff - Earliest head event arrival, in milliseconds from slot start (optional)
  UInt32Filter min_seen_slot_start_diff = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p10_seen_slot_start_diff - 10th percentile head event arrival, in milliseconds from slot start (optional)
  UInt32Filter p10_seen_slot_start_diff = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p50_seen_slot_start_diff - Median head event arrival, in milliseconds from slot start (optional)
  UInt32Filter p50_seen_slot_start_diff = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p90_seen_slot_start_diff - 90th percentile head event arrival, in milliseconds from slot start (optional)
  UInt32Filter p90_seen_slot_start_diff = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by p95_seen_slot_start_diff - 95th percentile head event arrival, in milliseconds from slot start (optional)
  UInt32Filter p95_seen_slot_start_diff = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_seen_slot_start_diff - Latest head event arrival, in milliseconds from slot start (optional)
  UInt32Filter max_seen_slot_start_diff = 17 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_head_first_seen_by_node_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctHeadFirstSeenByNodeDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_head_first_seen_by_node_daily records
message ListFctHeadFirstSeenByNodeDailyResponse {
  // The list of fct_head_first_seen_by_node_daily.
  repeated FctHeadFirstSeenByNodeDaily fct_head_first_seen_by_node_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_head_first_seen_by_node_daily record by primary key
message GetFctHeadFirstSeenByNodeDailyRequest {
  // Start of the day period, by slot
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_head_first_seen_by_node_daily record
message GetFctHeadFirstSeenByNodeDailyResponse {
  FctHeadFirstSeenByNodeDaily item = 1;
}

// Query fct_head_first_seen_by_node_daily data
service FctHeadFirstSeenByNodeDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctHeadFirstSeenByNodeDailyRequest) returns (ListFctHeadFirstSeenByNodeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_head_first_seen_by_node_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctHeadFirstSeenByNodeDailyRequest) returns (GetFctHeadFirstSeenByNodeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_head_first_seen_by_node_daily/{day_start_date}"
    };
  }
}
