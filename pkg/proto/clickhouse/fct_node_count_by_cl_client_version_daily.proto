syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Xatu nodes per day, consensus client and consensus client version, from the heads each node saw
message FctNodeCountByClClientVersionDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The UTC day
  string day_start_date = 12;
  // The consensus client the Xatu nodes ran
  string meta_consensus_implementation = 13;
  // The consensus client version the Xatu nodes reported, as the client reports it
  string meta_consensus_version = 14;
  // The number of distinct Xatu nodes whose last reported version that day was this one
  uint32 node_count = 15;
}

// Request for listing fct_node_count_by_cl_client_version_daily records
message ListFctNodeCountByClClientVersionDailyRequest {
  // Filter by day_start_date - The UTC day (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by meta_consensus_implementation - The consensus client the Xatu nodes ran (ORDER BY column 2 - optional)
  StringFilter meta_consensus_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_consensus_version - The consensus client version the Xatu nodes reported, as the client reports it (ORDER BY column 3 - optional)
  StringFilter meta_consensus_version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_count - The number of distinct Xatu nodes whose last reported version that day was this one (optional)
  UInt32Filter node_count = 5 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_node_count_by_cl_client_version_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 6 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctNodeCountByClClientVersionDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 7 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 8 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_node_count_by_cl_client_version_daily records
message ListFctNodeCountByClClientVersionDailyResponse {
  // The list of fct_node_count_by_cl_client_version_daily.
  repeated FctNodeCountByClClientVersionDaily fct_node_count_by_cl_client_version_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_node_count_by_cl_client_version_daily record by primary key
message GetFctNodeCountByClClientVersionDailyRequest {
  // The UTC day
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_node_count_by_cl_client_version_daily record
message GetFctNodeCountByClClientVersionDailyResponse {
  FctNodeCountByClClientVersionDaily item = 1;
}

// Query fct_node_count_by_cl_client_version_daily data
service FctNodeCountByClClientVersionDailyService {
  // List records | Xatu nodes per day, consensus client and consensus client version, from the heads each node saw
  rpc List(ListFctNodeCountByClClientVersionDailyRequest) returns (ListFctNodeCountByClClientVersionDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_count_by_cl_client_version_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctNodeCountByClClientVersionDailyRequest) returns (GetFctNodeCountByClClientVersionDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_count_by_cl_client_version_daily/{day_start_date}"
    };
  }
}
