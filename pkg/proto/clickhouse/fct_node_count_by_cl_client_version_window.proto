syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Distinct Xatu nodes per consensus client and version over the last 30, 90 and 365 complete UTC days and all history, recomputed hourly
message FctNodeCountByClClientVersionWindow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The window: 30d, 90d or 1y for the last 30, 90 or 365 complete UTC days, or all for all history
  string window_name = 12;
  // The first UTC day in the window
  string window_start_date = 13;
  // The last UTC day in the window, the last complete day
  string window_end_date = 14;
  // The consensus client the Xatu nodes ran
  string meta_consensus_implementation = 15;
  // The consensus client version the Xatu nodes reported, as the client reports it
  string meta_consensus_version = 16;
  // The number of distinct Xatu nodes that reported this version on any day of the window, 0 when none did
  uint32 node_count = 17;
}

// Request for listing fct_node_count_by_cl_client_version_window records
message ListFctNodeCountByClClientVersionWindowRequest {
  // Filter by window_name - The window: 30d, 90d or 1y for the last 30, 90 or 365 complete UTC days, or all for all history (PRIMARY KEY - required)
  StringFilter window_name = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by meta_consensus_implementation - The consensus client the Xatu nodes ran (ORDER BY column 2 - optional)
  StringFilter meta_consensus_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by meta_consensus_version - The consensus client version the Xatu nodes reported, as the client reports it (ORDER BY column 3 - optional)
  StringFilter meta_consensus_version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_start_date - The first UTC day in the window (optional)
  StringFilter window_start_date = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by window_end_date - The last UTC day in the window, the last complete day (optional)
  StringFilter window_end_date = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_count - The number of distinct Xatu nodes that reported this version on any day of the window, 0 when none did (optional)
  UInt32Filter node_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_node_count_by_cl_client_version_window to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctNodeCountByClClientVersionWindow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_node_count_by_cl_client_version_window records
message ListFctNodeCountByClClientVersionWindowResponse {
  // The list of fct_node_count_by_cl_client_version_window.
  repeated FctNodeCountByClClientVersionWindow fct_node_count_by_cl_client_version_window = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_node_count_by_cl_client_version_window record by primary key
message GetFctNodeCountByClClientVersionWindowRequest {
  // The window: 30d, 90d or 1y for the last 30, 90 or 365 complete UTC days, or all for all history
  string window_name = 1; // Primary key (required)
}

// Response for getting a single fct_node_count_by_cl_client_version_window record
message GetFctNodeCountByClClientVersionWindowResponse {
  FctNodeCountByClClientVersionWindow item = 1;
}

// Query fct_node_count_by_cl_client_version_window data
service FctNodeCountByClClientVersionWindowService {
  // List records | Distinct Xatu nodes per consensus client and version over the last 30, 90 and 365 complete UTC days and all history, recomputed hourly
  rpc List(ListFctNodeCountByClClientVersionWindowRequest) returns (ListFctNodeCountByClClientVersionWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_count_by_cl_client_version_window"
    };
  }
  // Get record | Retrieve a single record by window_name
  rpc Get(GetFctNodeCountByClClientVersionWindowRequest) returns (GetFctNodeCountByClClientVersionWindowResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_count_by_cl_client_version_window/{window_name}"
    };
  }
}
