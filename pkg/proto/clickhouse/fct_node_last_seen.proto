syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Every Xatu node that has reported a block, with its latest identity, client and location, from fct_block_first_seen_by_node. The row with the latest last_seen_date_time wins, so a node reported in a range ending now has last_seen_date_time inside it
message FctNodeLastSeen {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the latest slot the Xatu node reported a block in
  uint32 last_seen_date_time = 12;
  // Username of the Xatu node
  string username = 13;
  // ID of the Xatu node
  string node_id = 14;
  // Classification of the Xatu node, e.g. "individual", "corporate", "internal" (aka ethPandaOps) or "unclassified"
  string classification = 15;
  // Name of the Xatu node
  string meta_client_name = 16;
  // Version of the collector at the latest observation
  string meta_client_version = 17;
  // Implementation of the collector at the latest observation
  string meta_client_implementation = 18;
  // City of the Xatu node at the latest observation
  string meta_client_geo_city = 19;
  // Country of the Xatu node at the latest observation
  string meta_client_geo_country = 20;
  // Country code of the Xatu node at the latest observation
  string meta_client_geo_country_code = 21;
  // Continent code of the Xatu node at the latest observation
  string meta_client_geo_continent_code = 22;
  // Longitude of the Xatu node at the latest observation
  google.protobuf.DoubleValue meta_client_geo_longitude = 23;
  // Latitude of the Xatu node at the latest observation
  google.protobuf.DoubleValue meta_client_geo_latitude = 24;
  // Autonomous system number of the Xatu node at the latest observation
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 25;
  // Autonomous system organization of the Xatu node at the latest observation
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 26;
  // Consensus client version of the Xatu node at the latest observation
  string meta_consensus_version = 27;
  // Consensus client implementation of the Xatu node at the latest observation
  string meta_consensus_implementation = 28;
}

// Request for listing fct_node_last_seen records
message ListFctNodeLastSeenRequest {
  // Filter by meta_client_name - Name of the Xatu node (PRIMARY KEY - required)
  StringFilter meta_client_name = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by last_seen_date_time - Start of the latest slot the Xatu node reported a block in (optional)
  UInt32Filter last_seen_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by username - Username of the Xatu node (optional)
  StringFilter username = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_id - ID of the Xatu node (optional)
  StringFilter node_id = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by classification - Classification of the Xatu node, e.g. "individual", "corporate", "internal" (aka ethPandaOps) or "unclassified" (optional)
  StringFilter classification = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_version - Version of the collector at the latest observation (optional)
  StringFilter meta_client_version = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_implementation - Implementation of the collector at the latest observation (optional)
  StringFilter meta_client_implementation = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_city - City of the Xatu node at the latest observation (optional)
  StringFilter meta_client_geo_city = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_country - Country of the Xatu node at the latest observation (optional)
  StringFilter meta_client_geo_country = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_country_code - Country code of the Xatu node at the latest observation (optional)
  StringFilter meta_client_geo_country_code = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_continent_code - Continent code of the Xatu node at the latest observation (optional)
  StringFilter meta_client_geo_continent_code = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_longitude - Longitude of the Xatu node at the latest observation (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_latitude - Latitude of the Xatu node at the latest observation (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the Xatu node at the latest observation (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the Xatu node at the latest observation (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_version - Consensus client version of the Xatu node at the latest observation (optional)
  StringFilter meta_consensus_version = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by meta_consensus_implementation - Consensus client implementation of the Xatu node at the latest observation (optional)
  StringFilter meta_consensus_implementation = 18 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_node_last_seen to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 19 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctNodeLastSeen` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 20 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 21 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_node_last_seen records
message ListFctNodeLastSeenResponse {
  // The list of fct_node_last_seen.
  repeated FctNodeLastSeen fct_node_last_seen = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_node_last_seen record by primary key
message GetFctNodeLastSeenRequest {
  // Name of the Xatu node
  string meta_client_name = 1; // Primary key (required)
}

// Response for getting a single fct_node_last_seen record
message GetFctNodeLastSeenResponse {
  FctNodeLastSeen item = 1;
}

// Query fct_node_last_seen data
service FctNodeLastSeenService {
  // List records | Every Xatu node that has reported a block, with its latest identity, client and location, from fct_block_first_seen_by_node. The row with the latest last_seen_date_time wins, so a node reported in a range ending now has last_seen_date_time inside it
  rpc List(ListFctNodeLastSeenRequest) returns (ListFctNodeLastSeenResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_last_seen"
    };
  }
  // Get record | Retrieve a single record by meta_client_name
  rpc Get(GetFctNodeLastSeenRequest) returns (GetFctNodeLastSeenResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_node_last_seen/{meta_client_name}"
    };
  }
}
