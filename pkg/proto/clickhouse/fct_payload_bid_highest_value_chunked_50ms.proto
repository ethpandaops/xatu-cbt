syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) auction frontier: the single best builder bid per slot per 50ms chunk across all builders. Bounded by the chunk grid regardless of builder count. Only includes bids within -12000ms to +12000ms of slot start time

message FctPayloadBidHighestValueChunked50ms {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Slot number the bid targets
  uint32 slot = 12;
  // The start time for the slot that the bid is for
  uint32 slot_start_date_time = 13;
  // Epoch number derived from the slot that the bid is for
  uint32 epoch = 14;
  // The start time for the epoch that the bid is for
  uint32 epoch_start_date_time = 15;
  // The difference between the chunk start time and slot_start_date_time. Negative values indicate bids received before slot start
  int32 chunk_slot_start_diff = 16;
  // The timestamp of the earliest observation of the leading bid in this chunk
  int64 earliest_bid_date_time = 17;
  // The execution block hash committed to in the leading bid
  string block_hash = 18;
  // Validator index of the builder leading this chunk
  uint64 builder_index = 19;
  // The best bid value across all builders in this chunk, in wei
  string value = 20;
}

// Request for listing fct_payload_bid_highest_value_chunked_50ms records
message ListFctPayloadBidHighestValueChunked50msRequest {
  // Filter by slot_start_date_time - The start time for the slot that the bid is for (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by chunk_slot_start_diff - The difference between the chunk start time and slot_start_date_time. Negative values indicate bids received before slot start (ORDER BY column 2 - optional)
  Int32Filter chunk_slot_start_diff = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - Slot number the bid targets (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - Epoch number derived from the slot that the bid is for (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The start time for the epoch that the bid is for (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by earliest_bid_date_time - The timestamp of the earliest observation of the leading bid in this chunk (optional)
  Int64Filter earliest_bid_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_hash - The execution block hash committed to in the leading bid (optional)
  StringFilter block_hash = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by builder_index - Validator index of the builder leading this chunk (optional)
  UInt64Filter builder_index = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by value - The best bid value across all builders in this chunk, in wei (optional)
  StringFilter value = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_payload_bid_highest_value_chunked_50ms to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPayloadBidHighestValueChunked50ms` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_payload_bid_highest_value_chunked_50ms records
message ListFctPayloadBidHighestValueChunked50msResponse {
  // The list of fct_payload_bid_highest_value_chunked_50ms.
  repeated FctPayloadBidHighestValueChunked50ms fct_payload_bid_highest_value_chunked_50ms = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_payload_bid_highest_value_chunked_50ms record by primary key
message GetFctPayloadBidHighestValueChunked50msRequest {
  // The start time for the slot that the bid is for
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_payload_bid_highest_value_chunked_50ms record
message GetFctPayloadBidHighestValueChunked50msResponse {
  FctPayloadBidHighestValueChunked50ms item = 1;
}

// Query fct_payload_bid_highest_value_chunked_50ms data
service FctPayloadBidHighestValueChunked50msService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPayloadBidHighestValueChunked50msRequest) returns (ListFctPayloadBidHighestValueChunked50msResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_payload_bid_highest_value_chunked_50ms"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctPayloadBidHighestValueChunked50msRequest) returns (GetFctPayloadBidHighestValueChunked50msResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_payload_bid_highest_value_chunked_50ms/{slot_start_date_time}"
    };
  }
}
