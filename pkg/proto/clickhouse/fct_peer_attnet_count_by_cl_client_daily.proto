syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peers by client and by how many attestation and sync subnets they last advertised in a metadata response to our libp2p sentries. Crawlers, probes, light clients and our own sentries are excluded.
message FctPeerAttnetCountByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent
  string client = 13;
  // Peers that answered our sentries metadata requests in the day
  uint32 peer_count = 14;
  // Peers on no attestation subnet
  uint32 attnets_0_peer_count = 15;
  // Peers on 1 or 2 attestation subnets (2 is the long-lived default)
  uint32 attnets_1_2_peer_count = 16;
  // Peers on 3 to 63 attestation subnets
  uint32 attnets_3_63_peer_count = 17;
  // Peers on all 64 attestation subnets
  uint32 attnets_64_peer_count = 18;
  // Peers on at least one sync committee subnet
  uint32 syncnets_any_peer_count = 19;
  // Peers on all 4 sync committee subnets
  uint32 syncnets_4_peer_count = 20;
}

// Request for listing fct_peer_attnet_count_by_cl_client_daily records
message ListFctPeerAttnetCountByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers that answered our sentries metadata requests in the day (optional)
  UInt32Filter peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attnets_0_peer_count - Peers on no attestation subnet (optional)
  UInt32Filter attnets_0_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attnets_1_2_peer_count - Peers on 1 or 2 attestation subnets (2 is the long-lived default) (optional)
  UInt32Filter attnets_1_2_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attnets_3_63_peer_count - Peers on 3 to 63 attestation subnets (optional)
  UInt32Filter attnets_3_63_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attnets_64_peer_count - Peers on all 64 attestation subnets (optional)
  UInt32Filter attnets_64_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by syncnets_any_peer_count - Peers on at least one sync committee subnet (optional)
  UInt32Filter syncnets_any_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by syncnets_4_peer_count - Peers on all 4 sync committee subnets (optional)
  UInt32Filter syncnets_4_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_attnet_count_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerAttnetCountByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_attnet_count_by_cl_client_daily records
message ListFctPeerAttnetCountByClClientDailyResponse {
  // The list of fct_peer_attnet_count_by_cl_client_daily.
  repeated FctPeerAttnetCountByClClientDaily fct_peer_attnet_count_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_attnet_count_by_cl_client_daily record by primary key
message GetFctPeerAttnetCountByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_attnet_count_by_cl_client_daily record
message GetFctPeerAttnetCountByClClientDailyResponse {
  FctPeerAttnetCountByClClientDaily item = 1;
}

// Query fct_peer_attnet_count_by_cl_client_daily data
service FctPeerAttnetCountByClClientDailyService {
  // List records | Daily consensus peers by client and by how many attestation and sync subnets they last advertised in a metadata response to our libp2p sentries. Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListFctPeerAttnetCountByClClientDailyRequest) returns (ListFctPeerAttnetCountByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_attnet_count_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerAttnetCountByClClientDailyRequest) returns (GetFctPeerAttnetCountByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_attnet_count_by_cl_client_daily/{day_start_date}"
    };
  }
}
