syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peer churn by client, from the peers our libp2p sentries saw: peers kept from the previous day, new peers, returning peers and departed peers, and how many of the last 30 days each peer was seen on. A peer is its peer ID, so clients that rotate their ID on restart show as churn. Rows are written once the day is complete. Crawlers, probes, light clients and our own sentries are excluded.
message FctPeerChurnByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent. Departed peers count under their client the previous day
  string client = 13;
  // Peers our sentries saw in the day. Equals continuing_peer_count + new_peer_count + returning_peer_count
  uint32 peer_count = 14;
  // Peers our sentries also saw the previous day
  uint32 continuing_peer_count = 15;
  // Peers our sentries had not seen in the previous 29 days
  uint32 new_peer_count = 16;
  // Peers our sentries had not seen the previous day but had seen in the 28 days before it
  uint32 returning_peer_count = 17;
  // Peers our sentries saw the previous day but not in this day
  uint32 departed_peer_count = 18;
  // Peers in the day seen on 2 to 7 of the 30 days ending on it. With new_peer_count (seen on 1) and the two counts below, sums to peer_count
  uint32 seen_2_7_days_peer_count = 19;
  // Peers in the day seen on 8 to 29 of the 30 days ending on it
  uint32 seen_8_29_days_peer_count = 20;
  // Peers in the day seen on all 30 days ending on it
  uint32 seen_30_days_peer_count = 21;
  // How many of the previous 29 days hold sentry peers. Under 29, new_peer_count is overstated and the seen-days counts understated, as at the start of the data
  uint32 history_days = 22;
}

// Request for listing fct_peer_churn_by_cl_client_daily records
message ListFctPeerChurnByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent. Departed peers count under their client the previous day (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers our sentries saw in the day. Equals continuing_peer_count + new_peer_count + returning_peer_count (optional)
  UInt32Filter peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by continuing_peer_count - Peers our sentries also saw the previous day (optional)
  UInt32Filter continuing_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by new_peer_count - Peers our sentries had not seen in the previous 29 days (optional)
  UInt32Filter new_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by returning_peer_count - Peers our sentries had not seen the previous day but had seen in the 28 days before it (optional)
  UInt32Filter returning_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by departed_peer_count - Peers our sentries saw the previous day but not in this day (optional)
  UInt32Filter departed_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by seen_2_7_days_peer_count - Peers in the day seen on 2 to 7 of the 30 days ending on it. With new_peer_count (seen on 1) and the two counts below, sums to peer_count (optional)
  UInt32Filter seen_2_7_days_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by seen_8_29_days_peer_count - Peers in the day seen on 8 to 29 of the 30 days ending on it (optional)
  UInt32Filter seen_8_29_days_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by seen_30_days_peer_count - Peers in the day seen on all 30 days ending on it (optional)
  UInt32Filter seen_30_days_peer_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by history_days - How many of the previous 29 days hold sentry peers. Under 29, new_peer_count is overstated and the seen-days counts understated, as at the start of the data (optional)
  UInt32Filter history_days = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_churn_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerChurnByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_churn_by_cl_client_daily records
message ListFctPeerChurnByClClientDailyResponse {
  // The list of fct_peer_churn_by_cl_client_daily.
  repeated FctPeerChurnByClClientDaily fct_peer_churn_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_churn_by_cl_client_daily record by primary key
message GetFctPeerChurnByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_churn_by_cl_client_daily record
message GetFctPeerChurnByClClientDailyResponse {
  FctPeerChurnByClClientDaily item = 1;
}

// Query fct_peer_churn_by_cl_client_daily data
service FctPeerChurnByClClientDailyService {
  // List records | Daily consensus peer churn by client, from the peers our libp2p sentries saw: peers kept from the previous day, new peers, returning peers and departed peers, and how many of the last 30 days each peer was seen on. A peer is its peer ID, so clients that rotate their ID on restart show as churn. Rows are written once the day is complete. Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListFctPeerChurnByClClientDailyRequest) returns (ListFctPeerChurnByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_churn_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerChurnByClClientDailyRequest) returns (GetFctPeerChurnByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_churn_by_cl_client_daily/{day_start_date}"
    };
  }
}
