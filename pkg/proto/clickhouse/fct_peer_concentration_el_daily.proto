  UInt32Filter peer_count = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by located_peer_count - Peers with a known autonomous system, the population of hosting_peer_count (optional)
  UInt32Filter located_peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hosting_peer_count - Peers on a cloud or hosting provider network (optional)
  UInt32Filter hosting_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by ipv6_peer_count - Nodes whose record advertises an IPv6 address (optional)
  UInt32Filter ipv6_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by country_count - Countries with peers (optional)
  UInt32Filter country_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by third_country_count - Fewest countries that hold a third of the peers with a known country (optional)
  UInt32Filter third_country_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by half_country_count - Fewest countries that hold half of the peers with a known country (optional)
  UInt32Filter half_country_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by autonomous_system_count - Autonomous systems with nodes, counting each residential system folded into autonomous system 0 (other) on its own (optional)
  UInt32Filter autonomous_system_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by top_1_asn_peer_count - Peers in the largest autonomous system (optional)
  UInt32Filter top_1_asn_peer_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by top_5_asn_peer_count - Peers in the 5 largest autonomous systems (optional)
  UInt32Filter top_5_asn_peer_count = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by top_10_asn_peer_count - Peers in the 10 largest autonomous systems (optional)
  UInt32Filter top_10_asn_peer_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by third_asn_count - Fewest autonomous systems that hold a third of the peers with a known autonomous system (optional)
  UInt32Filter third_asn_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by half_asn_count - Fewest autonomous systems that hold half of the peers with a known autonomous system (optional)
  UInt32Filter half_asn_count = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by africa_peer_count - Peers in Africa (AF) (optional)
  UInt32Filter africa_peer_count = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by antarctica_peer_count - Peers in Antarctica (AN) (optional)
  UInt32Filter antarctica_peer_count = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by asia_peer_count - Peers in Asia (AS) (optional)
  UInt32Filter asia_peer_count = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by europe_peer_count - Peers in Europe (EU) (optional)
  UInt32Filter europe_peer_count = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by north_america_peer_count - Peers in North America (NA) (optional)
  UInt32Filter north_america_peer_count = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by oceania_peer_count - Peers in Oceania (OC) (optional)
  UInt32Filter oceania_peer_count = 21 [(google.api.field_behavior) = OPTIONAL];
  // Filter by south_america_peer_count - Peers in South America (SA) (optional)
  UInt32Filter south_america_peer_count = 22 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unknown_continent_peer_count - Peers not geolocated to a continent (optional)
  UInt32Filter unknown_continent_peer_count = 23 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_concentration_el_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 24 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerConcentrationElDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 25 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 26 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_concentration_el_daily records
message ListFctPeerConcentrationElDailyResponse {
  // The list of fct_peer_concentration_el_daily.
  repeated FctPeerConcentrationElDaily fct_peer_concentration_el_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
