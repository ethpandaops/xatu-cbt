}

// Response for getting a single fct_peer_concentration_el_daily record
message GetFctPeerConcentrationElDailyResponse {
  FctPeerConcentrationElDaily item = 1;
}

// Query fct_peer_concentration_el_daily data
service FctPeerConcentrationElDailyService {
  // List records | Daily concentration of execution nodes: countries and autonomous systems, the largest systems, the fewest countries and systems holding a third and half of the nodes, and nodes per continent. Shares are of nodes with a known country or system. Execution nodes our discovery crawler found in the day on the network genesis and its current fork, one count per node with its latest record.
  rpc List(ListFctPeerConcentrationElDailyRequest) returns (ListFctPeerConcentrationElDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_concentration_el_daily"
    };
