syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily consensus and execution client pairs from nodes sharing an IPv4 address: consensus peers from libp2p and ENRs, execution nodes from discovery. Only addresses with exactly one consensus and one execution client form a pair. No address is stored.

message FctPeerCountByClientPairDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client at the address
  string consensus_client = 13;
  // Execution client at the address
  string execution_client = 14;
  // Addresses with exactly this consensus and execution client
  uint32 ip_count = 15;
  // Addresses in the day with a consensus client
  uint32 cl_ip_count = 16;
  // Addresses in the day with an execution client
  uint32 el_ip_count = 17;
  // Addresses in the day with both, the match rate is matched_ip_count / cl_ip_count
  uint32 matched_ip_count = 18;
  // Matched addresses with exactly one client per layer, the sum of ip_count over the day
  uint32 paired_ip_count = 19;
}

// Request for listing fct_peer_count_by_client_pair_daily records
message ListFctPeerCountByClientPairDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by consensus_client - Consensus client at the address (ORDER BY column 2 - optional)
  StringFilter consensus_client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by execution_client - Execution client at the address (ORDER BY column 3 - optional)
  StringFilter execution_client = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by ip_count - Addresses with exactly this consensus and execution client (optional)
  UInt32Filter ip_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cl_ip_count - Addresses in the day with a consensus client (optional)
  UInt32Filter cl_ip_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by el_ip_count - Addresses in the day with an execution client (optional)
  UInt32Filter el_ip_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by matched_ip_count - Addresses in the day with both, the match rate is matched_ip_count / cl_ip_count (optional)
  UInt32Filter matched_ip_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by paired_ip_count - Matched addresses with exactly one client per layer, the sum of ip_count over the day (optional)
  UInt32Filter paired_ip_count = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_count_by_client_pair_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerCountByClientPairDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_count_by_client_pair_daily records
message ListFctPeerCountByClientPairDailyResponse {
  // The list of fct_peer_count_by_client_pair_daily.
  repeated FctPeerCountByClientPairDaily fct_peer_count_by_client_pair_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_count_by_client_pair_daily record by primary key
message GetFctPeerCountByClientPairDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_count_by_client_pair_daily record
message GetFctPeerCountByClientPairDailyResponse {
  FctPeerCountByClientPairDaily item = 1;
}

// Query fct_peer_count_by_client_pair_daily data
service FctPeerCountByClientPairDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerCountByClientPairDailyRequest) returns (ListFctPeerCountByClientPairDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_client_pair_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerCountByClientPairDailyRequest) returns (GetFctPeerCountByClientPairDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_client_pair_daily/{day_start_date}"
    };
  }
}
