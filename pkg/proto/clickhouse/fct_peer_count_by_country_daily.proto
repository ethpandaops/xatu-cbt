syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peers by country, from our libp2p sentries and our discovery crawler, with reachability, hosting and custody counts. Crawlers, probes, light clients and our own sentries are excluded.
message FctPeerCountByCountryDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Continent code of the address, unknown when not geolocated
  string continent_code = 13;
  // Country code of the address, unknown when not geolocated
  string country_code = 14;
  // Country name, Unknown when not geolocated
  string country = 15;
  // Consensus peers our libp2p sentries or our discovery crawler saw in the day
  uint32 peer_count = 16;
  // Peers our libp2p sentries were connected to
  uint32 sentry_peer_count = 17;
  // Peers our discovery crawler dialled from their ENR
  uint32 enr_peer_count = 18;
  // Peers our sentries dialled (outbound connections), so publicly reachable
  uint32 dialled_peer_count = 19;
  // Peers that only connected to our sentries and were never dialled
  uint32 inbound_only_peer_count = 20;
  // Peers connected to over QUIC or advertising a QUIC listen address
  uint32 quic_peer_count = 21;
  // Peers on a cloud or hosting provider network
  uint32 hosting_peer_count = 22;
  // Peers whose custody group count is known from a metadata response or their ENR
  uint32 custody_known_peer_count = 23;
  // Peers custodying 4 or fewer groups (the minimum)
  uint32 custody_4_peer_count = 24;
  // Peers custodying 5 to 8 groups
  uint32 custody_5_8_peer_count = 25;
  // Peers custodying 9 to 127 groups
  uint32 custody_9_127_peer_count = 26;
  // Peers custodying all 128 groups (supernodes)
  uint32 custody_128_peer_count = 27;
}

// Request for listing fct_peer_count_by_country_daily records
message ListFctPeerCountByCountryDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by continent_code - Continent code of the address, unknown when not geolocated (ORDER BY column 2 - optional)
  StringFilter continent_code = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country_code - Country code of the address, unknown when not geolocated (ORDER BY column 3 - optional)
  StringFilter country_code = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country - Country name, Unknown when not geolocated (ORDER BY column 4 - optional)
  StringFilter country = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Consensus peers our libp2p sentries or our discovery crawler saw in the day (optional)
  UInt32Filter peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sentry_peer_count - Peers our libp2p sentries were connected to (optional)
  UInt32Filter sentry_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by enr_peer_count - Peers our discovery crawler dialled from their ENR (optional)
  UInt32Filter enr_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by dialled_peer_count - Peers our sentries dialled (outbound connections), so publicly reachable (optional)
  UInt32Filter dialled_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by inbound_only_peer_count - Peers that only connected to our sentries and were never dialled (optional)
  UInt32Filter inbound_only_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by quic_peer_count - Peers connected to over QUIC or advertising a QUIC listen address (optional)
  UInt32Filter quic_peer_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hosting_peer_count - Peers on a cloud or hosting provider network (optional)
  UInt32Filter hosting_peer_count = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custody_known_peer_count - Peers whose custody group count is known from a metadata response or their ENR (optional)
  UInt32Filter custody_known_peer_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custody_4_peer_count - Peers custodying 4 or fewer groups (the minimum) (optional)
  UInt32Filter custody_4_peer_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custody_5_8_peer_count - Peers custodying 5 to 8 groups (optional)
  UInt32Filter custody_5_8_peer_count = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custody_9_127_peer_count - Peers custodying 9 to 127 groups (optional)
  UInt32Filter custody_9_127_peer_count = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custody_128_peer_count - Peers custodying all 128 groups (supernodes) (optional)
  UInt32Filter custody_128_peer_count = 17 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_count_by_country_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerCountByCountryDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_count_by_country_daily records
message ListFctPeerCountByCountryDailyResponse {
  // The list of fct_peer_count_by_country_daily.
  repeated FctPeerCountByCountryDaily fct_peer_count_by_country_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_count_by_country_daily record by primary key
message GetFctPeerCountByCountryDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_count_by_country_daily record
message GetFctPeerCountByCountryDailyResponse {
  FctPeerCountByCountryDaily item = 1;
}

// Query fct_peer_count_by_country_daily data
service FctPeerCountByCountryDailyService {
  // List records | Daily consensus peers by country, from our libp2p sentries and our discovery crawler, with reachability, hosting and custody counts. Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListFctPeerCountByCountryDailyRequest) returns (ListFctPeerCountByCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_country_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerCountByCountryDailyRequest) returns (GetFctPeerCountByCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_country_daily/{day_start_date}"
    };
  }
}
