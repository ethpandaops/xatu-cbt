syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily execution nodes by autonomous system, all clients together. Residential autonomous systems under 3 nodes roll into autonomous system 0 (other), which keeps how many systems it holds. Execution nodes our discovery crawler found in the day on the network genesis and its current fork, one count per node with its latest record.
message FctPeerCountByElAsnDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Autonomous system number of the address, 0 for unknown and for residential autonomous systems under 3 peers (other)
  uint32 autonomous_system_number = 13;
  // Autonomous system organisation, unknown when not geolocated, other for residential autonomous systems under 3 peers
  string autonomous_system_organization = 14;
  // hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs), unknown when not geolocated
  string network_type = 15;
  // Execution nodes
  uint32 peer_count = 16;
  // Autonomous systems in the row: 1, the number of residential systems folded into autonomous system 0 (other), each with 1 or 2 peers, or 0 for unknown
  uint32 autonomous_system_count = 17;
}

// Request for listing fct_peer_count_by_el_asn_daily records
message ListFctPeerCountByElAsnDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by autonomous_system_number - Autonomous system number of the address, 0 for unknown and for residential autonomous systems under 3 peers (other) (ORDER BY column 2 - optional)
  UInt32Filter autonomous_system_number = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by autonomous_system_organization - Autonomous system organisation, unknown when not geolocated, other for residential autonomous systems under 3 peers (ORDER BY column 3 - optional)
  StringFilter autonomous_system_organization = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by network_type - hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs), unknown when not geolocated (ORDER BY column 4 - optional)
  StringFilter network_type = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Execution nodes (optional)
  UInt32Filter peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by autonomous_system_count - Autonomous systems in the row: 1, the number of residential systems folded into autonomous system 0 (other), each with 1 or 2 peers, or 0 for unknown (optional)
  UInt32Filter autonomous_system_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_count_by_el_asn_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerCountByElAsnDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_count_by_el_asn_daily records
message ListFctPeerCountByElAsnDailyResponse {
  // The list of fct_peer_count_by_el_asn_daily.
  repeated FctPeerCountByElAsnDaily fct_peer_count_by_el_asn_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_count_by_el_asn_daily record by primary key
message GetFctPeerCountByElAsnDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_count_by_el_asn_daily record
message GetFctPeerCountByElAsnDailyResponse {
  FctPeerCountByElAsnDaily item = 1;
}

// Query fct_peer_count_by_el_asn_daily data
service FctPeerCountByElAsnDailyService {
  // List records | Daily execution nodes by autonomous system, all clients together. Residential autonomous systems under 3 nodes roll into autonomous system 0 (other), which keeps how many systems it holds. Execution nodes our discovery crawler found in the day on the network genesis and its current fork, one count per node with its latest record.
  rpc List(ListFctPeerCountByElAsnDailyRequest) returns (ListFctPeerCountByElAsnDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_el_asn_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerCountByElAsnDailyRequest) returns (GetFctPeerCountByElAsnDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_el_asn_daily/{day_start_date}"
    };
  }
}
