syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily execution node census by client and country. Execution nodes our discovery crawler found in the day, one count per node with its latest record, on the network genesis (the most common one that day, which excludes other chains). Countries under 3 nodes roll into their continent other bucket, and continents still under 3 into a global other bucket.

message FctPeerCountByElClientCountryDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Execution client from the node devp2p name (nimbus reported as nimbusel)
  string client = 13;
  // Continent code of the address, other for buckets under 3 peers
  string continent_code = 14;
  // Country code of the address, other when the country has under 3 peers, unknown when not geolocated
  string country_code = 15;
  // Country name, Other or Unknown
  string country = 16;
  // Nodes
  uint32 peer_count = 17;
}

// Request for listing fct_peer_count_by_el_client_country_daily records
message ListFctPeerCountByElClientCountryDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Execution client from the node devp2p name (nimbus reported as nimbusel) (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by continent_code - Continent code of the address, other for buckets under 3 peers (ORDER BY column 3 - optional)
  StringFilter continent_code = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country_code - Country code of the address, other when the country has under 3 peers, unknown when not geolocated (ORDER BY column 4 - optional)
  StringFilter country_code = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by country - Country name, Other or Unknown (ORDER BY column 5 - optional)
  StringFilter country = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Nodes (optional)
  UInt32Filter peer_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_count_by_el_client_country_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerCountByElClientCountryDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_count_by_el_client_country_daily records
message ListFctPeerCountByElClientCountryDailyResponse {
  // The list of fct_peer_count_by_el_client_country_daily.
  repeated FctPeerCountByElClientCountryDaily fct_peer_count_by_el_client_country_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_count_by_el_client_country_daily record by primary key
message GetFctPeerCountByElClientCountryDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_count_by_el_client_country_daily record
message GetFctPeerCountByElClientCountryDailyResponse {
  FctPeerCountByElClientCountryDaily item = 1;
}

// Query fct_peer_count_by_el_client_country_daily data
service FctPeerCountByElClientCountryDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerCountByElClientCountryDailyRequest) returns (ListFctPeerCountByElClientCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_el_client_country_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerCountByElClientCountryDailyRequest) returns (GetFctPeerCountByElClientCountryDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_count_by_el_client_country_daily/{day_start_date}"
    };
  }
}
