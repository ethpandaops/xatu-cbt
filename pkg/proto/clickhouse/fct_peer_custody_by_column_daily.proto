syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peers by the data columns they custody, 128 rows a day: a peer with custody group count n custodies the first n groups its node ID assigns. Peers our libp2p sentries or discovery crawler saw with a known custody group count and peer ID (all peers from April 2026). Crawlers, probes, light clients and our own sentries are excluded.
message FctPeerCustodyByColumnDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Data column index, 0 to 127
  uint32 column_index = 13;
  // Peers that custody the column, from their custody group count and node ID
  uint32 custodian_peer_count = 14;
  // Of those, peers custodying all 128 groups (supernodes), the same for every column
  uint32 supernode_peer_count = 15;
  // Of those, peers on a cloud or hosting provider network
  uint32 hosting_peer_count = 16;
  // Countries the custodians are in
  uint32 country_count = 17;
  // Custodians in the country with the most of them
  uint32 largest_country_peer_count = 18;
  // Hosting autonomous systems the custodians are on. Residential peers have no autonomous system here
  uint32 hosting_autonomous_system_count = 19;
  // Custodians on the hosting autonomous system with the most of them
  uint32 largest_autonomous_system_peer_count = 20;
}

// Request for listing fct_peer_custody_by_column_daily records
message ListFctPeerCustodyByColumnDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by column_index - Data column index, 0 to 127 (ORDER BY column 2 - optional)
  UInt32Filter column_index = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by custodian_peer_count - Peers that custody the column, from their custody group count and node ID (optional)
  UInt32Filter custodian_peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by supernode_peer_count - Of those, peers custodying all 128 groups (supernodes), the same for every column (optional)
  UInt32Filter supernode_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hosting_peer_count - Of those, peers on a cloud or hosting provider network (optional)
  UInt32Filter hosting_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by country_count - Countries the custodians are in (optional)
  UInt32Filter country_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by largest_country_peer_count - Custodians in the country with the most of them (optional)
  UInt32Filter largest_country_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hosting_autonomous_system_count - Hosting autonomous systems the custodians are on. Residential peers have no autonomous system here (optional)
  UInt32Filter hosting_autonomous_system_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by largest_autonomous_system_peer_count - Custodians on the hosting autonomous system with the most of them (optional)
  UInt32Filter largest_autonomous_system_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_custody_by_column_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerCustodyByColumnDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_custody_by_column_daily records
message ListFctPeerCustodyByColumnDailyResponse {
  // The list of fct_peer_custody_by_column_daily.
  repeated FctPeerCustodyByColumnDaily fct_peer_custody_by_column_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_custody_by_column_daily record by primary key
message GetFctPeerCustodyByColumnDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_custody_by_column_daily record
message GetFctPeerCustodyByColumnDailyResponse {
  FctPeerCustodyByColumnDaily item = 1;
}

// Query fct_peer_custody_by_column_daily data
service FctPeerCustodyByColumnDailyService {
  // List records | Daily consensus peers by the data columns they custody, 128 rows a day: a peer with custody group count n custodies the first n groups its node ID assigns. Peers our libp2p sentries or discovery crawler saw with a known custody group count and peer ID (all peers from April 2026). Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListFctPeerCustodyByColumnDailyRequest) returns (ListFctPeerCustodyByColumnDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_custody_by_column_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerCustodyByColumnDailyRequest) returns (GetFctPeerCustodyByColumnDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_custody_by_column_daily/{day_start_date}"
    };
  }
}
