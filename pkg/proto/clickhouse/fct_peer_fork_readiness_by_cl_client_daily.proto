syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily consensus nodes from discovery (ENRs) by client, release, fork digest and next fork digest. A next fork digest of 0x00000000 or equal to the current digest means no next fork and is stored as empty. How the version was resolved: commit_match (a release tag commit), commit_untagged (a default or release branch commit, version is the release it builds on), commit_ambiguous, commit_unmatched (a custom or fork build), commit_zero, version_match, version_unmatched or none

message FctPeerForkReadinessByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the ENR client name (erigon reported as caplin)
  string client = 13;
  // Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none
  string version = 14;
  // How the version was resolved: commit_match (a release tag commit), commit_untagged (a default or release branch commit, version is the release it builds on), commit_ambiguous, commit_unmatched (a custom or fork build), commit_zero, version_match, version_unmatched or none
  string release_status = 15;
  // Current fork digest in the ENR
  string fork_digest = 16;
  // Next fork digest in the ENR, empty when none
  string next_fork_digest = 17;
  // Nodes
  uint32 node_count = 18;
}

// Request for listing fct_peer_fork_readiness_by_cl_client_daily records
message ListFctPeerForkReadinessByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the ENR client name (erigon reported as caplin) (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by version - Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none (ORDER BY column 3 - optional)
  StringFilter version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by release_status - How the version was resolved: commit_match (a release tag commit), commit_untagged (a default or release branch commit, version is the release it builds on), commit_ambiguous, commit_unmatched (a custom or fork build), commit_zero, version_match, version_unmatched or none (ORDER BY column 4 - optional)
  StringFilter release_status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by fork_digest - Current fork digest in the ENR (ORDER BY column 5 - optional)
  StringFilter fork_digest = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by next_fork_digest - Next fork digest in the ENR, empty when none (ORDER BY column 6 - optional)
  StringFilter next_fork_digest = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_count - Nodes (optional)
  UInt32Filter node_count = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_fork_readiness_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerForkReadinessByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_fork_readiness_by_cl_client_daily records
message ListFctPeerForkReadinessByClClientDailyResponse {
  // The list of fct_peer_fork_readiness_by_cl_client_daily.
  repeated FctPeerForkReadinessByClClientDaily fct_peer_fork_readiness_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_fork_readiness_by_cl_client_daily record by primary key
message GetFctPeerForkReadinessByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_fork_readiness_by_cl_client_daily record
message GetFctPeerForkReadinessByClClientDailyResponse {
  FctPeerForkReadinessByClClientDaily item = 1;
}

// Query fct_peer_fork_readiness_by_cl_client_daily data
service FctPeerForkReadinessByClClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerForkReadinessByClClientDailyRequest) returns (ListFctPeerForkReadinessByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_fork_readiness_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerForkReadinessByClClientDailyRequest) returns (GetFctPeerForkReadinessByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_fork_readiness_by_cl_client_daily/{day_start_date}"
    };
  }
}
