syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily execution nodes from discovery by client, release and EIP-2124 fork id. Execution nodes our discovery crawler found in the day, one count per node with its latest record, on the network genesis (the most common one that day, which excludes other chains). A next fork of 0 means none and is stored as empty. How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states

message FctPeerForkReadinessByElClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Execution client from the node devp2p name (nimbus reported as nimbusel)
  string client = 13;
  // Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none
  string version = 14;
  // How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states
  string release_status = 15;
  // Fork id hash, the CRC32 of the genesis and passed forks
  string fork_id_hash = 16;
  // Next fork block number or timestamp, empty when none
  string fork_id_next = 17;
  // Nodes
  uint32 node_count = 18;
}

// Request for listing fct_peer_fork_readiness_by_el_client_daily records
message ListFctPeerForkReadinessByElClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Execution client from the node devp2p name (nimbus reported as nimbusel) (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by version - Release version from dim_client_release when the commit or version resolved (for commit_untagged the release the commit builds on), else the version the agent reports, empty when it reports none (ORDER BY column 3 - optional)
  StringFilter version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by release_status - How the version was resolved: commit_match (a release tag commit agreeing with any stated version), commit_untagged (a default or release branch commit, version is the release it builds on, else the stated version), commit_mismatch (the commit resolves to another release than the stated version, version is the commit release), commit_ambiguous, commit_unmatched (a custom or fork build, the stated version is kept), commit_zero, version_match, version_unmatched or none. Rows whose commit does not resolve keep the version the agent states (ORDER BY column 4 - optional)
  StringFilter release_status = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by fork_id_hash - Fork id hash, the CRC32 of the genesis and passed forks (ORDER BY column 5 - optional)
  StringFilter fork_id_hash = 5 [(google.api.field_behavior) = OPTIONAL];

  // Filter by fork_id_next - Next fork block number or timestamp, empty when none (ORDER BY column 6 - optional)
  StringFilter fork_id_next = 6 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by node_count - Nodes (optional)
  UInt32Filter node_count = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_fork_readiness_by_el_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerForkReadinessByElClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_fork_readiness_by_el_client_daily records
message ListFctPeerForkReadinessByElClientDailyResponse {
  // The list of fct_peer_fork_readiness_by_el_client_daily.
  repeated FctPeerForkReadinessByElClientDaily fct_peer_fork_readiness_by_el_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_fork_readiness_by_el_client_daily record by primary key
message GetFctPeerForkReadinessByElClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_fork_readiness_by_el_client_daily record
message GetFctPeerForkReadinessByElClientDailyResponse {
  FctPeerForkReadinessByElClientDaily item = 1;
}

// Query fct_peer_fork_readiness_by_el_client_daily data
service FctPeerForkReadinessByElClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerForkReadinessByElClientDailyRequest) returns (ListFctPeerForkReadinessByElClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_fork_readiness_by_el_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerForkReadinessByElClientDailyRequest) returns (GetFctPeerForkReadinessByElClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_fork_readiness_by_el_client_daily/{day_start_date}"
    };
  }
}
