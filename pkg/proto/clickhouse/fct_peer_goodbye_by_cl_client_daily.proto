syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily libp2p Goodbye messages our sentries received from remote peers, by the consensus client of the peer and the reason code it gave for disconnecting. Rows are written once the day is complete. The first day of data and a day after a whole day without goodbyes are left out, as they are partial.
message FctPeerGoodbyeByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client of the remote peer from its agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was not known, other for every other agent (libp2p tools, crawlers)
  string client = 13;
  // Goodbye reason code the remote peer sent: 1 client shutdown, 2 irrelevant network, 3 fault/error, 128 unable to verify network, 129 too many peers, 250 peer score too low, 251 banned. Other codes are client specific
  uint64 code = 14;
  // Reason text our sentries give the code, such as client has too many peers. Codes they do not know read as unknown goodbye value of N received
  string reason = 15;
  // Goodbye messages with the code our sentries received from the client in the day. A peer that says goodbye to several sentries counts once for each
  uint32 goodbye_count = 16;
  // Unique remote peers of the client that sent the code in the day. A peer that sent several codes counts under each
  uint32 peer_count = 17;
}

// Request for listing fct_peer_goodbye_by_cl_client_daily records
message ListFctPeerGoodbyeByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client of the remote peer from its agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was not known, other for every other agent (libp2p tools, crawlers) (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by code - Goodbye reason code the remote peer sent: 1 client shutdown, 2 irrelevant network, 3 fault/error, 128 unable to verify network, 129 too many peers, 250 peer score too low, 251 banned. Other codes are client specific (ORDER BY column 3 - optional)
  UInt64Filter code = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by reason - Reason text our sentries give the code, such as client has too many peers. Codes they do not know read as unknown goodbye value of N received (optional)
  StringFilter reason = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by goodbye_count - Goodbye messages with the code our sentries received from the client in the day. A peer that says goodbye to several sentries counts once for each (optional)
  UInt32Filter goodbye_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Unique remote peers of the client that sent the code in the day. A peer that sent several codes counts under each (optional)
  UInt32Filter peer_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_goodbye_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerGoodbyeByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_goodbye_by_cl_client_daily records
message ListFctPeerGoodbyeByClClientDailyResponse {
  // The list of fct_peer_goodbye_by_cl_client_daily.
  repeated FctPeerGoodbyeByClClientDaily fct_peer_goodbye_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_goodbye_by_cl_client_daily record by primary key
message GetFctPeerGoodbyeByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_goodbye_by_cl_client_daily record
message GetFctPeerGoodbyeByClClientDailyResponse {
  FctPeerGoodbyeByClClientDaily item = 1;
}

// Query fct_peer_goodbye_by_cl_client_daily data
service FctPeerGoodbyeByClClientDailyService {
  // List records | Daily libp2p Goodbye messages our sentries received from remote peers, by the consensus client of the peer and the reason code it gave for disconnecting. Rows are written once the day is complete. The first day of data and a day after a whole day without goodbyes are left out, as they are partial.
  rpc List(ListFctPeerGoodbyeByClClientDailyRequest) returns (ListFctPeerGoodbyeByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_goodbye_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerGoodbyeByClClientDailyRequest) returns (GetFctPeerGoodbyeByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_goodbye_by_cl_client_daily/{day_start_date}"
    };
  }
}
