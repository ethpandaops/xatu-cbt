syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily gossipsub partial messages adoption by peer client and version, as averages of the hourly peer counts

message FctPeerPartialMessageSupportByClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Client implementation of the peer from its libp2p agent, empty when no heartbeat identified it
  string peer_implementation = 13;
  // Client version of the peer as major.minor.patch, or the raw agent version when it does not parse
  string peer_version = 14;
  // Hours of the day with peer data on the network, the divisor of the averages
  uint32 hour_count = 15;
  // Hourly distinct connected peers, averaged over the hours of the day
  double avg_connected_peer_count = 16;
  // Hourly connected peers that support gossipsub v1.3, averaged over the hours of the day
  double avg_gossipsub_v13_peer_count = 17;
  // Hourly peers seen subscribing to a data column topic by a sentry node that reports the partial flags, averaged over the hours of the day
  double avg_subscribed_peer_count = 18;
  // Hourly subscribed peers that requested partial messages, averaged over the hours of the day
  double avg_requests_partial_peer_count = 19;
  // Hourly subscribed peers that support sending partial messages, averaged over the hours of the day
  double avg_supports_sending_partial_peer_count = 20;
}

// Request for listing fct_peer_partial_message_support_by_client_daily records
message ListFctPeerPartialMessageSupportByClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by peer_implementation - Client implementation of the peer from its libp2p agent, empty when no heartbeat identified it (ORDER BY column 2 - optional)
  StringFilter peer_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by peer_version - Client version of the peer as major.minor.patch, or the raw agent version when it does not parse (ORDER BY column 3 - optional)
  StringFilter peer_version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hour_count - Hours of the day with peer data on the network, the divisor of the averages (optional)
  UInt32Filter hour_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_connected_peer_count - Hourly distinct connected peers, averaged over the hours of the day (optional)
  google.protobuf.DoubleValue avg_connected_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_gossipsub_v13_peer_count - Hourly connected peers that support gossipsub v1.3, averaged over the hours of the day (optional)
  google.protobuf.DoubleValue avg_gossipsub_v13_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_subscribed_peer_count - Hourly peers seen subscribing to a data column topic by a sentry node that reports the partial flags, averaged over the hours of the day (optional)
  google.protobuf.DoubleValue avg_subscribed_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_requests_partial_peer_count - Hourly subscribed peers that requested partial messages, averaged over the hours of the day (optional)
  google.protobuf.DoubleValue avg_requests_partial_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_supports_sending_partial_peer_count - Hourly subscribed peers that support sending partial messages, averaged over the hours of the day (optional)
  google.protobuf.DoubleValue avg_supports_sending_partial_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_partial_message_support_by_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerPartialMessageSupportByClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_partial_message_support_by_client_daily records
message ListFctPeerPartialMessageSupportByClientDailyResponse {
  // The list of fct_peer_partial_message_support_by_client_daily.
  repeated FctPeerPartialMessageSupportByClientDaily fct_peer_partial_message_support_by_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_partial_message_support_by_client_daily record by primary key
message GetFctPeerPartialMessageSupportByClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_partial_message_support_by_client_daily record
message GetFctPeerPartialMessageSupportByClientDailyResponse {
  FctPeerPartialMessageSupportByClientDaily item = 1;
}

// Query fct_peer_partial_message_support_by_client_daily data
service FctPeerPartialMessageSupportByClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerPartialMessageSupportByClientDailyRequest) returns (ListFctPeerPartialMessageSupportByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_partial_message_support_by_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerPartialMessageSupportByClientDailyRequest) returns (GetFctPeerPartialMessageSupportByClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_partial_message_support_by_client_daily/{day_start_date}"
    };
  }
}
