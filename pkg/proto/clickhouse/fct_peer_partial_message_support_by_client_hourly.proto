syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Hourly gossipsub partial messages adoption by peer client and version: connected peers, gossipsub v1.3 support and the partial flags peers set when subscribing to data column topics

message FctPeerPartialMessageSupportByClientHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 12;
  // Client implementation of the peer from its libp2p agent, empty when no heartbeat identified it
  string peer_implementation = 13;
  // Client version of the peer as major.minor.patch, or the raw agent version when it does not parse
  string peer_version = 14;
  // Distinct peers connected to a sentry node during the hour, from heartbeats
  uint32 connected_peer_count = 15;
  // Connected peers that support gossipsub v1.3 (/meshsub/1.3.0), which the partial messages extension requires
  uint32 gossipsub_v13_peer_count = 16;
  // Distinct peers seen subscribing to a data column topic during the hour by a sentry node that reports the partial flags
  uint32 subscribed_peer_count = 17;
  // Subscribed peers that requested partial messages on a data column topic
  uint32 requests_partial_peer_count = 18;
  // Subscribed peers that support sending partial messages on a data column topic
  uint32 supports_sending_partial_peer_count = 19;
}

// Request for listing fct_peer_partial_message_support_by_client_hourly records
message ListFctPeerPartialMessageSupportByClientHourlyRequest {
  // Filter by hour_start_date_time - The wall clock time at the start of the hour (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by peer_implementation - Client implementation of the peer from its libp2p agent, empty when no heartbeat identified it (ORDER BY column 2 - optional)
  StringFilter peer_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by peer_version - Client version of the peer as major.minor.patch, or the raw agent version when it does not parse (ORDER BY column 3 - optional)
  StringFilter peer_version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by connected_peer_count - Distinct peers connected to a sentry node during the hour, from heartbeats (optional)
  UInt32Filter connected_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gossipsub_v13_peer_count - Connected peers that support gossipsub v1.3 (/meshsub/1.3.0), which the partial messages extension requires (optional)
  UInt32Filter gossipsub_v13_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by subscribed_peer_count - Distinct peers seen subscribing to a data column topic during the hour by a sentry node that reports the partial flags (optional)
  UInt32Filter subscribed_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by requests_partial_peer_count - Subscribed peers that requested partial messages on a data column topic (optional)
  UInt32Filter requests_partial_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by supports_sending_partial_peer_count - Subscribed peers that support sending partial messages on a data column topic (optional)
  UInt32Filter supports_sending_partial_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_partial_message_support_by_client_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerPartialMessageSupportByClientHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_partial_message_support_by_client_hourly records
message ListFctPeerPartialMessageSupportByClientHourlyResponse {
  // The list of fct_peer_partial_message_support_by_client_hourly.
  repeated FctPeerPartialMessageSupportByClientHourly fct_peer_partial_message_support_by_client_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_partial_message_support_by_client_hourly record by primary key
message GetFctPeerPartialMessageSupportByClientHourlyRequest {
  // The wall clock time at the start of the hour
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_peer_partial_message_support_by_client_hourly record
message GetFctPeerPartialMessageSupportByClientHourlyResponse {
  FctPeerPartialMessageSupportByClientHourly item = 1;
}

// Query fct_peer_partial_message_support_by_client_hourly data
service FctPeerPartialMessageSupportByClientHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerPartialMessageSupportByClientHourlyRequest) returns (ListFctPeerPartialMessageSupportByClientHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_partial_message_support_by_client_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctPeerPartialMessageSupportByClientHourlyRequest) returns (GetFctPeerPartialMessageSupportByClientHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_partial_message_support_by_client_hourly/{hour_start_date_time}"
    };
  }
}
