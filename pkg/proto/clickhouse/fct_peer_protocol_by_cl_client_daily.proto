syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily libp2p protocol support by consensus client. Consensus peers our libp2p sentries saw in the day (heartbeats and identify exchanges), one count per peer with its latest agent and address. Crawlers, probes, light clients and our own sentries are excluded. Protocols fewer than 3 of the client peers support are excluded.

message FctPeerProtocolByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the peer agent (erigon reported as caplin), unknown when the agent was never seen, other for unparseable names
  string client = 13;
  // libp2p protocol ID, e.g. /meshsub/1.3.0 or /eth2/beacon_chain/req/status/2/ssz_snappy
  string protocol = 14;
  // Peers supporting the protocol
  uint32 peer_count = 15;
  // All peers of the client in the day
  uint32 client_peer_count = 16;
}

// Request for listing fct_peer_protocol_by_cl_client_daily records
message ListFctPeerProtocolByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the peer agent (erigon reported as caplin), unknown when the agent was never seen, other for unparseable names (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by protocol - libp2p protocol ID, e.g. /meshsub/1.3.0 or /eth2/beacon_chain/req/status/2/ssz_snappy (ORDER BY column 3 - optional)
  StringFilter protocol = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers supporting the protocol (optional)
  UInt32Filter peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by client_peer_count - All peers of the client in the day (optional)
  UInt32Filter client_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_protocol_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerProtocolByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_protocol_by_cl_client_daily records
message ListFctPeerProtocolByClClientDailyResponse {
  // The list of fct_peer_protocol_by_cl_client_daily.
  repeated FctPeerProtocolByClClientDaily fct_peer_protocol_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_protocol_by_cl_client_daily record by primary key
message GetFctPeerProtocolByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_protocol_by_cl_client_daily record
message GetFctPeerProtocolByClClientDailyResponse {
  FctPeerProtocolByClClientDaily item = 1;
}

// Query fct_peer_protocol_by_cl_client_daily data
service FctPeerProtocolByClClientDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctPeerProtocolByClClientDailyRequest) returns (ListFctPeerProtocolByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_protocol_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerProtocolByClClientDailyRequest) returns (GetFctPeerProtocolByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_protocol_by_cl_client_daily/{day_start_date}"
    };
  }
}
