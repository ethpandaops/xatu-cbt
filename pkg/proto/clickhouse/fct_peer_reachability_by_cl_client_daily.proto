syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peer reachability by client: peers our libp2p sentries dialled or that only connected in, QUIC, and ENR address mismatches.
message FctPeerReachabilityByClClientDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent
  string client = 13;
  // Peers our sentries saw in the day
  uint32 peer_count = 14;
  // Peers our sentries dialled (outbound connections), so publicly reachable
  uint32 dialled_peer_count = 15;
  // Peers that only connected to our sentries and were never dialled
  uint32 inbound_only_peer_count = 16;
  // Peers connected to over QUIC
  uint32 quic_connected_peer_count = 17;
  // Peers advertising a QUIC listen address in identify
  uint32 quic_listen_peer_count = 18;
  // Peers our discovery crawler also dialled from their ENR
  uint32 enr_peer_count = 19;
  // Of those, peers whose ENR advertises another address than the one our sentries connected to
  uint32 enr_ip_mismatch_peer_count = 20;
}

// Request for listing fct_peer_reachability_by_cl_client_daily records
message ListFctPeerReachabilityByClClientDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by client - Consensus client from the peer agent: lighthouse, lodestar, nimbus, prysm, teku, grandine, caplin (erigon), silver or ethlambda, unknown when the agent was never seen, other for every other agent (ORDER BY column 2 - optional)
  StringFilter client = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers our sentries saw in the day (optional)
  UInt32Filter peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by dialled_peer_count - Peers our sentries dialled (outbound connections), so publicly reachable (optional)
  UInt32Filter dialled_peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by inbound_only_peer_count - Peers that only connected to our sentries and were never dialled (optional)
  UInt32Filter inbound_only_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by quic_connected_peer_count - Peers connected to over QUIC (optional)
  UInt32Filter quic_connected_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by quic_listen_peer_count - Peers advertising a QUIC listen address in identify (optional)
  UInt32Filter quic_listen_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by enr_peer_count - Peers our discovery crawler also dialled from their ENR (optional)
  UInt32Filter enr_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by enr_ip_mismatch_peer_count - Of those, peers whose ENR advertises another address than the one our sentries connected to (optional)
  UInt32Filter enr_ip_mismatch_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_reachability_by_cl_client_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerReachabilityByClClientDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_reachability_by_cl_client_daily records
message ListFctPeerReachabilityByClClientDailyResponse {
  // The list of fct_peer_reachability_by_cl_client_daily.
  repeated FctPeerReachabilityByClClientDaily fct_peer_reachability_by_cl_client_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_reachability_by_cl_client_daily record by primary key
message GetFctPeerReachabilityByClClientDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_reachability_by_cl_client_daily record
message GetFctPeerReachabilityByClClientDailyResponse {
  FctPeerReachabilityByClClientDaily item = 1;
}

// Query fct_peer_reachability_by_cl_client_daily data
service FctPeerReachabilityByClClientDailyService {
  // List records | Daily consensus peer reachability by client: peers our libp2p sentries dialled or that only connected in, QUIC, and ENR address mismatches.
  rpc List(ListFctPeerReachabilityByClClientDailyRequest) returns (ListFctPeerReachabilityByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_reachability_by_cl_client_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerReachabilityByClClientDailyRequest) returns (GetFctPeerReachabilityByClClientDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_reachability_by_cl_client_daily/{day_start_date}"
    };
  }
}
