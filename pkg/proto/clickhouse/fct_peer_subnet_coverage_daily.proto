syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily spread of consensus peers over the 64 attestation and 4 sync subnets they advertise, one row a day: the thinnest, median and thickest attestation subnet, the thinnest without peers on all 64, and the thinnest and thickest sync subnet. Peers as in fct_peer_subnet_daily.
message FctPeerSubnetCoverageDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Peers on all 64 attestation subnets
  uint32 attnets_64_peer_count = 13;
  // Peers on the thinnest attestation subnet
  uint32 min_attestation_subnet_peer_count = 14;
  // The thinnest attestation subnet, the lowest index on a tie
  uint32 min_attestation_subnet_id = 15;
  // Median peers per attestation subnet (the lower of the middle two)
  uint32 median_attestation_subnet_peer_count = 16;
  // Peers on the thickest attestation subnet
  uint32 max_attestation_subnet_peer_count = 17;
  // Fewest peers any attestation subnet has without the peers on all 64
  uint32 min_attestation_subnet_partial_peer_count = 18;
  // Peers on the thinnest sync committee subnet
  uint32 min_sync_subnet_peer_count = 19;
  // Peers on the thickest sync committee subnet
  uint32 max_sync_subnet_peer_count = 20;
}

// Request for listing fct_peer_subnet_coverage_daily records
message ListFctPeerSubnetCoverageDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attnets_64_peer_count - Peers on all 64 attestation subnets (optional)
  UInt32Filter attnets_64_peer_count = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_attestation_subnet_peer_count - Peers on the thinnest attestation subnet (optional)
  UInt32Filter min_attestation_subnet_peer_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_attestation_subnet_id - The thinnest attestation subnet, the lowest index on a tie (optional)
  UInt32Filter min_attestation_subnet_id = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by median_attestation_subnet_peer_count - Median peers per attestation subnet (the lower of the middle two) (optional)
  UInt32Filter median_attestation_subnet_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_attestation_subnet_peer_count - Peers on the thickest attestation subnet (optional)
  UInt32Filter max_attestation_subnet_peer_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_attestation_subnet_partial_peer_count - Fewest peers any attestation subnet has without the peers on all 64 (optional)
  UInt32Filter min_attestation_subnet_partial_peer_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by min_sync_subnet_peer_count - Peers on the thinnest sync committee subnet (optional)
  UInt32Filter min_sync_subnet_peer_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by max_sync_subnet_peer_count - Peers on the thickest sync committee subnet (optional)
  UInt32Filter max_sync_subnet_peer_count = 10 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_subnet_coverage_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerSubnetCoverageDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_subnet_coverage_daily records
message ListFctPeerSubnetCoverageDailyResponse {
  // The list of fct_peer_subnet_coverage_daily.
  repeated FctPeerSubnetCoverageDaily fct_peer_subnet_coverage_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_subnet_coverage_daily record by primary key
message GetFctPeerSubnetCoverageDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_subnet_coverage_daily record
message GetFctPeerSubnetCoverageDailyResponse {
  FctPeerSubnetCoverageDaily item = 1;
}

// Query fct_peer_subnet_coverage_daily data
service FctPeerSubnetCoverageDailyService {
  // List records | Daily spread of consensus peers over the 64 attestation and 4 sync subnets they advertise, one row a day: the thinnest, median and thickest attestation subnet, the thinnest without peers on all 64, and the thinnest and thickest sync subnet. Peers as in fct_peer_subnet_daily.
  rpc List(ListFctPeerSubnetCoverageDailyRequest) returns (ListFctPeerSubnetCoverageDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_subnet_coverage_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerSubnetCoverageDailyRequest) returns (GetFctPeerSubnetCoverageDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_subnet_coverage_daily/{day_start_date}"
    };
  }
}
