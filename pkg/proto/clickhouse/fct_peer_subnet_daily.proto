syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Daily consensus peers by the attestation and sync subnets they last advertised in a metadata response to our libp2p sentries, 68 rows a day. Crawlers, probes, light clients and our own sentries are excluded.
message FctPeerSubnetDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // attestation (64 subnets) or sync (4 sync committee subnets)
  string subnet_type = 13;
  // Subnet index, 0 to 63 for attestation and 0 to 3 for sync
  uint32 subnet_id = 14;
  // Peers that last advertised the subnet in the day
  uint32 peer_count = 15;
  // Of those, peers on every subnet of the type, the same on every row of the type
  uint32 all_subnets_peer_count = 16;
}

// Request for listing fct_peer_subnet_daily records
message ListFctPeerSubnetDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by subnet_type - attestation (64 subnets) or sync (4 sync committee subnets) (ORDER BY column 2 - optional)
  StringFilter subnet_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by subnet_id - Subnet index, 0 to 63 for attestation and 0 to 3 for sync (ORDER BY column 3 - optional)
  UInt32Filter subnet_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peer_count - Peers that last advertised the subnet in the day (optional)
  UInt32Filter peer_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by all_subnets_peer_count - Of those, peers on every subnet of the type, the same on every row of the type (optional)
  UInt32Filter all_subnets_peer_count = 6 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_peer_subnet_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctPeerSubnetDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_peer_subnet_daily records
message ListFctPeerSubnetDailyResponse {
  // The list of fct_peer_subnet_daily.
  repeated FctPeerSubnetDaily fct_peer_subnet_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_peer_subnet_daily record by primary key
message GetFctPeerSubnetDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_peer_subnet_daily record
message GetFctPeerSubnetDailyResponse {
  FctPeerSubnetDaily item = 1;
}

// Query fct_peer_subnet_daily data
service FctPeerSubnetDailyService {
  // List records | Daily consensus peers by the attestation and sync subnets they last advertised in a metadata response to our libp2p sentries, 68 rows a day. Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListFctPeerSubnetDailyRequest) returns (ListFctPeerSubnetDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_subnet_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctPeerSubnetDailyRequest) returns (GetFctPeerSubnetDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_peer_subnet_daily/{day_start_date}"
    };
  }
}
