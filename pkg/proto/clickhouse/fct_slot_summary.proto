syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// One row per slot from fct_block_proposer: proposed, missed or orphaned, the proposer and entity, the block number, gas, transactions, blobs and the proposer clients from the graffiti. MEV relays, builder and value are in int_block_mev_canonical
message FctSlotSummary {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // canonical when the block is on the finalized chain, missed when no block was proposed, orphaned when the head saw a block the chain did not keep (before the head data starts an orphaned slot shows as missed)
  string status = 16;
  // The beacon block root, NULL for a missed slot
  google.protobuf.StringValue block_root = 17;
  // The validator index of the proposer
  uint32 proposer_validator_index = 18;
  // The staking entity of the proposer, from its current dim_node mapping, NULL when unknown
  google.protobuf.StringValue entity = 19;
  // The execution block number, NULL for a missed slot or a block without an execution payload
  google.protobuf.UInt32Value block_number = 20;
  // Execution gas used by the block, NULL for a missed slot
  google.protobuf.UInt64Value gas_used = 21;
  // Execution gas limit of the block, NULL for a missed slot
  google.protobuf.UInt64Value gas_limit = 22;
  // Number of transactions in the block, NULL for a missed slot
  google.protobuf.UInt32Value transaction_count = 23;
  // Number of blobs in the block, NULL for a missed slot
  google.protobuf.UInt32Value blob_count = 24;
  // Consensus client of the proposer, parsed from the block graffiti (unknown when the graffiti does not say), NULL for a missed or orphaned slot
  google.protobuf.StringValue consensus_client = 25;
  // Execution client of the proposer, parsed from the block graffiti (unknown when the graffiti does not say), NULL for a missed or orphaned slot
  google.protobuf.StringValue execution_client = 26;
}

// Request for listing fct_slot_summary records
message ListFctSlotSummaryRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 3 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_slot", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by status - canonical when the block is on the finalized chain, missed when no block was proposed, orphaned when the head saw a block the chain did not keep (before the head data starts an orphaned slot shows as missed) (optional)
  StringFilter status = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_root - The beacon block root, NULL for a missed slot (optional)
  NullableStringFilter block_root = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_validator_index - The validator index of the proposer (optional)
  UInt32Filter proposer_validator_index = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by entity - The staking entity of the proposer, from its current dim_node mapping, NULL when unknown (optional)
  NullableStringFilter entity = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_number - The execution block number, NULL for a missed slot or a block without an execution payload (optional)
  NullableUInt32Filter block_number = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_used - Execution gas used by the block, NULL for a missed slot (optional)
  NullableUInt64Filter gas_used = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_limit - Execution gas limit of the block, NULL for a missed slot (optional)
  NullableUInt64Filter gas_limit = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by transaction_count - Number of transactions in the block, NULL for a missed slot (optional)
  NullableUInt32Filter transaction_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_count - Number of blobs in the block, NULL for a missed slot (optional)
  NullableUInt32Filter blob_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by consensus_client - Consensus client of the proposer, parsed from the block graffiti (unknown when the graffiti does not say), NULL for a missed or orphaned slot (optional)
  NullableStringFilter consensus_client = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by execution_client - Execution client of the proposer, parsed from the block graffiti (unknown when the graffiti does not say), NULL for a missed or orphaned slot (optional)
  NullableStringFilter execution_client = 16 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_slot_summary to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 17 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctSlotSummary` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 18 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 19 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_slot_summary records
message ListFctSlotSummaryResponse {
  // The list of fct_slot_summary.
  repeated FctSlotSummary fct_slot_summary = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_slot_summary record by primary key
message GetFctSlotSummaryRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_slot_summary record
message GetFctSlotSummaryResponse {
  FctSlotSummary item = 1;
}

// Query fct_slot_summary data
service FctSlotSummaryService {
  // List records | One row per slot from fct_block_proposer: proposed, missed or orphaned, the proposer and entity, the block number, gas, transactions, blobs and the proposer clients from the graffiti. MEV relays, builder and value are in int_block_mev_canonical
  rpc List(ListFctSlotSummaryRequest) returns (ListFctSlotSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_slot_summary"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctSlotSummaryRequest) returns (GetFctSlotSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_slot_summary/{slot_start_date_time}"
    };
  }
}
