}

// Response for getting a single fct_sync_committee_participation_by_validator_weekly record
message GetFctSyncCommitteeParticipationByValidatorWeeklyResponse {
  FctSyncCommitteeParticipationByValidatorWeekly item = 1;
}

// Query fct_sync_committee_participation_by_validator_weekly data
service FctSyncCommitteeParticipationByValidatorWeeklyService {
