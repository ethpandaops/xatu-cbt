option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Weekly aggregation of per-validator sync committee participation

message FctSyncCommitteeParticipationByValidatorWeekly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The start of the week (Monday, UTC) for this aggregation
  string week_start_date = 12;
  // Index of the validator
  uint32 validator_index = 13;
  // Total sync committee slots for the validator in this week
  uint32 total_slots = 14;
  // Number of slots where validator participated
  uint32 participated_count = 15;
  // Number of slots where validator missed
  uint32 missed_count = 16;
}

