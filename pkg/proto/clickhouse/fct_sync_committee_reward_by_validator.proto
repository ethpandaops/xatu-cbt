syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Sync committee reward of each validator in each block

message FctSyncCommitteeRewardByValidator {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The index of the validator
  uint32 validator_index = 15;
  // Sync committee reward in Gwei (negative for a missed vote)
  int64 reward = 16;
}

// Request for listing fct_sync_committee_reward_by_validator records
message ListFctSyncCommitteeRewardByValidatorRequest {
  // Filter by validator_index - The index of the validator (PRIMARY KEY - required)
  UInt32Filter validator_index = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number (optional)
  UInt32Filter slot = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by reward - Sync committee reward in Gwei (negative for a missed vote) (optional)
  Int64Filter reward = 6 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_sync_committee_reward_by_validator to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctSyncCommitteeRewardByValidator` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_sync_committee_reward_by_validator records
message ListFctSyncCommitteeRewardByValidatorResponse {
  // The list of fct_sync_committee_reward_by_validator.
  repeated FctSyncCommitteeRewardByValidator fct_sync_committee_reward_by_validator = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_sync_committee_reward_by_validator record by primary key
message GetFctSyncCommitteeRewardByValidatorRequest {
  // The index of the validator
  uint32 validator_index = 1; // Primary key (required)
}

// Response for getting a single fct_sync_committee_reward_by_validator record
message GetFctSyncCommitteeRewardByValidatorResponse {
  FctSyncCommitteeRewardByValidator item = 1;
}

// Query fct_sync_committee_reward_by_validator data
service FctSyncCommitteeRewardByValidatorService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctSyncCommitteeRewardByValidatorRequest) returns (ListFctSyncCommitteeRewardByValidatorResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_sync_committee_reward_by_validator"
    };
  }
  // Get record | Retrieve a single record by validator_index
  rpc Get(GetFctSyncCommitteeRewardByValidatorRequest) returns (GetFctSyncCommitteeRewardByValidatorResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_sync_committee_reward_by_validator/{validator_index}"
    };
  }
}
