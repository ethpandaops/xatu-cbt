syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Sync committee rewards and penalties per validator per day

message FctSyncCommitteeRewardByValidatorDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // The index of the validator
  uint32 validator_index = 13;
  // Blocks of the day with a sync committee reward for the validator
  uint32 slot_count = 14;
  // Net sync committee reward in Gwei
  int64 total = 15;
  // Sum of positive rewards in Gwei
  int64 reward = 16;
  // Sum of negative rewards (missed votes) in Gwei
  int64 penalty = 17;
  // Blocks with a negative reward
  uint32 penalized_slot_count = 18;
}

// Request for listing fct_sync_committee_reward_by_validator_daily records
message ListFctSyncCommitteeRewardByValidatorDailyRequest {
  // Filter by validator_index - The index of the validator (PRIMARY KEY - required)
  UInt32Filter validator_index = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by day_start_date - The day (UTC) (ORDER BY column 2 - optional)
  StringFilter day_start_date = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot_count - Blocks of the day with a sync committee reward for the validator (optional)
  UInt32Filter slot_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total - Net sync committee reward in Gwei (optional)
  Int64Filter total = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by reward - Sum of positive rewards in Gwei (optional)
  Int64Filter reward = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by penalty - Sum of negative rewards (missed votes) in Gwei (optional)
  Int64Filter penalty = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by penalized_slot_count - Blocks with a negative reward (optional)
  UInt32Filter penalized_slot_count = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_sync_committee_reward_by_validator_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctSyncCommitteeRewardByValidatorDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_sync_committee_reward_by_validator_daily records
message ListFctSyncCommitteeRewardByValidatorDailyResponse {
  // The list of fct_sync_committee_reward_by_validator_daily.
  repeated FctSyncCommitteeRewardByValidatorDaily fct_sync_committee_reward_by_validator_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_sync_committee_reward_by_validator_daily record by primary key
message GetFctSyncCommitteeRewardByValidatorDailyRequest {
  // The index of the validator
  uint32 validator_index = 1; // Primary key (required)
}

// Response for getting a single fct_sync_committee_reward_by_validator_daily record
message GetFctSyncCommitteeRewardByValidatorDailyResponse {
  FctSyncCommitteeRewardByValidatorDaily item = 1;
}

// Query fct_sync_committee_reward_by_validator_daily data
service FctSyncCommitteeRewardByValidatorDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctSyncCommitteeRewardByValidatorDailyRequest) returns (ListFctSyncCommitteeRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_sync_committee_reward_by_validator_daily"
    };
  }
  // Get record | Retrieve a single record by validator_index
  rpc Get(GetFctSyncCommitteeRewardByValidatorDailyRequest) returns (GetFctSyncCommitteeRewardByValidatorDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_sync_committee_reward_by_validator_daily/{validator_index}"
    };
  }
}
