syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Hourly blob transaction announcements received by mimicry clients, per announcing peer execution client
message FctTransactionBlobAnnouncementByElClientHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour period, bucketed by announcement receive time
  uint32 hour_start_date_time = 12;
  // Execution client of the announcing peers
  string peer_implementation = 13;
  // Blob transaction announcements received from peers running this client
  uint64 announcement_count = 14;
  // Distinct blob transaction hashes announced by peers running this client
  uint64 hash_count = 15;
  // Distinct mimicry clients that received announcements from this client
  uint64 unique_sentries = 16;
  // Blob transaction hashes whose earliest announcement this hour came from a peer running this client
  uint64 first_announcer_hash_count = 17;
}

// Request for listing fct_transaction_blob_announcement_by_el_client_hourly records
message ListFctTransactionBlobAnnouncementByElClientHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour period, bucketed by announcement receive time (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by peer_implementation - Execution client of the announcing peers (ORDER BY column 2 - optional)
  StringFilter peer_implementation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by announcement_count - Blob transaction announcements received from peers running this client (optional)
  UInt64Filter announcement_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hash_count - Distinct blob transaction hashes announced by peers running this client (optional)
  UInt64Filter hash_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unique_sentries - Distinct mimicry clients that received announcements from this client (optional)
  UInt64Filter unique_sentries = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by first_announcer_hash_count - Blob transaction hashes whose earliest announcement this hour came from a peer running this client (optional)
  UInt64Filter first_announcer_hash_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_transaction_blob_announcement_by_el_client_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctTransactionBlobAnnouncementByElClientHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_transaction_blob_announcement_by_el_client_hourly records
message ListFctTransactionBlobAnnouncementByElClientHourlyResponse {
  // The list of fct_transaction_blob_announcement_by_el_client_hourly.
  repeated FctTransactionBlobAnnouncementByElClientHourly fct_transaction_blob_announcement_by_el_client_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_transaction_blob_announcement_by_el_client_hourly record by primary key
message GetFctTransactionBlobAnnouncementByElClientHourlyRequest {
  // Start of the hour period, bucketed by announcement receive time
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_transaction_blob_announcement_by_el_client_hourly record
message GetFctTransactionBlobAnnouncementByElClientHourlyResponse {
  FctTransactionBlobAnnouncementByElClientHourly item = 1;
}

// Query fct_transaction_blob_announcement_by_el_client_hourly data
service FctTransactionBlobAnnouncementByElClientHourlyService {
  // List records | Hourly blob transaction announcements received by mimicry clients, per announcing peer execution client
  rpc List(ListFctTransactionBlobAnnouncementByElClientHourlyRequest) returns (ListFctTransactionBlobAnnouncementByElClientHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_blob_announcement_by_el_client_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctTransactionBlobAnnouncementByElClientHourlyRequest) returns (GetFctTransactionBlobAnnouncementByElClientHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_blob_announcement_by_el_client_hourly/{hour_start_date_time}"
    };
  }
}
