syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// One row per transaction included in a canonical beacon block execution payload. Carries no mempool or relay context so it can cover the full post-Merge history

message FctTransactionInclusion {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number of the beacon block containing the transaction
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root hash
  string block_root = 16;
  // The beacon block version
  string block_version = 17;
  // The execution block number, null when the block is not yet present in fct_block
  google.protobuf.UInt64Value block_number = 18;
  // The position of the transaction in the execution payload
  uint32 position = 19;
  // The transaction hash
  string hash = 20;
  // The address of the account that sent the transaction
  string from = 21;
  // The address of the transaction recipient, null for contract creation
  google.protobuf.StringValue to = 22;
  // The nonce of the sender account at the time of the transaction
  uint64 nonce = 23;
  // The type of the transaction
  uint32 type = 24;
  // The maximum gas provided for the transaction execution
  uint64 gas = 25;
  // The gas price of the transaction in wei
  string gas_price = 26;
  // The priority fee (tip) the user has set for the transaction in wei
  google.protobuf.StringValue gas_tip_cap = 27;
  // The max fee the user has set for the transaction in wei
  google.protobuf.StringValue gas_fee_cap = 28;
  // The value transferred with the transaction in wei
  string value = 29;
  // The size of the transaction data in bytes
  uint32 size = 30;
  // The size of the call data of the transaction in bytes
  uint32 call_data_size = 31;
  // The maximum gas provided for the blob transaction execution
  google.protobuf.UInt64Value blob_gas = 32;
  // The max blob fee the user has set for the transaction in wei
  google.protobuf.StringValue blob_gas_fee_cap = 33;
  // The hashes of the blob commitments for blob transactions
  repeated string blob_hashes = 34;
  // Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern
  bool is_cancel_shape = 35;
}

// Request for listing fct_transaction_inclusion records
message ListFctTransactionInclusionRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: hash, from)
  UInt32Filter slot_start_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by block_root - The beacon block root hash (ORDER BY column 2 - optional)
  StringFilter block_root = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by position - The position of the transaction in the execution payload (ORDER BY column 3 - optional)
  UInt32Filter position = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - The slot number of the beacon block containing the transaction (optional)
  UInt32Filter slot = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_version - The beacon block version (optional)
  StringFilter block_version = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_number - The execution block number, null when the block is not yet present in fct_block (optional)
  NullableUInt64Filter block_number = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hash - The transaction hash (PROJECTION: p_by_hash - alternative to slot_start_date_time)
  StringFilter hash = 10 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_hash", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by from - The address of the account that sent the transaction (PROJECTION: p_by_nonce_group - alternative to slot_start_date_time)
  StringFilter from = 11 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_nonce_group", (clickhouse.v1.projection_alternative_for) = "slot_start_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by to - The address of the transaction recipient, null for contract creation (optional)
  NullableStringFilter to = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by nonce - The nonce of the sender account at the time of the transaction (optional)
  UInt64Filter nonce = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type - The type of the transaction (optional)
  UInt32Filter type = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas - The maximum gas provided for the transaction execution (optional)
  UInt64Filter gas = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_price - The gas price of the transaction in wei (optional)
  StringFilter gas_price = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_tip_cap - The priority fee (tip) the user has set for the transaction in wei (optional)
  NullableStringFilter gas_tip_cap = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_fee_cap - The max fee the user has set for the transaction in wei (optional)
  NullableStringFilter gas_fee_cap = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by value - The value transferred with the transaction in wei (optional)
  StringFilter value = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by size - The size of the transaction data in bytes (optional)
  UInt32Filter size = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by call_data_size - The size of the call data of the transaction in bytes (optional)
  UInt32Filter call_data_size = 21 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_gas - The maximum gas provided for the blob transaction execution (optional)
  NullableUInt64Filter blob_gas = 22 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_gas_fee_cap - The max blob fee the user has set for the transaction in wei (optional)
  NullableStringFilter blob_gas_fee_cap = 23 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_hashes - The hashes of the blob commitments for blob transactions (optional)
  ArrayStringFilter blob_hashes = 24 [(google.api.field_behavior) = OPTIONAL];
  // Filter by is_cancel_shape - Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern (optional)
  BoolFilter is_cancel_shape = 25 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_transaction_inclusion to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 26 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctTransactionInclusion` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 27 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 28 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_transaction_inclusion records
message ListFctTransactionInclusionResponse {
  // The list of fct_transaction_inclusion.
  repeated FctTransactionInclusion fct_transaction_inclusion = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_transaction_inclusion record by primary key
message GetFctTransactionInclusionRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_transaction_inclusion record
message GetFctTransactionInclusionResponse {
  FctTransactionInclusion item = 1;
}

// Query fct_transaction_inclusion data
service FctTransactionInclusionService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctTransactionInclusionRequest) returns (ListFctTransactionInclusionResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_inclusion"
    };
  }
  // Get record | Retrieve a single record by slot_start_date_time
  rpc Get(GetFctTransactionInclusionRequest) returns (GetFctTransactionInclusionResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_inclusion/{slot_start_date_time}"
    };
  }
}
