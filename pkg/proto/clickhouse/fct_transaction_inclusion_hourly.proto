syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Hourly counts of transactions included in canonical blocks, split by build path and transaction type

message FctTransactionInclusionHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour period, bucketed by inclusion slot time
  uint32 hour_start_date_time = 12;
  // Number of transactions included in canonical blocks this hour
  uint64 included_count = 13;
  // Included transactions whose block matched a known relay payload-delivered record
  uint64 relay_delivered_count = 14;
  // Included transactions whose block matched no known relay payload-delivered record. Not proof the block was locally built
  uint64 unknown_build_count = 15;
  // Included legacy type 0 transactions
  uint64 type0_count = 16;
  // Included access list type 1 transactions
  uint64 type1_count = 17;
  // Included dynamic fee type 2 transactions
  uint64 type2_count = 18;
  // Included blob type 3 transactions
  uint64 type3_count = 19;
  // Included set code type 4 transactions
  uint64 type4_count = 20;
  // Included transactions of any other type
  uint64 type_other_count = 21;
  // Total blob commitments across included transactions this hour
  uint64 blob_count = 22;
  // Included transactions with no recipient address
  uint64 contract_creation_count = 23;
  // Included transactions that are self-transfers of zero value, the common wallet cancellation pattern
  uint64 cancel_shape_count = 24;
  // Distinct sender addresses across included transactions this hour
  uint64 unique_senders = 25;
}

// Request for listing fct_transaction_inclusion_hourly records
message ListFctTransactionInclusionHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour period, bucketed by inclusion slot time (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_count - Number of transactions included in canonical blocks this hour (optional)
  UInt64Filter included_count = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by relay_delivered_count - Included transactions whose block matched a known relay payload-delivered record (optional)
  UInt64Filter relay_delivered_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unknown_build_count - Included transactions whose block matched no known relay payload-delivered record. Not proof the block was locally built (optional)
  UInt64Filter unknown_build_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type0_count - Included legacy type 0 transactions (optional)
  UInt64Filter type0_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type1_count - Included access list type 1 transactions (optional)
  UInt64Filter type1_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type2_count - Included dynamic fee type 2 transactions (optional)
  UInt64Filter type2_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type3_count - Included blob type 3 transactions (optional)
  UInt64Filter type3_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type4_count - Included set code type 4 transactions (optional)
  UInt64Filter type4_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type_other_count - Included transactions of any other type (optional)
  UInt64Filter type_other_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_count - Total blob commitments across included transactions this hour (optional)
  UInt64Filter blob_count = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by contract_creation_count - Included transactions with no recipient address (optional)
  UInt64Filter contract_creation_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by cancel_shape_count - Included transactions that are self-transfers of zero value, the common wallet cancellation pattern (optional)
  UInt64Filter cancel_shape_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by unique_senders - Distinct sender addresses across included transactions this hour (optional)
  UInt64Filter unique_senders = 15 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_transaction_inclusion_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 16 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctTransactionInclusionHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 17 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 18 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_transaction_inclusion_hourly records
message ListFctTransactionInclusionHourlyResponse {
  // The list of fct_transaction_inclusion_hourly.
  repeated FctTransactionInclusionHourly fct_transaction_inclusion_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_transaction_inclusion_hourly record by primary key
message GetFctTransactionInclusionHourlyRequest {
  // Start of the hour period, bucketed by inclusion slot time
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_transaction_inclusion_hourly record
message GetFctTransactionInclusionHourlyResponse {
  FctTransactionInclusionHourly item = 1;
}

// Query fct_transaction_inclusion_hourly data
service FctTransactionInclusionHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctTransactionInclusionHourlyRequest) returns (ListFctTransactionInclusionHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_inclusion_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctTransactionInclusionHourlyRequest) returns (GetFctTransactionInclusionHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_inclusion_hourly/{hour_start_date_time}"
    };
  }
}
