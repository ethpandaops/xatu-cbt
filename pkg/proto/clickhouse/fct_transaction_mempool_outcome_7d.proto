syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// One immutable row per transaction hash observed in the public mempool, stating its fixed-horizon outcome within 7 days of first sighting. An observation episode starts when a hash is sighted with no sightings in the preceding 7 days. A hash re-sighted after more than 7 days of silence starts a new episode and a new row

message FctTransactionMempoolOutcome7d {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Earliest sighting of the transaction within its observation episode, the anchor of the 7 day horizon
  int64 first_seen_date_time = 12;
  // The transaction hash
  string hash = 13;
  // The address of the account that sent the transaction
  string from = 14;
  // The address of the transaction recipient, null for contract creation
  google.protobuf.StringValue to = 15;
  // The nonce of the sender account at the time of the transaction
  uint64 nonce = 16;
  // The type of the transaction
  google.protobuf.UInt32Value type = 17;
  // The maximum gas provided for the transaction execution
  uint64 gas = 18;
  // The gas price of the transaction in wei
  string gas_price = 19;
  // The priority fee (tip) the user has set for the transaction in wei
  google.protobuf.StringValue gas_tip_cap = 20;
  // The max fee the user has set for the transaction in wei
  google.protobuf.StringValue gas_fee_cap = 21;
  // The value transferred with the transaction in wei
  string value = 22;
  // The size of the transaction data in bytes
  uint32 size = 23;
  // The size of the call data of the transaction in bytes
  uint32 call_data_size = 24;
  // The maximum gas provided for the blob transaction execution
  google.protobuf.UInt64Value blob_gas = 25;
  // The max blob fee the user has set for the transaction in wei
  google.protobuf.StringValue blob_gas_fee_cap = 26;
  // The hashes of the blob commitments for blob transactions
  repeated string blob_hashes = 27;
  // Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern
  bool is_cancel_shape = 28;
  // Latest sighting of the transaction within the 7 day horizon
  int64 last_seen_date_time = 29;
  // Number of sightings within the 7 day horizon across all sentries
  uint32 sighting_count = 30;
  // Peak number of distinct sentries sighting the transaction within any single hour of the horizon
  uint32 peak_hourly_unique_sentries = 31;
  // Outcome within 7 days of first sighting: included, nonce_consumed (a different transaction with the same from and nonce was included) or unincluded. The statement is fixed to the horizon and remains true even if the transaction is included later
  string outcome = 32;
  // When the outcome was determined: the inclusion slot start for included, the winner inclusion slot start for nonce_consumed, or first_seen_date_time plus 7 days for unincluded
  int64 resolution_date_time = 33;
  // The slot of the beacon block that included the transaction, when outcome is included
  google.protobuf.UInt32Value included_slot = 34;
  // The wall clock time when the inclusion slot started, when outcome is included
  google.protobuf.UInt32Value included_slot_start_date_time = 35;
  // The beacon block root of the including block, when outcome is included
  google.protobuf.StringValue included_block_root = 36;
  // The position of the transaction in the execution payload, when outcome is included
  google.protobuf.UInt32Value included_position = 37;
  // Milliseconds from first sighting to the inclusion slot start, when outcome is included. Negative when the transaction was first sighted after its inclusion slot started
  google.protobuf.Int64Value wait_ms = 38;
  // Whether the including block matched a known relay payload-delivered record, when outcome is included. False is not proof the block was locally built
  google.protobuf.BoolValue included_via_known_relay = 39;
  // The hash of the transaction that consumed the nonce, when outcome is nonce_consumed
  google.protobuf.StringValue winner_hash = 40;
  // The wall clock time when the winner inclusion slot started, when outcome is nonce_consumed
  google.protobuf.UInt32Value winner_slot_start_date_time = 41;
  // Whether the transaction was first sighted after its nonce had already been consumed by another transaction
  bool observed_after_nonce_consumed = 42;
  // Whether a sighting occurred in the final hour before the 7 day deadline. Sensor evidence of continued circulation, only meaningful when outcome is unincluded
  bool in_mempool_at_deadline = 43;
}

// Request for listing fct_transaction_mempool_outcome_7d records
message ListFctTransactionMempoolOutcome7dRequest {
  // Filter by first_seen_date_time - Earliest sighting of the transaction within its observation episode, the anchor of the 7 day horizon (PRIMARY KEY - required unless using alternatives: hash, from)
  Int64Filter first_seen_date_time = 1 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by hash - The transaction hash (ORDER BY column 2 - optional)
  StringFilter hash = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by from - The address of the account that sent the transaction (PROJECTION: p_by_nonce_group - alternative to first_seen_date_time)
  StringFilter from = 4 [(google.api.field_behavior) = OPTIONAL, (clickhouse.v1.projection_name) = "p_by_nonce_group", (clickhouse.v1.projection_alternative_for) = "first_seen_date_time", (clickhouse.v1.required_group) = "primary_key"];
  // Filter by to - The address of the transaction recipient, null for contract creation (optional)
  NullableStringFilter to = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by nonce - The nonce of the sender account at the time of the transaction (optional)
  UInt64Filter nonce = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by type - The type of the transaction (optional)
  NullableUInt32Filter type = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas - The maximum gas provided for the transaction execution (optional)
  UInt64Filter gas = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_price - The gas price of the transaction in wei (optional)
  StringFilter gas_price = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_tip_cap - The priority fee (tip) the user has set for the transaction in wei (optional)
  NullableStringFilter gas_tip_cap = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by gas_fee_cap - The max fee the user has set for the transaction in wei (optional)
  NullableStringFilter gas_fee_cap = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by value - The value transferred with the transaction in wei (optional)
  StringFilter value = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by size - The size of the transaction data in bytes (optional)
  UInt32Filter size = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by call_data_size - The size of the call data of the transaction in bytes (optional)
  UInt32Filter call_data_size = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_gas - The maximum gas provided for the blob transaction execution (optional)
  NullableUInt64Filter blob_gas = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_gas_fee_cap - The max blob fee the user has set for the transaction in wei (optional)
  NullableStringFilter blob_gas_fee_cap = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_hashes - The hashes of the blob commitments for blob transactions (optional)
  ArrayStringFilter blob_hashes = 17 [(google.api.field_behavior) = OPTIONAL];
  // Filter by is_cancel_shape - Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern (optional)
  BoolFilter is_cancel_shape = 18 [(google.api.field_behavior) = OPTIONAL];
  // Filter by last_seen_date_time - Latest sighting of the transaction within the 7 day horizon (optional)
  Int64Filter last_seen_date_time = 19 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sighting_count - Number of sightings within the 7 day horizon across all sentries (optional)
  UInt32Filter sighting_count = 20 [(google.api.field_behavior) = OPTIONAL];
  // Filter by peak_hourly_unique_sentries - Peak number of distinct sentries sighting the transaction within any single hour of the horizon (optional)
  UInt32Filter peak_hourly_unique_sentries = 21 [(google.api.field_behavior) = OPTIONAL];
  // Filter by outcome - Outcome within 7 days of first sighting: included, nonce_consumed (a different transaction with the same from and nonce was included) or unincluded. The statement is fixed to the horizon and remains true even if the transaction is included later (optional)
  StringFilter outcome = 22 [(google.api.field_behavior) = OPTIONAL];
  // Filter by resolution_date_time - When the outcome was determined: the inclusion slot start for included, the winner inclusion slot start for nonce_consumed, or first_seen_date_time plus 7 days for unincluded (optional)
  Int64Filter resolution_date_time = 23 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_slot - The slot of the beacon block that included the transaction, when outcome is included (optional)
  NullableUInt32Filter included_slot = 24 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_slot_start_date_time - The wall clock time when the inclusion slot started, when outcome is included (optional)
  NullableUInt32Filter included_slot_start_date_time = 25 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_block_root - The beacon block root of the including block, when outcome is included (optional)
  NullableStringFilter included_block_root = 26 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_position - The position of the transaction in the execution payload, when outcome is included (optional)
  NullableUInt32Filter included_position = 27 [(google.api.field_behavior) = OPTIONAL];
  // Filter by wait_ms - Milliseconds from first sighting to the inclusion slot start, when outcome is included. Negative when the transaction was first sighted after its inclusion slot started (optional)
  NullableInt64Filter wait_ms = 28 [(google.api.field_behavior) = OPTIONAL];
  // Filter by included_via_known_relay - Whether the including block matched a known relay payload-delivered record, when outcome is included. False is not proof the block was locally built (optional)
  NullableBoolFilter included_via_known_relay = 29 [(google.api.field_behavior) = OPTIONAL];
  // Filter by winner_hash - The hash of the transaction that consumed the nonce, when outcome is nonce_consumed (optional)
  NullableStringFilter winner_hash = 30 [(google.api.field_behavior) = OPTIONAL];
  // Filter by winner_slot_start_date_time - The wall clock time when the winner inclusion slot started, when outcome is nonce_consumed (optional)
  NullableUInt32Filter winner_slot_start_date_time = 31 [(google.api.field_behavior) = OPTIONAL];
  // Filter by observed_after_nonce_consumed - Whether the transaction was first sighted after its nonce had already been consumed by another transaction (optional)
  BoolFilter observed_after_nonce_consumed = 32 [(google.api.field_behavior) = OPTIONAL];
  // Filter by in_mempool_at_deadline - Whether a sighting occurred in the final hour before the 7 day deadline. Sensor evidence of continued circulation, only meaningful when outcome is unincluded (optional)
  BoolFilter in_mempool_at_deadline = 33 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_transaction_mempool_outcome_7d to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 34 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctTransactionMempoolOutcome7d` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 35 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 36 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_transaction_mempool_outcome_7d records
message ListFctTransactionMempoolOutcome7dResponse {
  // The list of fct_transaction_mempool_outcome_7d.
  repeated FctTransactionMempoolOutcome7d fct_transaction_mempool_outcome_7d = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_transaction_mempool_outcome_7d record by primary key
message GetFctTransactionMempoolOutcome7dRequest {
  // Earliest sighting of the transaction within its observation episode, the anchor of the 7 day horizon
  int64 first_seen_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_transaction_mempool_outcome_7d record
message GetFctTransactionMempoolOutcome7dResponse {
  FctTransactionMempoolOutcome7d item = 1;
}

// Query fct_transaction_mempool_outcome_7d data
service FctTransactionMempoolOutcome7dService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctTransactionMempoolOutcome7dRequest) returns (ListFctTransactionMempoolOutcome7dResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_mempool_outcome_7d"
    };
  }
  // Get record | Retrieve a single record by first_seen_date_time
  rpc Get(GetFctTransactionMempoolOutcome7dRequest) returns (GetFctTransactionMempoolOutcome7dResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_mempool_outcome_7d/{first_seen_date_time}"
    };
  }
}
