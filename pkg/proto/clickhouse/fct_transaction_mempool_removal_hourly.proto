syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Hourly counts of transactions that left Xatu sentry txpools without being included, by removal reason. replaced and nonce_consumed are reliable; dropped is churn-heavy
message FctTransactionMempoolRemovalHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour period, bucketed by removal detection time
  uint32 hour_start_date_time = 12;
  // Removal reason: replaced, nonce_consumed or dropped. dropped means the hash left at least one sentry pool and is usually seen again later
  string reason = 13;
  // Distinct transaction hashes removed for this reason this hour
  uint64 hash_count = 14;
  // Hashes removed from at least one sentry pending pool
  uint64 pending_hash_count = 15;
  // Hashes removed from at least one sentry queued pool
  uint64 queued_hash_count = 16;
  // Distinct hash and sentry pairs, repeat detections by one sentry counted once
  uint64 hash_sentry_count = 17;
  // Raw removal detections including repeats
  uint64 detection_count = 18;
  // Blob type 3 hashes removed for this reason
  uint64 blob_hash_count = 19;
  // Hashes with a known replacing transaction
  uint64 with_replacement_count = 20;
  // Median replacing tip cap divided by the replaced tip cap, over replaced hashes with a non-zero tip cap
  google.protobuf.DoubleValue replacement_tip_cap_ratio_p50 = 21;
  // Median replacing max fee cap divided by the replaced max fee cap, over replaced hashes with a non-zero fee cap
  google.protobuf.DoubleValue replacement_fee_cap_ratio_p50 = 22;
}

// Request for listing fct_transaction_mempool_removal_hourly records
message ListFctTransactionMempoolRemovalHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour period, bucketed by removal detection time (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by reason - Removal reason: replaced, nonce_consumed or dropped. dropped means the hash left at least one sentry pool and is usually seen again later (ORDER BY column 2 - optional)
  StringFilter reason = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hash_count - Distinct transaction hashes removed for this reason this hour (optional)
  UInt64Filter hash_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by pending_hash_count - Hashes removed from at least one sentry pending pool (optional)
  UInt64Filter pending_hash_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by queued_hash_count - Hashes removed from at least one sentry queued pool (optional)
  UInt64Filter queued_hash_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by hash_sentry_count - Distinct hash and sentry pairs, repeat detections by one sentry counted once (optional)
  UInt64Filter hash_sentry_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by detection_count - Raw removal detections including repeats (optional)
  UInt64Filter detection_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by blob_hash_count - Blob type 3 hashes removed for this reason (optional)
  UInt64Filter blob_hash_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by with_replacement_count - Hashes with a known replacing transaction (optional)
  UInt64Filter with_replacement_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by replacement_tip_cap_ratio_p50 - Median replacing tip cap divided by the replaced tip cap, over replaced hashes with a non-zero tip cap (optional)
  google.protobuf.DoubleValue replacement_tip_cap_ratio_p50 = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by replacement_fee_cap_ratio_p50 - Median replacing max fee cap divided by the replaced max fee cap, over replaced hashes with a non-zero fee cap (optional)
  google.protobuf.DoubleValue replacement_fee_cap_ratio_p50 = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_transaction_mempool_removal_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctTransactionMempoolRemovalHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_transaction_mempool_removal_hourly records
message ListFctTransactionMempoolRemovalHourlyResponse {
  // The list of fct_transaction_mempool_removal_hourly.
  repeated FctTransactionMempoolRemovalHourly fct_transaction_mempool_removal_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_transaction_mempool_removal_hourly record by primary key
message GetFctTransactionMempoolRemovalHourlyRequest {
  // Start of the hour period, bucketed by removal detection time
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single fct_transaction_mempool_removal_hourly record
message GetFctTransactionMempoolRemovalHourlyResponse {
  FctTransactionMempoolRemovalHourly item = 1;
}

// Query fct_transaction_mempool_removal_hourly data
service FctTransactionMempoolRemovalHourlyService {
  // List records | Hourly counts of transactions that left Xatu sentry txpools without being included, by removal reason. replaced and nonce_consumed are reliable; dropped is churn-heavy
  rpc List(ListFctTransactionMempoolRemovalHourlyRequest) returns (ListFctTransactionMempoolRemovalHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_mempool_removal_hourly"
    };
  }
  // Get record | Retrieve a single record by hour_start_date_time
  rpc Get(GetFctTransactionMempoolRemovalHourlyRequest) returns (GetFctTransactionMempoolRemovalHourlyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_transaction_mempool_removal_hourly/{hour_start_date_time}"
    };
  }
}
