syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Validators and stake by withdrawal credential type, one snapshot per week

message FctValidatorCountByCredentialTypeWeekly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The start of the week (Monday, UTC)
  string week_start_date = 12;
  // Epoch of the snapshot: the last epoch of the week, or the latest epoch for the current week
  uint32 epoch = 13;
  // Wall clock time when the snapshot epoch started
  uint32 epoch_start_date_time = 14;
  // Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02
  string credential_type = 15;
  // Validators in the beacon state with this credential type, in any status
  uint32 validator_count = 16;
  // Active validators (active_ongoing, active_exiting, active_slashed)
  uint32 active_validator_count = 17;
  // Sum of active validators' effective balance in Gwei (active stake)
  uint64 active_effective_balance = 18;
  // Sum of active validators' balance in Gwei
  uint64 active_balance = 19;
  // Validators waiting for activation (pending_initialized, pending_queued)
  uint32 pending_validator_count = 20;
  // Active validators with an exit started (active_exiting, active_slashed)
  uint32 exiting_validator_count = 21;
  // Exited validators (exited_unslashed, exited_slashed, withdrawal_possible, withdrawal_done)
  uint32 exited_validator_count = 22;
}

// Request for listing fct_validator_count_by_credential_type_weekly records
message ListFctValidatorCountByCredentialTypeWeeklyRequest {
  // Filter by week_start_date - The start of the week (Monday, UTC) (PRIMARY KEY - required)
  StringFilter week_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by credential_type - Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02 (ORDER BY column 2 - optional)
  StringFilter credential_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - Epoch of the snapshot: the last epoch of the week, or the latest epoch for the current week (optional)
  UInt32Filter epoch = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - Wall clock time when the snapshot epoch started (optional)
  UInt32Filter epoch_start_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by validator_count - Validators in the beacon state with this credential type, in any status (optional)
  UInt32Filter validator_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_validator_count - Active validators (active_ongoing, active_exiting, active_slashed) (optional)
  UInt32Filter active_validator_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_effective_balance - Sum of active validators' effective balance in Gwei (active stake) (optional)
  UInt64Filter active_effective_balance = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_balance - Sum of active validators' balance in Gwei (optional)
  UInt64Filter active_balance = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by pending_validator_count - Validators waiting for activation (pending_initialized, pending_queued) (optional)
  UInt32Filter pending_validator_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by exiting_validator_count - Active validators with an exit started (active_exiting, active_slashed) (optional)
  UInt32Filter exiting_validator_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by exited_validator_count - Exited validators (exited_unslashed, exited_slashed, withdrawal_possible, withdrawal_done) (optional)
  UInt32Filter exited_validator_count = 12 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_count_by_credential_type_weekly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorCountByCredentialTypeWeekly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_count_by_credential_type_weekly records
message ListFctValidatorCountByCredentialTypeWeeklyResponse {
  // The list of fct_validator_count_by_credential_type_weekly.
  repeated FctValidatorCountByCredentialTypeWeekly fct_validator_count_by_credential_type_weekly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_count_by_credential_type_weekly record by primary key
message GetFctValidatorCountByCredentialTypeWeeklyRequest {
  // The start of the week (Monday, UTC)
  string week_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_count_by_credential_type_weekly record
message GetFctValidatorCountByCredentialTypeWeeklyResponse {
  FctValidatorCountByCredentialTypeWeekly item = 1;
}

// Query fct_validator_count_by_credential_type_weekly data
service FctValidatorCountByCredentialTypeWeeklyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorCountByCredentialTypeWeeklyRequest) returns (ListFctValidatorCountByCredentialTypeWeeklyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_count_by_credential_type_weekly"
    };
  }
  // Get record | Retrieve a single record by week_start_date
  rpc Get(GetFctValidatorCountByCredentialTypeWeeklyRequest) returns (GetFctValidatorCountByCredentialTypeWeeklyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_count_by_credential_type_weekly/{week_start_date}"
    };
  }
}
