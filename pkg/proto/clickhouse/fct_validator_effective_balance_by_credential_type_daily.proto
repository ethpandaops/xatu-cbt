syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Histogram of active validators' effective balance by withdrawal credential type, one snapshot per day

message FctValidatorEffectiveBalanceByCredentialTypeDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // Epoch of the snapshot: the last epoch of the day, or the latest epoch for today
  uint32 epoch = 13;
  // Wall clock time when the snapshot epoch started
  uint32 epoch_start_date_time = 14;
  // Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02
  string credential_type = 15;
  // Effective balance in whole ETH (effective balance moves in 1 ETH steps)
  uint32 effective_balance_eth = 16;
  // Active validators with this credential type and effective balance
  uint32 validator_count = 17;
}

// Request for listing fct_validator_effective_balance_by_credential_type_daily records
message ListFctValidatorEffectiveBalanceByCredentialTypeDailyRequest {
  // Filter by day_start_date - The day (UTC) (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by credential_type - Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02 (ORDER BY column 2 - optional)
  StringFilter credential_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by effective_balance_eth - Effective balance in whole ETH (effective balance moves in 1 ETH steps) (ORDER BY column 3 - optional)
  UInt32Filter effective_balance_eth = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - Epoch of the snapshot: the last epoch of the day, or the latest epoch for today (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - Wall clock time when the snapshot epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by validator_count - Active validators with this credential type and effective balance (optional)
  UInt32Filter validator_count = 7 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_effective_balance_by_credential_type_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorEffectiveBalanceByCredentialTypeDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_effective_balance_by_credential_type_daily records
message ListFctValidatorEffectiveBalanceByCredentialTypeDailyResponse {
  // The list of fct_validator_effective_balance_by_credential_type_daily.
  repeated FctValidatorEffectiveBalanceByCredentialTypeDaily fct_validator_effective_balance_by_credential_type_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_effective_balance_by_credential_type_daily record by primary key
message GetFctValidatorEffectiveBalanceByCredentialTypeDailyRequest {
  // The day (UTC)
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_effective_balance_by_credential_type_daily record
message GetFctValidatorEffectiveBalanceByCredentialTypeDailyResponse {
  FctValidatorEffectiveBalanceByCredentialTypeDaily item = 1;
}

// Query fct_validator_effective_balance_by_credential_type_daily data
service FctValidatorEffectiveBalanceByCredentialTypeDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorEffectiveBalanceByCredentialTypeDailyRequest) returns (ListFctValidatorEffectiveBalanceByCredentialTypeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_effective_balance_by_credential_type_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctValidatorEffectiveBalanceByCredentialTypeDailyRequest) returns (GetFctValidatorEffectiveBalanceByCredentialTypeDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_effective_balance_by_credential_type_daily/{day_start_date}"
    };
  }
}
