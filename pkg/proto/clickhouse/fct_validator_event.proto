syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Validator lifecycle events: deposits, top-ups, credential changes, consolidations, withdrawals, exit and withdrawal requests, voluntary exits and slashings. Only operations that took effect on chain are included

message FctValidatorEvent {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // ReplacingMergeTree version: rows with a known amount win over rows without one, then the newest row wins
  uint64 version = 12;
  // Slot of the block that included the operation
  uint32 slot = 13;
  // Wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Epoch of the block that included the operation
  uint32 epoch = 15;
  // Wall clock time when the epoch started
  uint32 epoch_start_date_time = 16;
  // Root of the block that included the operation
  string block_root = 17;
  // Index of the validator the event belongs to
  uint32 validator_index = 18;
  // One of deposit, top_up, withdrawal_partial, withdrawal_full, bls_to_execution_change, switch_to_compounding, consolidation_source, consolidation_target, withdrawal_request, exit_request, voluntary_exit, slashed
  string event_type = 19;
  // Separates events of the same type for a validator in one block: withdrawal index for withdrawals, position in the block for execution requests, 2147483648 plus the order among the pubkey's deposits in the block for bridge deposits, otherwise 0
  uint64 event_position = 20;
  // Amount in Gwei: deposit amount, withdrawal amount, partial withdrawal amount accepted into the queue, or balance moved by a consolidation once processed (NULL until then). NULL for other types
  google.protobuf.UInt64Value amount = 21;
  // Other validator: consolidation target (for the source) or source (for the target), or the proposer that included a slashing
  google.protobuf.UInt32Value counterparty_validator_index = 22;
  // Deposit withdrawal credentials, new execution address of a BLS change, withdrawal recipient address, or source address of an execution request
  google.protobuf.StringValue address = 23;
}

// Request for listing fct_validator_event records
message ListFctValidatorEventRequest {
  // Filter by validator_index - Index of the validator the event belongs to (PRIMARY KEY - required)
  UInt32Filter validator_index = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by slot_start_date_time - Wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by event_type - One of deposit, top_up, withdrawal_partial, withdrawal_full, bls_to_execution_change, switch_to_compounding, consolidation_source, consolidation_target, withdrawal_request, exit_request, voluntary_exit, slashed (ORDER BY column 3 - optional)
  StringFilter event_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by event_position - Separates events of the same type for a validator in one block: withdrawal index for withdrawals, position in the block for execution requests, 2147483648 plus the order among the pubkey's deposits in the block for bridge deposits, otherwise 0 (ORDER BY column 4 - optional)
  UInt64Filter event_position = 4 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by version - ReplacingMergeTree version: rows with a known amount win over rows without one, then the newest row wins (optional)
  UInt64Filter version = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by slot - Slot of the block that included the operation (optional)
  UInt32Filter slot = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - Epoch of the block that included the operation (optional)
  UInt32Filter epoch = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - Wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_root - Root of the block that included the operation (optional)
  StringFilter block_root = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by amount - Amount in Gwei: deposit amount, withdrawal amount, partial withdrawal amount accepted into the queue, or balance moved by a consolidation once processed (NULL until then). NULL for other types (optional)
  NullableUInt64Filter amount = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by counterparty_validator_index - Other validator: consolidation target (for the source) or source (for the target), or the proposer that included a slashing (optional)
  NullableUInt32Filter counterparty_validator_index = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by address - Deposit withdrawal credentials, new execution address of a BLS change, withdrawal recipient address, or source address of an execution request (optional)
  NullableStringFilter address = 13 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_event to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorEvent` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_event records
message ListFctValidatorEventResponse {
  // The list of fct_validator_event.
  repeated FctValidatorEvent fct_validator_event = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_event record by primary key
message GetFctValidatorEventRequest {
  // Index of the validator the event belongs to
  uint32 validator_index = 1; // Primary key (required)
}

// Response for getting a single fct_validator_event record
message GetFctValidatorEventResponse {
  FctValidatorEvent item = 1;
}

// Query fct_validator_event data
service FctValidatorEventService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorEventRequest) returns (ListFctValidatorEventResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_event"
    };
  }
  // Get record | Retrieve a single record by validator_index
  rpc Get(GetFctValidatorEventRequest) returns (GetFctValidatorEventResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_event/{validator_index}"
    };
  }
}
