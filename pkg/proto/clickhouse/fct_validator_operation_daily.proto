syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Daily counts and amounts of validator operations that took effect

message FctValidatorOperationDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC) of the blocks that included the operations
  string day_start_date = 12;
  // One of deposit, top_up, withdrawal_partial, withdrawal_full, bls_to_execution_change, switch_to_compounding, consolidation, withdrawal_request, exit_request, voluntary_exit, slashing
  string operation = 13;
  // Number of operations that took effect
  uint32 operation_count = 14;
  // Distinct validators (pubkeys for deposits and top-ups)
  uint32 validator_count = 15;
  // Gwei deposited, withdrawn, or accepted into the partial withdrawal queue. NULL for operations without an amount
  google.protobuf.UInt64Value amount = 16;
}

// Request for listing fct_validator_operation_daily records
message ListFctValidatorOperationDailyRequest {
  // Filter by day_start_date - The day (UTC) of the blocks that included the operations (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by operation - One of deposit, top_up, withdrawal_partial, withdrawal_full, bls_to_execution_change, switch_to_compounding, consolidation, withdrawal_request, exit_request, voluntary_exit, slashing (ORDER BY column 2 - optional)
  StringFilter operation = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by operation_count - Number of operations that took effect (optional)
  UInt32Filter operation_count = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by validator_count - Distinct validators (pubkeys for deposits and top-ups) (optional)
  UInt32Filter validator_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by amount - Gwei deposited, withdrawn, or accepted into the partial withdrawal queue. NULL for operations without an amount (optional)
  NullableUInt64Filter amount = 6 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_operation_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorOperationDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_operation_daily records
message ListFctValidatorOperationDailyResponse {
  // The list of fct_validator_operation_daily.
  repeated FctValidatorOperationDaily fct_validator_operation_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_operation_daily record by primary key
message GetFctValidatorOperationDailyRequest {
  // The day (UTC) of the blocks that included the operations
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_operation_daily record
message GetFctValidatorOperationDailyResponse {
  FctValidatorOperationDaily item = 1;
}

// Query fct_validator_operation_daily data
service FctValidatorOperationDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorOperationDailyRequest) returns (ListFctValidatorOperationDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_operation_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctValidatorOperationDailyRequest) returns (GetFctValidatorOperationDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_operation_daily/{day_start_date}"
    };
  }
}
