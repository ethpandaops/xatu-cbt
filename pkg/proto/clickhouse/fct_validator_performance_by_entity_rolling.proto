syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Attestation and block proposal performance per staking entity over rolling periods, refreshed every 30 minutes: one row per period and entity with duties or proposals in it. 24h sums fct_attestation_vote_correctness_by_entity_hourly and fct_block_proposer_by_entity over the last 24 complete hours. The day periods sum fct_attestation_vote_correctness_by_entity_daily and fct_block_proposal_by_entity_daily over the last complete UTC days. The rows of a period sum to the whole network
message FctValidatorPerformanceByEntityRolling {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Rolling period: 24h (the last 24 complete hours), 7d, 30d, 90d or 1y (the last complete UTC days), or all (every day with data)
  string period = 12;
  // Staking entity of the validators in dim_node, or unknown
  string entity = 13;
  // Start of the period, or of the data when it starts later
  uint32 period_start_date_time = 14;
  // End of the period, exclusive
  uint32 period_end_date_time = 15;
  // Attestation duties
  uint64 total_duties = 16;
  // Attestations included on the finalized chain
  uint64 attested_count = 17;
  // Attestations missed: duties with no attestation included on the finalized chain
  uint64 missed_count = 18;
  // Head votes that were correct
  uint64 head_correct_count = 19;
  // Target votes that were correct
  uint64 target_correct_count = 20;
  // Source votes that were correct, from attestations seen on gossip
  uint64 source_correct_count = 21;
  // Mean inclusion distance in slots per included attestation, NULL when there were none
  google.protobuf.DoubleValue avg_inclusion_distance = 22;
  // Canonical blocks proposed
  uint32 block_count = 23;
  // Canonical blocks delivered by an MEV relay, the rest were built locally
  uint32 mev_block_count = 24;
  // Mean relay-reported value of the MEV blocks in ETH, NULL when there were none
  google.protobuf.DoubleValue avg_mev_value_eth = 25;
  // Blocks proposed that did not make the finalized chain
  uint32 orphaned_block_count = 26;
  // Slots the entity was scheduled to propose where no block was seen
  uint32 missed_slot_count = 27;
}

// Request for listing fct_validator_performance_by_entity_rolling records
message ListFctValidatorPerformanceByEntityRollingRequest {
  // Filter by period - Rolling period: 24h (the last 24 complete hours), 7d, 30d, 90d or 1y (the last complete UTC days), or all (every day with data) (PRIMARY KEY - required)
  StringFilter period = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity - Staking entity of the validators in dim_node, or unknown (ORDER BY column 2 - optional)
  StringFilter entity = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by period_start_date_time - Start of the period, or of the data when it starts later (optional)
  UInt32Filter period_start_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by period_end_date_time - End of the period, exclusive (optional)
  UInt32Filter period_end_date_time = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by total_duties - Attestation duties (optional)
  UInt64Filter total_duties = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attested_count - Attestations included on the finalized chain (optional)
  UInt64Filter attested_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_count - Attestations missed: duties with no attestation included on the finalized chain (optional)
  UInt64Filter missed_count = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by head_correct_count - Head votes that were correct (optional)
  UInt64Filter head_correct_count = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by target_correct_count - Target votes that were correct (optional)
  UInt64Filter target_correct_count = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by source_correct_count - Source votes that were correct, from attestations seen on gossip (optional)
  UInt64Filter source_correct_count = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_inclusion_distance - Mean inclusion distance in slots per included attestation, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_inclusion_distance = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Canonical blocks proposed (optional)
  UInt32Filter block_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by mev_block_count - Canonical blocks delivered by an MEV relay, the rest were built locally (optional)
  UInt32Filter mev_block_count = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by avg_mev_value_eth - Mean relay-reported value of the MEV blocks in ETH, NULL when there were none (optional)
  google.protobuf.DoubleValue avg_mev_value_eth = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by orphaned_block_count - Blocks proposed that did not make the finalized chain (optional)
  UInt32Filter orphaned_block_count = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by missed_slot_count - Slots the entity was scheduled to propose where no block was seen (optional)
  UInt32Filter missed_slot_count = 17 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_performance_by_entity_rolling to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorPerformanceByEntityRolling` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_performance_by_entity_rolling records
message ListFctValidatorPerformanceByEntityRollingResponse {
  // The list of fct_validator_performance_by_entity_rolling.
  repeated FctValidatorPerformanceByEntityRolling fct_validator_performance_by_entity_rolling = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_performance_by_entity_rolling record by primary key
message GetFctValidatorPerformanceByEntityRollingRequest {
  // Rolling period: 24h (the last 24 complete hours), 7d, 30d, 90d or 1y (the last complete UTC days), or all (every day with data)
  string period = 1; // Primary key (required)
}

// Response for getting a single fct_validator_performance_by_entity_rolling record
message GetFctValidatorPerformanceByEntityRollingResponse {
  FctValidatorPerformanceByEntityRolling item = 1;
}

// Query fct_validator_performance_by_entity_rolling data
service FctValidatorPerformanceByEntityRollingService {
  // List records | Attestation and block proposal performance per staking entity over rolling periods, refreshed every 30 minutes: one row per period and entity with duties or proposals in it. 24h sums fct_attestation_vote_correctness_by_entity_hourly and fct_block_proposer_by_entity over the last 24 complete hours. The day periods sum fct_attestation_vote_correctness_by_entity_daily and fct_block_proposal_by_entity_daily over the last complete UTC days. The rows of a period sum to the whole network
  rpc List(ListFctValidatorPerformanceByEntityRollingRequest) returns (ListFctValidatorPerformanceByEntityRollingResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_performance_by_entity_rolling"
    };
  }
  // Get record | Retrieve a single record by period
  rpc Get(GetFctValidatorPerformanceByEntityRollingRequest) returns (GetFctValidatorPerformanceByEntityRollingResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_performance_by_entity_rolling/{period}"
    };
  }
}
