syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Network-wide consensus layer rewards and penalties per day

message FctValidatorRewardTotalDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // Validators with an attestation reward on the day
  uint32 attesting_validator_count = 13;
  // Head vote rewards in Gwei
  int64 attestation_head = 14;
  // Target vote rewards in Gwei
  int64 attestation_target = 15;
  // Source vote rewards in Gwei
  int64 attestation_source = 16;
  // Inclusion delay rewards in Gwei (phase0 only, 0 from Altair)
  int64 attestation_inclusion_delay = 17;
  // Inactivity penalties in Gwei
  int64 attestation_inactivity = 18;
  // Net attestation rewards in Gwei
  int64 attestation_total = 19;
  // Negative attestation components in Gwei
  int64 attestation_penalty = 20;
  // Positive sync committee rewards in Gwei
  int64 sync_committee_reward = 21;
  // Sync committee penalties in Gwei
  int64 sync_committee_penalty = 22;
  // Canonical blocks on the day
  uint32 block_count = 23;
  // Consensus layer proposer rewards in Gwei
  uint64 proposer_total = 24;
  // Proposer rewards for attestations in Gwei
  uint64 proposer_attestations = 25;
  // Proposer rewards for sync aggregates in Gwei
  uint64 proposer_sync_aggregate = 26;
  // Proposer rewards for slashings in Gwei
  uint64 proposer_slashings = 27;
}

// Request for listing fct_validator_reward_total_daily records
message ListFctValidatorRewardTotalDailyRequest {
  // Filter by day_start_date - The day (UTC) (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attesting_validator_count - Validators with an attestation reward on the day (optional)
  UInt32Filter attesting_validator_count = 3 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_head - Head vote rewards in Gwei (optional)
  Int64Filter attestation_head = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_target - Target vote rewards in Gwei (optional)
  Int64Filter attestation_target = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_source - Source vote rewards in Gwei (optional)
  Int64Filter attestation_source = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_inclusion_delay - Inclusion delay rewards in Gwei (phase0 only, 0 from Altair) (optional)
  Int64Filter attestation_inclusion_delay = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_inactivity - Inactivity penalties in Gwei (optional)
  Int64Filter attestation_inactivity = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_total - Net attestation rewards in Gwei (optional)
  Int64Filter attestation_total = 9 [(google.api.field_behavior) = OPTIONAL];
  // Filter by attestation_penalty - Negative attestation components in Gwei (optional)
  Int64Filter attestation_penalty = 10 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sync_committee_reward - Positive sync committee rewards in Gwei (optional)
  Int64Filter sync_committee_reward = 11 [(google.api.field_behavior) = OPTIONAL];
  // Filter by sync_committee_penalty - Sync committee penalties in Gwei (optional)
  Int64Filter sync_committee_penalty = 12 [(google.api.field_behavior) = OPTIONAL];
  // Filter by block_count - Canonical blocks on the day (optional)
  UInt32Filter block_count = 13 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_total - Consensus layer proposer rewards in Gwei (optional)
  UInt64Filter proposer_total = 14 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_attestations - Proposer rewards for attestations in Gwei (optional)
  UInt64Filter proposer_attestations = 15 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_sync_aggregate - Proposer rewards for sync aggregates in Gwei (optional)
  UInt64Filter proposer_sync_aggregate = 16 [(google.api.field_behavior) = OPTIONAL];
  // Filter by proposer_slashings - Proposer rewards for slashings in Gwei (optional)
  UInt64Filter proposer_slashings = 17 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_reward_total_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorRewardTotalDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_reward_total_daily records
message ListFctValidatorRewardTotalDailyResponse {
  // The list of fct_validator_reward_total_daily.
  repeated FctValidatorRewardTotalDaily fct_validator_reward_total_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_reward_total_daily record by primary key
message GetFctValidatorRewardTotalDailyRequest {
  // The day (UTC)
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_reward_total_daily record
message GetFctValidatorRewardTotalDailyResponse {
  FctValidatorRewardTotalDaily item = 1;
}

// Query fct_validator_reward_total_daily data
service FctValidatorRewardTotalDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorRewardTotalDailyRequest) returns (ListFctValidatorRewardTotalDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_reward_total_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctValidatorRewardTotalDailyRequest) returns (GetFctValidatorRewardTotalDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_reward_total_daily/{day_start_date}"
    };
  }
}
