syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Active validators and stake by entity and withdrawal credential type, one snapshot per day

message FctValidatorStakeByEntityDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // Epoch of the snapshot: the last epoch of the day, or the latest epoch for today
  uint32 epoch = 13;
  // Wall clock time when the snapshot epoch started
  uint32 epoch_start_date_time = 14;
  // Entity label from dim_node as it is today, or unknown
  string entity = 15;
  // Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02
  string credential_type = 16;
  // Active validators (active_ongoing, active_exiting, active_slashed)
  uint32 active_validator_count = 17;
  // Sum of active validators' effective balance in Gwei (active stake)
  uint64 active_effective_balance = 18;
  // Sum of active validators' balance in Gwei
  uint64 active_balance = 19;
}

// Request for listing fct_validator_stake_by_entity_daily records
message ListFctValidatorStakeByEntityDailyRequest {
  // Filter by day_start_date - The day (UTC) (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity - Entity label from dim_node as it is today, or unknown (ORDER BY column 2 - optional)
  StringFilter entity = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by credential_type - Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02 (ORDER BY column 3 - optional)
  StringFilter credential_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch - Epoch of the snapshot: the last epoch of the day, or the latest epoch for today (optional)
  UInt32Filter epoch = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by epoch_start_date_time - Wall clock time when the snapshot epoch started (optional)
  UInt32Filter epoch_start_date_time = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_validator_count - Active validators (active_ongoing, active_exiting, active_slashed) (optional)
  UInt32Filter active_validator_count = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_effective_balance - Sum of active validators' effective balance in Gwei (active stake) (optional)
  UInt64Filter active_effective_balance = 8 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_balance - Sum of active validators' balance in Gwei (optional)
  UInt64Filter active_balance = 9 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_stake_by_entity_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorStakeByEntityDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_stake_by_entity_daily records
message ListFctValidatorStakeByEntityDailyResponse {
  // The list of fct_validator_stake_by_entity_daily.
  repeated FctValidatorStakeByEntityDaily fct_validator_stake_by_entity_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_stake_by_entity_daily record by primary key
message GetFctValidatorStakeByEntityDailyRequest {
  // The day (UTC)
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_stake_by_entity_daily record
message GetFctValidatorStakeByEntityDailyResponse {
  FctValidatorStakeByEntityDaily item = 1;
}

// Query fct_validator_stake_by_entity_daily data
service FctValidatorStakeByEntityDailyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListFctValidatorStakeByEntityDailyRequest) returns (ListFctValidatorStakeByEntityDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_stake_by_entity_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctValidatorStakeByEntityDailyRequest) returns (GetFctValidatorStakeByEntityDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_stake_by_entity_daily/{day_start_date}"
    };
  }
}
