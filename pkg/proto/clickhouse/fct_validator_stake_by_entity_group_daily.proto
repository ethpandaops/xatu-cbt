syntax = "proto3";

package cbt;

import "common.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "clickhouse/annotations.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Active validators and stake per entity group and withdrawal credential type, one snapshot per day: the sum of the member entities in fct_validator_stake_by_entity_daily. Only entities in a group have rows
message FctValidatorStakeByEntityGroupDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The day (UTC)
  string day_start_date = 12;
  // Group of staking entities run under one protocol: lido is every entity whose name contains lido (lido itself, the curated *_lido operators, the csm_operator*_lido Community Staking operators and the lidox* Simple DVT clusters)
  string entity_group = 13;
  // Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02
  string credential_type = 14;
  // Entities of the group with active validators of this credential type on the day
  uint32 entity_count = 15;
  // Active validators (active_ongoing, active_exiting, active_slashed)
  uint32 active_validator_count = 16;
  // Sum of active validators' effective balance in Gwei (active stake)
  uint64 active_effective_balance = 17;
  // Sum of active validators' balance in Gwei
  uint64 active_balance = 18;
}

// Request for listing fct_validator_stake_by_entity_group_daily records
message ListFctValidatorStakeByEntityGroupDailyRequest {
  // Filter by day_start_date - The day (UTC) (PRIMARY KEY - required)
  StringFilter day_start_date = 1 [(google.api.field_behavior) = REQUIRED, (clickhouse.v1.required_group) = "primary_key"];

  // Filter by entity_group - Group of staking entities run under one protocol: lido is every entity whose name contains lido (lido itself, the curated *_lido operators, the csm_operator*_lido Community Staking operators and the lidox* Simple DVT clusters) (ORDER BY column 2 - optional)
  StringFilter entity_group = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter by credential_type - Withdrawal credential prefix at the snapshot: 0x00, 0x01 or 0x02 (ORDER BY column 3 - optional)
  StringFilter credential_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // Filter by entity_count - Entities of the group with active validators of this credential type on the day (optional)
  UInt32Filter entity_count = 5 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_validator_count - Active validators (active_ongoing, active_exiting, active_slashed) (optional)
  UInt32Filter active_validator_count = 6 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_effective_balance - Sum of active validators' effective balance in Gwei (active stake) (optional)
  UInt64Filter active_effective_balance = 7 [(google.api.field_behavior) = OPTIONAL];
  // Filter by active_balance - Sum of active validators' balance in Gwei (optional)
  UInt64Filter active_balance = 8 [(google.api.field_behavior) = OPTIONAL];

  // The maximum number of fct_validator_stake_by_entity_group_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9 [(google.api.field_behavior) = OPTIONAL];
  // A page token, received from a previous `ListFctValidatorStakeByEntityGroupDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10 [(google.api.field_behavior) = OPTIONAL];
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing fct_validator_stake_by_entity_group_daily records
message ListFctValidatorStakeByEntityGroupDailyResponse {
  // The list of fct_validator_stake_by_entity_group_daily.
  repeated FctValidatorStakeByEntityGroupDaily fct_validator_stake_by_entity_group_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single fct_validator_stake_by_entity_group_daily record by primary key
message GetFctValidatorStakeByEntityGroupDailyRequest {
  // The day (UTC)
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single fct_validator_stake_by_entity_group_daily record
message GetFctValidatorStakeByEntityGroupDailyResponse {
  FctValidatorStakeByEntityGroupDaily item = 1;
}

// Query fct_validator_stake_by_entity_group_daily data
service FctValidatorStakeByEntityGroupDailyService {
  // List records | Active validators and stake per entity group and withdrawal credential type, one snapshot per day: the sum of the member entities in fct_validator_stake_by_entity_daily. Only entities in a group have rows
  rpc List(ListFctValidatorStakeByEntityGroupDailyRequest) returns (ListFctValidatorStakeByEntityGroupDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_stake_by_entity_group_daily"
    };
  }
  // Get record | Retrieve a single record by day_start_date
  rpc Get(GetFctValidatorStakeByEntityGroupDailyRequest) returns (GetFctValidatorStakeByEntityGroupDailyResponse) {
    option (google.api.http) = {
      get: "/api/v1/fct_validator_stake_by_entity_group_daily/{day_start_date}"
    };
  }
}
