syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Gas each contract used in a block, summed over every call frame that targeted it, root frames included. Contracts that used no gas are left out
message IntBlockContractGas {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The contract address (hex encoded with 0x prefix)
  string target_address = 13;
  // The call types used to call the contract in the block, a transaction calling it directly counts as CALL
  repeated string call_types = 14;
  // The first transaction in the block that called the contract
  string first_transaction_hash = 15;
  // Number of call frames that targeted the contract in the block
  uint32 call_count = 16;
  // Gas used by those frames themselves, excluding their child frames
  uint64 gas = 17;
}

// Request for listing int_block_contract_gas records
message ListIntBlockContractGasRequest {
  // Filter by block_number - The block number (PRIMARY KEY - required)
  UInt64Filter block_number = 1;

  // Filter by target_address - The contract address (hex encoded with 0x prefix) (ORDER BY column 2 - optional)
  StringFilter target_address = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by call_types - The call types used to call the contract in the block, a transaction calling it directly counts as CALL (optional)
  ArrayStringFilter call_types = 4;
  // Filter by first_transaction_hash - The first transaction in the block that called the contract (optional)
  StringFilter first_transaction_hash = 5;
  // Filter by call_count - Number of call frames that targeted the contract in the block (optional)
  UInt32Filter call_count = 6;
  // Filter by gas - Gas used by those frames themselves, excluding their child frames (optional)
  UInt64Filter gas = 7;

  // The maximum number of int_block_contract_gas to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8;
  // A page token, received from a previous `ListIntBlockContractGas` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10;
}

// Response for listing int_block_contract_gas records
message ListIntBlockContractGasResponse {
  // The list of int_block_contract_gas.
  repeated IntBlockContractGas int_block_contract_gas = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_block_contract_gas record by primary key
message GetIntBlockContractGasRequest {
  // The block number
  uint64 block_number = 1; // Primary key (required)
}

// Response for getting a single int_block_contract_gas record
message GetIntBlockContractGasResponse {
  IntBlockContractGas item = 1;
}

// Query int_block_contract_gas data
service IntBlockContractGasService {
  // List records | Gas each contract used in a block, summed over every call frame that targeted it, root frames included. Contracts that used no gas are left out
  rpc List(ListIntBlockContractGasRequest) returns (ListIntBlockContractGasResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntBlockContractGasRequest) returns (GetIntBlockContractGasResponse);
}
