syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Canonical blocks with the client releases their graffiti resolves to, resolved like the Lab slot page. release_status: commit_match (the commit is a release tag commit agreeing with any version the graffiti states), commit_untagged (a default or release branch commit between tags, version is the release it builds on, else the stated version, empty for a development build with no recent tag), commit_mismatch (the commit resolves to another release than the stated version, which some clients leave stale, version is the commit release), commit_ambiguous (the prefix matches several commits), commit_unmatched (no release or branch commit, a custom or fork build), commit_short (a 2 character commit), commit_zero (an all-zero commit), version_match or version_unmatched (a version string with no commit, matched to a release tag or not), codes_min (client codes without commits), no_commit (no version information) or none (unknown client). Rows whose commit does not resolve keep the version the graffiti states. Rows with neither have an empty version

message IntBlockGraffitiRelease {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number of the block
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root of the canonical beacon block
  string block_root = 16;
  // The validator index of the block proposer
  uint32 proposer_index = 17;
  // Staking entity of the proposer from dim_node, empty when the validator has none
  string entity = 18;
  // Graffiti format from fct_block_graffiti that identified the clients
  string graffiti_format = 19;
  // Consensus client named by the graffiti, e.g. lighthouse, or unknown
  string consensus_client = 20;
  // Consensus client release version from dim_client_release (or the release a branch commit builds on), else the version the graffiti states, empty when unresolved
  string consensus_client_version = 21;
  // Consensus client commit prefix from the graffiti, lowercase, empty when there is none
  string consensus_client_commit = 22;
  // How the consensus client version was resolved, see the table comment for values
  string consensus_client_release_status = 23;
  // Execution client named by the graffiti, e.g. geth, or unknown
  string execution_client = 24;
  // Execution client release version from dim_client_release (or the release a branch commit builds on), empty when unresolved
  string execution_client_version = 25;
  // Execution client commit prefix from the graffiti, lowercase, empty when there is none
  string execution_client_commit = 26;
  // How the execution client version was resolved, see the table comment for values
  string execution_client_release_status = 27;
}

// Request for listing int_block_graffiti_release records
message ListIntBlockGraffitiReleaseRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required unless using alternatives: slot)
  UInt32Filter slot_start_date_time = 1;

  // Filter by block_root - The root of the canonical beacon block (ORDER BY column 2 - optional)
  StringFilter block_root = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by slot - The slot number of the block (PROJECTION: p_by_slot - alternative to slot_start_date_time)
  UInt32Filter slot = 4;
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6;
  // Filter by proposer_index - The validator index of the block proposer (optional)
  UInt32Filter proposer_index = 7;
  // Filter by entity - Staking entity of the proposer from dim_node, empty when the validator has none (optional)
  StringFilter entity = 8;
  // Filter by graffiti_format - Graffiti format from fct_block_graffiti that identified the clients (optional)
  StringFilter graffiti_format = 9;
  // Filter by consensus_client - Consensus client named by the graffiti, e.g. lighthouse, or unknown (optional)
  StringFilter consensus_client = 10;
  // Filter by consensus_client_version - Consensus client release version from dim_client_release (or the release a branch commit builds on), else the version the graffiti states, empty when unresolved (optional)
  StringFilter consensus_client_version = 11;
  // Filter by consensus_client_commit - Consensus client commit prefix from the graffiti, lowercase, empty when there is none (optional)
  StringFilter consensus_client_commit = 12;
  // Filter by consensus_client_release_status - How the consensus client version was resolved, see the table comment for values (optional)
  StringFilter consensus_client_release_status = 13;
  // Filter by execution_client - Execution client named by the graffiti, e.g. geth, or unknown (optional)
  StringFilter execution_client = 14;
  // Filter by execution_client_version - Execution client release version from dim_client_release (or the release a branch commit builds on), empty when unresolved (optional)
  StringFilter execution_client_version = 15;
  // Filter by execution_client_commit - Execution client commit prefix from the graffiti, lowercase, empty when there is none (optional)
  StringFilter execution_client_commit = 16;
  // Filter by execution_client_release_status - How the execution client version was resolved, see the table comment for values (optional)
  StringFilter execution_client_release_status = 17;

  // The maximum number of int_block_graffiti_release to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 18;
  // A page token, received from a previous `ListIntBlockGraffitiRelease` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 19;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 20;
}

// Response for listing int_block_graffiti_release records
message ListIntBlockGraffitiReleaseResponse {
  // The list of int_block_graffiti_release.
  repeated IntBlockGraffitiRelease int_block_graffiti_release = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_block_graffiti_release record by primary key
message GetIntBlockGraffitiReleaseRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single int_block_graffiti_release record
message GetIntBlockGraffitiReleaseResponse {
  IntBlockGraffitiRelease item = 1;
}

// Query int_block_graffiti_release data
service IntBlockGraffitiReleaseService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListIntBlockGraffitiReleaseRequest) returns (ListIntBlockGraffitiReleaseResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntBlockGraffitiReleaseRequest) returns (GetIntBlockGraffitiReleaseResponse);
}
