syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Gloas (ePBS) Payload Timeliness Committee votes per attested block, from aggregates included in canonical beacon blocks

message IntBlockPayloadPtcVoteCanonical {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The attested slot number
  uint32 slot = 12;
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the attested slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The beacon block root being attested by the PTC
  string block_root = 16;
  // The beacon block version of the containing block
  string block_version = 17;
  // Slot of the canonical block that included the payload attestations
  uint32 included_in_slot = 18;
  // Root of the canonical block that included the payload attestations
  string included_in_block_root = 19;
  // Total PTC validators covered by the included payload attestation aggregates
  uint32 ptc_validators = 20;
  // PTC validators attesting the payload was present
  uint32 payload_present_votes = 21;
  // PTC validators attesting blob data was available
  uint32 blob_data_available_votes = 22;
}

// Request for listing int_block_payload_ptc_vote_canonical records
message ListIntBlockPayloadPtcVoteCanonicalRequest {
  // Filter by slot_start_date_time - The wall clock time when the attested slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by block_root - The beacon block root being attested by the PTC (ORDER BY column 2 - optional)
  StringFilter block_root = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by slot - The attested slot number (optional)
  UInt32Filter slot = 4;
  // Filter by epoch - The epoch number containing the attested slot (optional)
  UInt32Filter epoch = 5;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6;
  // Filter by block_version - The beacon block version of the containing block (optional)
  StringFilter block_version = 7;
  // Filter by included_in_slot - Slot of the canonical block that included the payload attestations (optional)
  UInt32Filter included_in_slot = 8;
  // Filter by included_in_block_root - Root of the canonical block that included the payload attestations (optional)
  StringFilter included_in_block_root = 9;
  // Filter by ptc_validators - Total PTC validators covered by the included payload attestation aggregates (optional)
  UInt32Filter ptc_validators = 10;
  // Filter by payload_present_votes - PTC validators attesting the payload was present (optional)
  UInt32Filter payload_present_votes = 11;
  // Filter by blob_data_available_votes - PTC validators attesting blob data was available (optional)
  UInt32Filter blob_data_available_votes = 12;

  // The maximum number of int_block_payload_ptc_vote_canonical to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13;
  // A page token, received from a previous `ListIntBlockPayloadPtcVoteCanonical` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15;
}

// Response for listing int_block_payload_ptc_vote_canonical records
message ListIntBlockPayloadPtcVoteCanonicalResponse {
  // The list of int_block_payload_ptc_vote_canonical.
  repeated IntBlockPayloadPtcVoteCanonical int_block_payload_ptc_vote_canonical = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_block_payload_ptc_vote_canonical record by primary key
message GetIntBlockPayloadPtcVoteCanonicalRequest {
  // The wall clock time when the attested slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single int_block_payload_ptc_vote_canonical record
message GetIntBlockPayloadPtcVoteCanonicalResponse {
  IntBlockPayloadPtcVoteCanonical item = 1;
}

// Query int_block_payload_ptc_vote_canonical data
service IntBlockPayloadPtcVoteCanonicalService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListIntBlockPayloadPtcVoteCanonicalRequest) returns (ListIntBlockPayloadPtcVoteCanonicalResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntBlockPayloadPtcVoteCanonicalRequest) returns (GetIntBlockPayloadPtcVoteCanonicalResponse);
}
