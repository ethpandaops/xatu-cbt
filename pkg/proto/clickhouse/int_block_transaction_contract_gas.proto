syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Gas each contract used within each transaction of a block, the flows from transactions to contracts. Contracts that used no gas in the transaction are left out
message IntBlockTransactionContractGas {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction hash (hex encoded with 0x prefix)
  string transaction_hash = 13;
  // The contract address (hex encoded with 0x prefix)
  string target_address = 14;
  // Position of the transaction within the block
  uint32 transaction_index = 15;
  // Number of call frames in the transaction that targeted the contract
  uint32 call_count = 16;
  // Gas used by those frames themselves, excluding their child frames
  uint64 gas = 17;
}

// Request for listing int_block_transaction_contract_gas records
message ListIntBlockTransactionContractGasRequest {
  // Filter by block_number - The block number (PRIMARY KEY - required)
  UInt64Filter block_number = 1;

  // Filter by transaction_hash - The transaction hash (hex encoded with 0x prefix) (ORDER BY column 2 - optional)
  StringFilter transaction_hash = 2;

  // Filter by target_address - The contract address (hex encoded with 0x prefix) (ORDER BY column 3 - optional)
  StringFilter target_address = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by transaction_index - Position of the transaction within the block (optional)
  UInt32Filter transaction_index = 5;
  // Filter by call_count - Number of call frames in the transaction that targeted the contract (optional)
  UInt32Filter call_count = 6;
  // Filter by gas - Gas used by those frames themselves, excluding their child frames (optional)
  UInt64Filter gas = 7;

  // The maximum number of int_block_transaction_contract_gas to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8;
  // A page token, received from a previous `ListIntBlockTransactionContractGas` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10;
}

// Response for listing int_block_transaction_contract_gas records
message ListIntBlockTransactionContractGasResponse {
  // The list of int_block_transaction_contract_gas.
  repeated IntBlockTransactionContractGas int_block_transaction_contract_gas = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_block_transaction_contract_gas record by primary key
message GetIntBlockTransactionContractGasRequest {
  // The block number
  uint64 block_number = 1; // Primary key (required)
}

// Response for getting a single int_block_transaction_contract_gas record
message GetIntBlockTransactionContractGasResponse {
  IntBlockTransactionContractGas item = 1;
}

// Query int_block_transaction_contract_gas data
service IntBlockTransactionContractGasService {
  // List records | Gas each contract used within each transaction of a block, the flows from transactions to contracts. Contracts that used no gas in the transaction are left out
  rpc List(ListIntBlockTransactionContractGasRequest) returns (ListIntBlockTransactionContractGasResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntBlockTransactionContractGasRequest) returns (GetIntBlockTransactionContractGasResponse);
}
