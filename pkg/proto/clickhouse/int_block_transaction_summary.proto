syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// One row per transaction in a block with its call tree summarised: receipt and intrinsic gas from the root frame, and the frame count, deepest call and target from the whole tree
message IntBlockTransactionSummary {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction hash (hex encoded with 0x prefix)
  string transaction_hash = 13;
  // Position of the transaction within the block
  uint32 transaction_index = 14;
  // Gas used from the transaction receipt, the total gas the transaction used
  google.protobuf.UInt64Value receipt_gas_used = 15;
  // Intrinsic transaction cost (21000 plus calldata). Null for failed transactions
  google.protobuf.UInt64Value intrinsic_gas = 16;
  // Gas refunded to the transaction, 0 for failed transactions
  uint64 gas_refund = 17;
  // EVM execution gas of the whole call tree (the root frame cumulative gas)
  uint64 evm_gas = 18;
  // Number of call frames in the transaction, including the root frame
  uint32 call_frame_count = 19;
  // Deepest call depth in the transaction (0 = root only)
  uint32 max_depth = 20;
  // Whether the root frame had an opcode that resulted in an error
  bool has_errors = 21;
  // How the transaction started: CALL, CREATE, or the root frame call type
  string root_call_type = 22;
  // The address the transaction called (hex encoded with 0x prefix), null for contract creation
  google.protobuf.StringValue target_address = 23;
}

// Request for listing int_block_transaction_summary records
message ListIntBlockTransactionSummaryRequest {
  // Filter by block_number - The block number (PRIMARY KEY - required)
  UInt64Filter block_number = 1;

  // Filter by transaction_hash - The transaction hash (hex encoded with 0x prefix) (ORDER BY column 2 - optional)
  StringFilter transaction_hash = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by transaction_index - Position of the transaction within the block (optional)
  UInt32Filter transaction_index = 4;
  // Filter by receipt_gas_used - Gas used from the transaction receipt, the total gas the transaction used (optional)
  NullableUInt64Filter receipt_gas_used = 5;
  // Filter by intrinsic_gas - Intrinsic transaction cost (21000 plus calldata). Null for failed transactions (optional)
  NullableUInt64Filter intrinsic_gas = 6;
  // Filter by gas_refund - Gas refunded to the transaction, 0 for failed transactions (optional)
  UInt64Filter gas_refund = 7;
  // Filter by evm_gas - EVM execution gas of the whole call tree (the root frame cumulative gas) (optional)
  UInt64Filter evm_gas = 8;
  // Filter by call_frame_count - Number of call frames in the transaction, including the root frame (optional)
  UInt32Filter call_frame_count = 9;
  // Filter by max_depth - Deepest call depth in the transaction (0 = root only) (optional)
  UInt32Filter max_depth = 10;
  // Filter by has_errors - Whether the root frame had an opcode that resulted in an error (optional)
  BoolFilter has_errors = 11;
  // Filter by root_call_type - How the transaction started: CALL, CREATE, or the root frame call type (optional)
  StringFilter root_call_type = 12;
  // Filter by target_address - The address the transaction called (hex encoded with 0x prefix), null for contract creation (optional)
  NullableStringFilter target_address = 13;

  // The maximum number of int_block_transaction_summary to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14;
  // A page token, received from a previous `ListIntBlockTransactionSummary` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16;
}

// Response for listing int_block_transaction_summary records
message ListIntBlockTransactionSummaryResponse {
  // The list of int_block_transaction_summary.
  repeated IntBlockTransactionSummary int_block_transaction_summary = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_block_transaction_summary record by primary key
message GetIntBlockTransactionSummaryRequest {
  // The block number
  uint64 block_number = 1; // Primary key (required)
}

// Response for getting a single int_block_transaction_summary record
message GetIntBlockTransactionSummaryResponse {
  IntBlockTransactionSummary item = 1;
}

// Query int_block_transaction_summary data
service IntBlockTransactionSummaryService {
  // List records | One row per transaction in a block with its call tree summarised: receipt and intrinsic gas from the root frame, and the frame count, deepest call and target from the whole tree
  rpc List(ListIntBlockTransactionSummaryRequest) returns (ListIntBlockTransactionSummaryResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntBlockTransactionSummaryRequest) returns (GetIntBlockTransactionSummaryResponse);
}
