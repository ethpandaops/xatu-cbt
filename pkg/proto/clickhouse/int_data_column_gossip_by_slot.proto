syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// Gossipsub data column sidecar sightings per slot and column, from libp2p sentries, counting only sidecars whose block root a beacon node accepted
message IntDataColumnGossipBySlot {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The slot number
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number containing the slot
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // Data column index (0-127)
  uint64 column_index = 16;
  // Beacon block root of the earliest gossipsub sighting of the column
  string beacon_block_root = 17;
  // Number of block roots in the sightings (more than 1 means a fork)
  uint32 beacon_block_root_variants = 18;
  // Number of blobs in the slot, the most KZG commitments a sighting carried
  uint32 blob_count = 19;
  // Number of gossipsub sightings of the column whose block root a beacon node accepted
  uint32 gossipsub_count = 20;
}

// Request for listing int_data_column_gossip_by_slot records
message ListIntDataColumnGossipBySlotRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by column_index - Data column index (0-127) (ORDER BY column 2 - optional)
  UInt64Filter column_index = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by slot - The slot number (optional)
  UInt32Filter slot = 4;
  // Filter by epoch - The epoch number containing the slot (optional)
  UInt32Filter epoch = 5;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6;
  // Filter by beacon_block_root - Beacon block root of the earliest gossipsub sighting of the column (optional)
  StringFilter beacon_block_root = 7;
  // Filter by beacon_block_root_variants - Number of block roots in the sightings (more than 1 means a fork) (optional)
  UInt32Filter beacon_block_root_variants = 8;
  // Filter by blob_count - Number of blobs in the slot, the most KZG commitments a sighting carried (optional)
  UInt32Filter blob_count = 9;
  // Filter by gossipsub_count - Number of gossipsub sightings of the column whose block root a beacon node accepted (optional)
  UInt32Filter gossipsub_count = 10;

  // The maximum number of int_data_column_gossip_by_slot to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11;
  // A page token, received from a previous `ListIntDataColumnGossipBySlot` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13;
}

// Response for listing int_data_column_gossip_by_slot records
message ListIntDataColumnGossipBySlotResponse {
  // The list of int_data_column_gossip_by_slot.
  repeated IntDataColumnGossipBySlot int_data_column_gossip_by_slot = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_data_column_gossip_by_slot record by primary key
message GetIntDataColumnGossipBySlotRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single int_data_column_gossip_by_slot record
message GetIntDataColumnGossipBySlotResponse {
  IntDataColumnGossipBySlot item = 1;
}

// Query int_data_column_gossip_by_slot data
service IntDataColumnGossipBySlotService {
  // List records | Gossipsub data column sidecar sightings per slot and column, from libp2p sentries, counting only sidecars whose block root a beacon node accepted
  rpc List(ListIntDataColumnGossipBySlotRequest) returns (ListIntDataColumnGossipBySlotResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntDataColumnGossipBySlotRequest) returns (GetIntDataColumnGossipBySlotResponse);
}
