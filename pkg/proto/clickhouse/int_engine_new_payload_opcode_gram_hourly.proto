syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// Hourly least-squares sufficient statistics for regressing engine_newPayload duration on gas per opcode group, by execution client version

message IntEngineNewPayloadOpcodeGramHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the hour, by block timestamp
  uint32 hour_start_date_time = 12;
  // Node classification the timings come from (e.g., eip7870-block-builder)
  string node_class = 13;
  // Execution client implementation (e.g., Geth, Nethermind, Besu, Reth)
  string meta_execution_implementation = 14;
  // Execution client version string
  string meta_execution_version = 15;
  // Blocks in the regression after trimming outliers
  uint32 block_count = 16;
  // Blocks dropped as outliers (above the hourly P99 duration, or above 3x the hourly median ms per Mgas)
  uint32 trimmed_block_count = 17;
  // Lowest execution block number in the hour
  uint64 min_block_number = 18;
  // Highest execution block number in the hour
  uint64 max_block_number = 19;
  // Regression features, in order: INTERCEPT (1 per block), TX_COUNT (transactions / 100), NON_OPCODE_GAS (gas used minus opcode gas, in Mgas), then gas per opcode group in Mgas
  repeated string feature_names = 20;
  // Upper triangle (row-major, including the diagonal) of X'X, where X is blocks by feature_names
  repeated double xtx = 21;
  // X'y, where y is the median engine_newPayload duration in milliseconds across the node class
  repeated double xty = 22;
  // y'y, the sum of squared durations in ms^2
  double yty = 23;
  // Executions per opcode group, aligned with feature_names after the first three features
  repeated uint64 opcode_count = 24;
}

// Request for listing int_engine_new_payload_opcode_gram_hourly records
message ListIntEngineNewPayloadOpcodeGramHourlyRequest {
  // Filter by hour_start_date_time - Start of the hour, by block timestamp (PRIMARY KEY - required)
  UInt32Filter hour_start_date_time = 1;

  // Filter by node_class - Node classification the timings come from (e.g., eip7870-block-builder) (ORDER BY column 2 - optional)
  StringFilter node_class = 2;

  // Filter by meta_execution_implementation - Execution client implementation (e.g., Geth, Nethermind, Besu, Reth) (ORDER BY column 3 - optional)
  StringFilter meta_execution_implementation = 3;

  // Filter by meta_execution_version - Execution client version string (ORDER BY column 4 - optional)
  StringFilter meta_execution_version = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by block_count - Blocks in the regression after trimming outliers (optional)
  UInt32Filter block_count = 6;
  // Filter by trimmed_block_count - Blocks dropped as outliers (above the hourly P99 duration, or above 3x the hourly median ms per Mgas) (optional)
  UInt32Filter trimmed_block_count = 7;
  // Filter by min_block_number - Lowest execution block number in the hour (optional)
  UInt64Filter min_block_number = 8;
  // Filter by max_block_number - Highest execution block number in the hour (optional)
  UInt64Filter max_block_number = 9;
  // Filter by feature_names - Regression features, in order: INTERCEPT (1 per block), TX_COUNT (transactions / 100), NON_OPCODE_GAS (gas used minus opcode gas, in Mgas), then gas per opcode group in Mgas (optional)
  ArrayStringFilter feature_names = 10;
  // Filter by xtx - Upper triangle (row-major, including the diagonal) of X'X, where X is blocks by feature_names (optional)
  repeated double xtx = 11;
  // Filter by xty - X'y, where y is the median engine_newPayload duration in milliseconds across the node class (optional)
  repeated double xty = 12;
  // Filter by yty - y'y, the sum of squared durations in ms^2 (optional)
  google.protobuf.DoubleValue yty = 13;
  // Filter by opcode_count - Executions per opcode group, aligned with feature_names after the first three features (optional)
  ArrayUInt64Filter opcode_count = 14;

  // The maximum number of int_engine_new_payload_opcode_gram_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 15;
  // A page token, received from a previous `ListIntEngineNewPayloadOpcodeGramHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 16;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 17;
}

// Response for listing int_engine_new_payload_opcode_gram_hourly records
message ListIntEngineNewPayloadOpcodeGramHourlyResponse {
  // The list of int_engine_new_payload_opcode_gram_hourly.
  repeated IntEngineNewPayloadOpcodeGramHourly int_engine_new_payload_opcode_gram_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_engine_new_payload_opcode_gram_hourly record by primary key
message GetIntEngineNewPayloadOpcodeGramHourlyRequest {
  // Start of the hour, by block timestamp
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single int_engine_new_payload_opcode_gram_hourly record
message GetIntEngineNewPayloadOpcodeGramHourlyResponse {
  IntEngineNewPayloadOpcodeGramHourly item = 1;
}

// Query int_engine_new_payload_opcode_gram_hourly data
service IntEngineNewPayloadOpcodeGramHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListIntEngineNewPayloadOpcodeGramHourlyRequest) returns (ListIntEngineNewPayloadOpcodeGramHourlyResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntEngineNewPayloadOpcodeGramHourlyRequest) returns (GetIntEngineNewPayloadOpcodeGramHourlyResponse);
}
