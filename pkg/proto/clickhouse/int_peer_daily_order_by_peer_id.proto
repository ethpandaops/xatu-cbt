syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// int_peer_daily ordered by peer ID, for reading one peer across days. One row per consensus peer per day, from our libp2p sentries (heartbeats, identify, metadata and status exchanges) and the discovery crawler (ENRs). Holds no addresses. Residential peers are country-only: city and autonomous system are kept for hosting peers only.
message IntPeerDailyOrderByPeerId {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Hash of the peer ID and network, the key shared by the libp2p tables
  int64 peer_id_unique_key = 13;
  // libp2p peer ID, empty when the peer was only seen before peer IDs were recorded (April 2026)
  string peer_id = 14;
  // Our libp2p sentries were connected to the peer in the day. False on both sources means the peer was dropped from the day on a recount
  bool seen_by_sentry = 15;
  // Our discovery crawler dialled the peer from its ENR in the day
  bool seen_by_enr = 16;
  // Consensus client from the peer agent, else its ENR name (erigon reported as caplin), unknown when neither names one, other for unparseable names
  string client = 17;
  // Version the agent states (semver with any pre-release suffix), empty when it states none
  string version = 18;
  // Version field of the agent as reported, for Caplin its platform field
  string agent_version = 19;
  // Continent code of the address, empty when not geolocated
  string continent_code = 20;
  // Country code of the address, empty when not geolocated
  string country_code = 21;
  // Country name of the address, empty when not geolocated
  string country = 22;
  // City of the address for hosting peers, empty for residential peers (network_type other or unknown) and when not geolocated to a city
  string city = 23;
  // Autonomous system number of the address for hosting peers, 0 for residential peers and when unknown
  uint32 autonomous_system_number = 24;
  // Autonomous system organisation of the address for hosting peers, empty for residential peers and when unknown
  string autonomous_system_organization = 25;
  // hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs), unknown when not geolocated
  string network_type = 26;
  // Network operator: one name for providers that span several autonomous systems or organisation names (Amazon, Google, Microsoft, Alibaba, Oracle, OVHcloud, Hetzner, Contabo, Akamai, Tencent), else the organisation without its legal suffix. Empty for residential peers and when unknown
  string provider = 27;
  // The peer advertises a global IPv6 address, in an identify listen address or its ENR record, or we connected to it over IPv6
  bool ipv6 = 28;
  // Our sentries dialled the peer (an outbound connection), so it is publicly reachable
  bool dialled = 29;
  // The peer connected to our sentries (an inbound connection)
  bool inbound = 30;
  // Connected to over QUIC
  bool quic_connected = 31;
  // Advertises a QUIC listen address in identify
  bool quic_listen = 32;
  // The address in the peer ENR differs from the one our sentries connected to, NULL unless both are known
  google.protobuf.BoolValue enr_ip_mismatch = 33;
  // Custody group count from the peer metadata responses, else from its ENR, NULL when unknown
  google.protobuf.UInt32Value custody_group_count = 34;
  // Median heartbeat latency to our sentries in ms, NULL without heartbeat latencies
  google.protobuf.UInt32Value latency_ms = 35;
  // Status exchanges with our sentries in the day
  uint32 status_count = 36;
  // Fork digest of the peer latest status, else of its ENR, empty when neither is known
  string fork_digest = 37;
  // Median of the slots the peer head trailed the head of the sentry it exchanged status with, NULL without status exchanges
  google.protobuf.Int32Value head_lag_slots = 38;
  // Median of the epochs the peer finalized checkpoint trailed that of the sentry it exchanged status with, NULL without status exchanges
  google.protobuf.Int32Value finalized_lag_epochs = 39;
  // Earliest slot the peer serves blocks from in its latest status (0 for full history), NULL when it sent none (status v1)
  google.protobuf.UInt32Value earliest_available_slot = 40;
  // Slots of block history the peer serves at its latest status: the head of the sentry it exchanged status with minus earliest_available_slot. The spec minimum is 1056768 slots (33024 epochs)
  google.protobuf.UInt32Value served_history_slots = 41;
}

// Request for listing int_peer_daily_order_by_peer_id records
message ListIntPeerDailyOrderByPeerIdRequest {
  // Filter by peer_id - libp2p peer ID, empty when the peer was only seen before peer IDs were recorded (April 2026) (PRIMARY KEY - required)
  StringFilter peer_id = 1;

  // Filter by day_start_date - Start of the day period (ORDER BY column 2 - optional)
  StringFilter day_start_date = 2;

  // Filter by peer_id_unique_key - Hash of the peer ID and network, the key shared by the libp2p tables (ORDER BY column 3 - optional)
  Int64Filter peer_id_unique_key = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by seen_by_sentry - Our libp2p sentries were connected to the peer in the day. False on both sources means the peer was dropped from the day on a recount (optional)
  BoolFilter seen_by_sentry = 5;
  // Filter by seen_by_enr - Our discovery crawler dialled the peer from its ENR in the day (optional)
  BoolFilter seen_by_enr = 6;
  // Filter by client - Consensus client from the peer agent, else its ENR name (erigon reported as caplin), unknown when neither names one, other for unparseable names (optional)
  StringFilter client = 7;
  // Filter by version - Version the agent states (semver with any pre-release suffix), empty when it states none (optional)
  StringFilter version = 8;
  // Filter by agent_version - Version field of the agent as reported, for Caplin its platform field (optional)
  StringFilter agent_version = 9;
  // Filter by continent_code - Continent code of the address, empty when not geolocated (optional)
  StringFilter continent_code = 10;
  // Filter by country_code - Country code of the address, empty when not geolocated (optional)
  StringFilter country_code = 11;
  // Filter by country - Country name of the address, empty when not geolocated (optional)
  StringFilter country = 12;
  // Filter by city - City of the address for hosting peers, empty for residential peers (network_type other or unknown) and when not geolocated to a city (optional)
  StringFilter city = 13;
  // Filter by autonomous_system_number - Autonomous system number of the address for hosting peers, 0 for residential peers and when unknown (optional)
  UInt32Filter autonomous_system_number = 14;
  // Filter by autonomous_system_organization - Autonomous system organisation of the address for hosting peers, empty for residential peers and when unknown (optional)
  StringFilter autonomous_system_organization = 15;
  // Filter by network_type - hosting for cloud and hosting providers (known ASNs and organisation names), other for the rest (mostly residential and business ISPs), unknown when not geolocated (optional)
  StringFilter network_type = 16;
  // Filter by provider - Network operator: one name for providers that span several autonomous systems or organisation names (Amazon, Google, Microsoft, Alibaba, Oracle, OVHcloud, Hetzner, Contabo, Akamai, Tencent), else the organisation without its legal suffix. Empty for residential peers and when unknown (optional)
  StringFilter provider = 17;
  // Filter by ipv6 - The peer advertises a global IPv6 address, in an identify listen address or its ENR record, or we connected to it over IPv6 (optional)
  BoolFilter ipv6 = 18;
  // Filter by dialled - Our sentries dialled the peer (an outbound connection), so it is publicly reachable (optional)
  BoolFilter dialled = 19;
  // Filter by inbound - The peer connected to our sentries (an inbound connection) (optional)
  BoolFilter inbound = 20;
  // Filter by quic_connected - Connected to over QUIC (optional)
  BoolFilter quic_connected = 21;
  // Filter by quic_listen - Advertises a QUIC listen address in identify (optional)
  BoolFilter quic_listen = 22;
  // Filter by enr_ip_mismatch - The address in the peer ENR differs from the one our sentries connected to, NULL unless both are known (optional)
  NullableBoolFilter enr_ip_mismatch = 23;
  // Filter by custody_group_count - Custody group count from the peer metadata responses, else from its ENR, NULL when unknown (optional)
  NullableUInt32Filter custody_group_count = 24;
  // Filter by latency_ms - Median heartbeat latency to our sentries in ms, NULL without heartbeat latencies (optional)
  NullableUInt32Filter latency_ms = 25;
  // Filter by status_count - Status exchanges with our sentries in the day (optional)
  UInt32Filter status_count = 26;
  // Filter by fork_digest - Fork digest of the peer latest status, else of its ENR, empty when neither is known (optional)
  StringFilter fork_digest = 27;
  // Filter by head_lag_slots - Median of the slots the peer head trailed the head of the sentry it exchanged status with, NULL without status exchanges (optional)
  NullableInt32Filter head_lag_slots = 28;
  // Filter by finalized_lag_epochs - Median of the epochs the peer finalized checkpoint trailed that of the sentry it exchanged status with, NULL without status exchanges (optional)
  NullableInt32Filter finalized_lag_epochs = 29;
  // Filter by earliest_available_slot - Earliest slot the peer serves blocks from in its latest status (0 for full history), NULL when it sent none (status v1) (optional)
  NullableUInt32Filter earliest_available_slot = 30;
  // Filter by served_history_slots - Slots of block history the peer serves at its latest status: the head of the sentry it exchanged status with minus earliest_available_slot. The spec minimum is 1056768 slots (33024 epochs) (optional)
  NullableUInt32Filter served_history_slots = 31;

  // The maximum number of int_peer_daily_order_by_peer_id to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 32;
  // A page token, received from a previous `ListIntPeerDailyOrderByPeerId` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 33;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 34;
}

// Response for listing int_peer_daily_order_by_peer_id records
message ListIntPeerDailyOrderByPeerIdResponse {
  // The list of int_peer_daily_order_by_peer_id.
  repeated IntPeerDailyOrderByPeerId int_peer_daily_order_by_peer_id = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_peer_daily_order_by_peer_id record by primary key
message GetIntPeerDailyOrderByPeerIdRequest {
  // libp2p peer ID, empty when the peer was only seen before peer IDs were recorded (April 2026)
  string peer_id = 1; // Primary key (required)
}

// Response for getting a single int_peer_daily_order_by_peer_id record
message GetIntPeerDailyOrderByPeerIdResponse {
  IntPeerDailyOrderByPeerId item = 1;
}

// Query int_peer_daily_order_by_peer_id data
service IntPeerDailyOrderByPeerIdService {
  // List records | int_peer_daily ordered by peer ID, for reading one peer across days. One row per consensus peer per day, from our libp2p sentries (heartbeats, identify, metadata and status exchanges) and the discovery crawler (ENRs). Holds no addresses. Residential peers are country-only: city and autonomous system are kept for hosting peers only.
  rpc List(ListIntPeerDailyOrderByPeerIdRequest) returns (ListIntPeerDailyOrderByPeerIdResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntPeerDailyOrderByPeerIdRequest) returns (GetIntPeerDailyOrderByPeerIdResponse);
}
