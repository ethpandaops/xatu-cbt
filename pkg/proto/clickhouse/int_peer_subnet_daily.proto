syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// One row per consensus peer per day with the attestation and sync subnets it last advertised in a metadata response to our libp2p sentries. Crawlers, probes, light clients and our own sentries are excluded.
message IntPeerSubnetDaily {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Start of the day period
  string day_start_date = 12;
  // Hash of the peer ID and network, the key shared by the libp2p tables
  int64 peer_id_unique_key = 13;
  // Attestation subnets the peer last advertised in the day: bit i is subnet i
  uint64 attnets = 14;
  // Sync committee subnets the peer last advertised in the day: bit i is subnet i
  uint32 syncnets = 15;
  // Metadata responses the peer sent our sentries in the day. 0 means the peer was dropped from the day on a recount
  uint32 response_count = 16;
}

// Request for listing int_peer_subnet_daily records
message ListIntPeerSubnetDailyRequest {
  // Filter by day_start_date - Start of the day period (PRIMARY KEY - required)
  StringFilter day_start_date = 1;

  // Filter by peer_id_unique_key - Hash of the peer ID and network, the key shared by the libp2p tables (ORDER BY column 2 - optional)
  Int64Filter peer_id_unique_key = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by attnets - Attestation subnets the peer last advertised in the day: bit i is subnet i (optional)
  UInt64Filter attnets = 4;
  // Filter by syncnets - Sync committee subnets the peer last advertised in the day: bit i is subnet i (optional)
  UInt32Filter syncnets = 5;
  // Filter by response_count - Metadata responses the peer sent our sentries in the day. 0 means the peer was dropped from the day on a recount (optional)
  UInt32Filter response_count = 6;

  // The maximum number of int_peer_subnet_daily to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7;
  // A page token, received from a previous `ListIntPeerSubnetDaily` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9;
}

// Response for listing int_peer_subnet_daily records
message ListIntPeerSubnetDailyResponse {
  // The list of int_peer_subnet_daily.
  repeated IntPeerSubnetDaily int_peer_subnet_daily = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_peer_subnet_daily record by primary key
message GetIntPeerSubnetDailyRequest {
  // Start of the day period
  string day_start_date = 1; // Primary key (required)
}

// Response for getting a single int_peer_subnet_daily record
message GetIntPeerSubnetDailyResponse {
  IntPeerSubnetDaily item = 1;
}

// Query int_peer_subnet_daily data
service IntPeerSubnetDailyService {
  // List records | One row per consensus peer per day with the attestation and sync subnets it last advertised in a metadata response to our libp2p sentries. Crawlers, probes, light clients and our own sentries are excluded.
  rpc List(ListIntPeerSubnetDailyRequest) returns (ListIntPeerSubnetDailyResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntPeerSubnetDailyRequest) returns (GetIntPeerSubnetDailyResponse);
}
