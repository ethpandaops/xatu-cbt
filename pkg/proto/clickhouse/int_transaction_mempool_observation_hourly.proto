syntax = "proto3";

package cbt;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";
// One row per transaction hash per hour in which it was sighted in the public mempool by at least one sentry. Rows summarise the sightings within that hour only. A transaction sighted across multiple hours has multiple rows

message IntTransactionMempoolObservationHourly {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The start of the hour bucket the sightings fall in
  uint32 hour_start_date_time = 12;
  // The transaction hash
  string hash = 13;
  // Earliest sighting of the transaction by any sentry within this hour
  int64 first_seen_date_time = 14;
  // Latest sighting of the transaction by any sentry within this hour
  int64 last_seen_date_time = 15;
  // Number of sightings of the transaction within this hour across all sentries
  uint32 sighting_count = 16;
  // Number of distinct sentries that sighted the transaction within this hour
  uint32 unique_sentries = 17;
  // The address of the account that sent the transaction
  string from = 18;
  // The address of the transaction recipient, null for contract creation
  google.protobuf.StringValue to = 19;
  // The nonce of the sender account at the time of the transaction
  uint64 nonce = 20;
  // The type of the transaction
  google.protobuf.UInt32Value type = 21;
  // The maximum gas provided for the transaction execution
  uint64 gas = 22;
  // The gas price of the transaction in wei
  string gas_price = 23;
  // The priority fee (tip) the user has set for the transaction in wei
  google.protobuf.StringValue gas_tip_cap = 24;
  // The max fee the user has set for the transaction in wei
  google.protobuf.StringValue gas_fee_cap = 25;
  // The value transferred with the transaction in wei
  string value = 26;
  // The size of the transaction data in bytes
  uint32 size = 27;
  // The size of the call data of the transaction in bytes
  uint32 call_data_size = 28;
  // The maximum gas provided for the blob transaction execution
  google.protobuf.UInt64Value blob_gas = 29;
  // The max blob fee the user has set for the transaction in wei
  google.protobuf.StringValue blob_gas_fee_cap = 30;
  // The hashes of the blob commitments for blob transactions
  repeated string blob_hashes = 31;
  // Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern
  bool is_cancel_shape = 32;
  // Name of the sentry with the earliest sighting this hour, ties broken by sentry name
  string first_sentry_name = 33;
  // City of the first-sighting sentry
  string first_sentry_geo_city = 34;
  // Country of the first-sighting sentry
  string first_sentry_geo_country = 35;
  // Country code of the first-sighting sentry
  string first_sentry_geo_country_code = 36;
  // Continent code of the first-sighting sentry
  string first_sentry_geo_continent_code = 37;
}

// Request for listing int_transaction_mempool_observation_hourly records
message ListIntTransactionMempoolObservationHourlyRequest {
  // Filter by hour_start_date_time - The start of the hour bucket the sightings fall in (PRIMARY KEY - required unless using alternatives: hash, from)
  UInt32Filter hour_start_date_time = 1;

  // Filter by hash - The transaction hash (ORDER BY column 2 - optional)
  StringFilter hash = 2;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 3;
  // Filter by first_seen_date_time - Earliest sighting of the transaction by any sentry within this hour (optional)
  Int64Filter first_seen_date_time = 4;
  // Filter by last_seen_date_time - Latest sighting of the transaction by any sentry within this hour (optional)
  Int64Filter last_seen_date_time = 5;
  // Filter by sighting_count - Number of sightings of the transaction within this hour across all sentries (optional)
  UInt32Filter sighting_count = 6;
  // Filter by unique_sentries - Number of distinct sentries that sighted the transaction within this hour (optional)
  UInt32Filter unique_sentries = 7;
  // Filter by from - The address of the account that sent the transaction (PROJECTION: p_by_nonce_group - alternative to hour_start_date_time)
  StringFilter from = 8;
  // Filter by to - The address of the transaction recipient, null for contract creation (optional)
  NullableStringFilter to = 9;
  // Filter by nonce - The nonce of the sender account at the time of the transaction (optional)
  UInt64Filter nonce = 10;
  // Filter by type - The type of the transaction (optional)
  NullableUInt32Filter type = 11;
  // Filter by gas - The maximum gas provided for the transaction execution (optional)
  UInt64Filter gas = 12;
  // Filter by gas_price - The gas price of the transaction in wei (optional)
  StringFilter gas_price = 13;
  // Filter by gas_tip_cap - The priority fee (tip) the user has set for the transaction in wei (optional)
  NullableStringFilter gas_tip_cap = 14;
  // Filter by gas_fee_cap - The max fee the user has set for the transaction in wei (optional)
  NullableStringFilter gas_fee_cap = 15;
  // Filter by value - The value transferred with the transaction in wei (optional)
  StringFilter value = 16;
  // Filter by size - The size of the transaction data in bytes (optional)
  UInt32Filter size = 17;
  // Filter by call_data_size - The size of the call data of the transaction in bytes (optional)
  UInt32Filter call_data_size = 18;
  // Filter by blob_gas - The maximum gas provided for the blob transaction execution (optional)
  NullableUInt64Filter blob_gas = 19;
  // Filter by blob_gas_fee_cap - The max blob fee the user has set for the transaction in wei (optional)
  NullableStringFilter blob_gas_fee_cap = 20;
  // Filter by blob_hashes - The hashes of the blob commitments for blob transactions (optional)
  ArrayStringFilter blob_hashes = 21;
  // Filter by is_cancel_shape - Whether the transaction is a self-transfer of zero value, the common wallet cancellation pattern (optional)
  BoolFilter is_cancel_shape = 22;
  // Filter by first_sentry_name - Name of the sentry with the earliest sighting this hour, ties broken by sentry name (optional)
  StringFilter first_sentry_name = 23;
  // Filter by first_sentry_geo_city - City of the first-sighting sentry (optional)
  StringFilter first_sentry_geo_city = 24;
  // Filter by first_sentry_geo_country - Country of the first-sighting sentry (optional)
  StringFilter first_sentry_geo_country = 25;
  // Filter by first_sentry_geo_country_code - Country code of the first-sighting sentry (optional)
  StringFilter first_sentry_geo_country_code = 26;
  // Filter by first_sentry_geo_continent_code - Continent code of the first-sighting sentry (optional)
  StringFilter first_sentry_geo_continent_code = 27;

  // The maximum number of int_transaction_mempool_observation_hourly to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 28;
  // A page token, received from a previous `ListIntTransactionMempoolObservationHourly` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 29;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 30;
}

// Response for listing int_transaction_mempool_observation_hourly records
message ListIntTransactionMempoolObservationHourlyResponse {
  // The list of int_transaction_mempool_observation_hourly.
  repeated IntTransactionMempoolObservationHourly int_transaction_mempool_observation_hourly = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_transaction_mempool_observation_hourly record by primary key
message GetIntTransactionMempoolObservationHourlyRequest {
  // The start of the hour bucket the sightings fall in
  uint32 hour_start_date_time = 1; // Primary key (required)
}

// Response for getting a single int_transaction_mempool_observation_hourly record
message GetIntTransactionMempoolObservationHourlyResponse {
  IntTransactionMempoolObservationHourly item = 1;
}

// Query int_transaction_mempool_observation_hourly data
service IntTransactionMempoolObservationHourlyService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListIntTransactionMempoolObservationHourlyRequest) returns (ListIntTransactionMempoolObservationHourlyResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntTransactionMempoolObservationHourlyRequest) returns (GetIntTransactionMempoolObservationHourlyResponse);
}
