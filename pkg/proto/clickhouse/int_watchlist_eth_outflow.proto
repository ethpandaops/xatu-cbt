syntax = "proto3";

package cbt;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu-cbt/pkg/proto/clickhouse";

// ETH sent out of a fixed list of addresses, ordered by recipient
message IntWatchlistEthOutflow {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Execution block number of the transfer
  uint32 block_number = 12;
  // Position of the transaction in the block
  uint32 transaction_index = 13;
  // Execution transaction hash of the transfer
  string transaction_hash = 14;
  // Position of the trace frame within the transaction
  uint32 internal_index = 15;
  // Trace address of the frame within the call tree
  string trace_address = 16;
  // Watched address that sent the ETH, lowercase 0x-prefixed
  string from_address = 17;
  // Address that received the ETH, lowercase 0x-prefixed
  string to_address = 18;
  // ETH sent in wei
  string value = 19;
}

// Request for listing int_watchlist_eth_outflow records
message ListIntWatchlistEthOutflowRequest {
  // Filter by to_address - Address that received the ETH, lowercase 0x-prefixed (PRIMARY KEY - required)
  StringFilter to_address = 1;

  // Filter by block_number - Execution block number of the transfer (ORDER BY column 2 - optional)
  UInt32Filter block_number = 2;

  // Filter by transaction_hash - Execution transaction hash of the transfer (ORDER BY column 3 - optional)
  StringFilter transaction_hash = 3;

  // Filter by internal_index - Position of the trace frame within the transaction (ORDER BY column 4 - optional)
  UInt32Filter internal_index = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by transaction_index - Position of the transaction in the block (optional)
  UInt32Filter transaction_index = 6;
  // Filter by trace_address - Trace address of the frame within the call tree (optional)
  StringFilter trace_address = 7;
  // Filter by from_address - Watched address that sent the ETH, lowercase 0x-prefixed (optional)
  StringFilter from_address = 8;
  // Filter by value - ETH sent in wei (optional)
  StringFilter value = 9;

  // The maximum number of int_watchlist_eth_outflow to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10;
  // A page token, received from a previous `ListIntWatchlistEthOutflow` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12;
}

// Response for listing int_watchlist_eth_outflow records
message ListIntWatchlistEthOutflowResponse {
  // The list of int_watchlist_eth_outflow.
  repeated IntWatchlistEthOutflow int_watchlist_eth_outflow = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single int_watchlist_eth_outflow record by primary key
message GetIntWatchlistEthOutflowRequest {
  // Address that received the ETH, lowercase 0x-prefixed
  string to_address = 1; // Primary key (required)
}

// Response for getting a single int_watchlist_eth_outflow record
message GetIntWatchlistEthOutflowResponse {
  IntWatchlistEthOutflow item = 1;
}

// Query int_watchlist_eth_outflow data
service IntWatchlistEthOutflowService {
  // List records | ETH sent out of a fixed list of addresses, ordered by recipient
  rpc List(ListIntWatchlistEthOutflowRequest) returns (ListIntWatchlistEthOutflowResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetIntWatchlistEthOutflowRequest) returns (GetIntWatchlistEthOutflowResponse);
}
