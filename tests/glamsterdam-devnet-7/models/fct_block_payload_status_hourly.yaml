model: fct_block_payload_status_hourly
network: glamsterdam-devnet-7
external_data:
    beacon_api_eth_v1_events_payload_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/glamsterdam-devnet-7/fct_block_payload_ptc_vote_beacon_api_eth_v1_events_payload_attestation.parquet
        network_column: meta_network_name
    canonical_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/glamsterdam-devnet-7/fct_block_payload_ptc_vote_canonical_beacon_block.parquet
        network_column: meta_network_name
    canonical_beacon_block_execution_payload_bid:
        url: https://data.ethpandaops.io/xatu-cbt/tests/glamsterdam-devnet-7/fct_block_payload_canonical_beacon_block_execution_payload_bid.parquet
        network_column: meta_network_name
    canonical_beacon_block_payload_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/glamsterdam-devnet-7/fct_block_payload_ptc_vote_canonical_beacon_block_payload_attestation.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_block_payload_status_hourly FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Status is delivered, absent or no_votes
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_payload_status_hourly FINAL
        WHERE status NOT IN ('delivered', 'absent', 'no_votes')
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Every hour carries all three buckets
      sql: |
        SELECT COUNT(*) AS bad_hours FROM (
          SELECT hour_start_date_time, COUNT(*) AS buckets
          FROM fct_block_payload_status_hourly FINAL
          GROUP BY hour_start_date_time
          HAVING buckets != 3
        )
      assertions:
        - type: equals
          column: bad_hours
          value: 0
    - name: Every canonical block is counted exactly once, orphaned blocks never
      sql: |
        SELECT
          (SELECT SUM(slot_count) FROM fct_block_payload_status_hourly FINAL)
          - (SELECT COUNT(*) FROM fct_block_payload_ptc_vote FINAL WHERE status = 'canonical') AS diff
      assertions:
        - type: equals
          column: diff
          value: 0
    - name: Delivered uses the PTC quorum of more than 256 present votes
      sql: |
        SELECT
          (SELECT SUM(slot_count) FROM fct_block_payload_status_hourly FINAL WHERE status = 'delivered')
          - (SELECT COUNT(*) FROM fct_block_payload_ptc_vote FINAL
             WHERE status = 'canonical' AND payload_present_votes > 256) AS diff
      assertions:
        - type: equals
          column: diff
          value: 0
