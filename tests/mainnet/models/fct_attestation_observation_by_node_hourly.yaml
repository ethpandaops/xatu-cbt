model: fct_attestation_observation_by_node_hourly
network: mainnet
external_data:
    beacon_api_eth_v1_events_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_observation_by_node_beacon_api_eth_v1_events_attestation.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_observation_by_node_libp2p_gossipsub_beacon_attestation.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_attestation_observation_by_node_hourly FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: One row per period and node
      sql: |
        SELECT COUNT(*) - uniqExact(hour_start_date_time, node_id) AS duplicate_rows FROM fct_attestation_observation_by_node_hourly FINAL
      assertions:
        - type: equals
          column: duplicate_rows
          value: 0
    - name: No empty node IDs
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_attestation_observation_by_node_hourly FINAL WHERE node_id = ''
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Every node slot in the source is counted once
      sql: |
        SELECT
            (SELECT sum(slot_count) FROM fct_attestation_observation_by_node_hourly FINAL) - (SELECT uniqExact(node_id, slot_start_date_time) FROM fct_attestation_observation_by_node FINAL WHERE node_id != '' AND toStartOfHour(slot_start_date_time) IN (SELECT hour_start_date_time FROM fct_attestation_observation_by_node_hourly FINAL)) AS difference
      assertions:
        - type: equals
          column: difference
          value: 0
    - name: Percentiles are ordered from p10_median_seen_slot_start_diff to p95_median_seen_slot_start_diff
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_attestation_observation_by_node_hourly FINAL
        WHERE p10_median_seen_slot_start_diff > p50_median_seen_slot_start_diff OR p50_median_seen_slot_start_diff > p90_median_seen_slot_start_diff OR p90_median_seen_slot_start_diff > p95_median_seen_slot_start_diff
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Hour start date time should be aligned to hour boundaries
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_attestation_observation_by_node_hourly FINAL WHERE hour_start_date_time != toStartOfHour(hour_start_date_time)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
