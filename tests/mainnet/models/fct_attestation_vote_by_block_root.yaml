assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_attestation_vote_by_block_root FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Votes per slot and block root match the validators in int_attestation_attested
      sql: |
        SELECT COUNT(*) AS bad_rows
        FROM (SELECT slot, block_root, vote_count FROM fct_attestation_vote_by_block_root FINAL) AS v
        FULL OUTER JOIN (
            SELECT slot, block_root, count() AS c FROM int_attestation_attested FINAL GROUP BY slot, block_root
        ) AS a ON v.slot = a.slot AND v.block_root = a.block_root
        WHERE v.vote_count != a.c
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Each slot and block root has one row
      sql: |
        SELECT COUNT(*) AS bad_rows FROM (
            SELECT slot, block_root FROM fct_attestation_vote_by_block_root FINAL GROUP BY slot, block_root HAVING count() > 1
        )
      assertions:
        - type: equals
          column: bad_rows
          value: 0
