        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_libp2p_gossipsub_beacon_attestation_j0624.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_block:
