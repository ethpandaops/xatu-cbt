model: fct_attestation_vote_by_block_root_head
network: mainnet
external_data:
    beacon_api_eth_v1_beacon_committee:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_beacon_api_eth_v1_beacon_committee.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_beacon_api_eth_v1_events_attestation.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_beacon_api_eth_v1_events_block.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_block_gossip:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_beacon_api_eth_v1_events_block_gossip.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_proposer_duty:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_beacon_api_eth_v1_proposer_duty.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_libp2p_gossipsub_beacon_attestation.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_attestation_correctness_head_libp2p_gossipsub_beacon_block.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_attestation_vote_by_block_root_head FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Votes per slot and block root match the validators in int_attestation_attested_head, for the slots the model has processed
      sql: |
        SELECT COUNT(*) AS bad_rows
        FROM (SELECT slot, block_root, vote_count FROM fct_attestation_vote_by_block_root_head FINAL) AS v
        FULL OUTER JOIN (
            SELECT slot, block_root, count() AS c FROM int_attestation_attested_head FINAL
            WHERE slot IN (SELECT slot FROM fct_attestation_vote_by_block_root_head FINAL)
            GROUP BY slot, block_root
        ) AS a ON v.slot = a.slot AND v.block_root = a.block_root
        WHERE v.vote_count != a.c
        SETTINGS join_use_nulls = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: DEBUG diff details
      sql: |
        SELECT
            (SELECT count() FROM fct_attestation_vote_by_block_root_head FINAL) AS mine_rows,
            (SELECT sum(vote_count) FROM fct_attestation_vote_by_block_root_head FINAL) AS mine_votes,
            (SELECT count() FROM int_attestation_attested_head FINAL WHERE slot GLOBAL IN (SELECT slot FROM fct_attestation_vote_by_block_root_head FINAL)) AS int_votes,
            (SELECT count() FROM int_attestation_attested_head WHERE slot GLOBAL IN (SELECT slot FROM fct_attestation_vote_by_block_root_head FINAL)) AS int_votes_nofinal,
            (SELECT uniqExact(slot) FROM fct_attestation_vote_by_block_root_head FINAL) AS mine_slots,
            (SELECT uniqExact(slot) FROM int_attestation_attested_head FINAL) AS int_slots,
            (SELECT count() FROM (SELECT slot, block_root, count() c FROM fct_attestation_vote_by_block_root_head GROUP BY slot, block_root HAVING c > 1)) AS mine_dups
      assertions:
        - type: equals
          column: mine_rows
          value: -1
        - type: equals
          column: mine_votes
          value: -1
        - type: equals
          column: int_votes
          value: -1
        - type: equals
          column: int_votes_nofinal
          value: -1
        - type: equals
          column: mine_slots
          value: -1
        - type: equals
          column: int_slots
          value: -1
        - type: equals
          column: mine_dups
          value: -1
    - name: Each slot and block root has one row
      sql: |
        SELECT COUNT(*) AS bad_rows FROM (
            SELECT slot, block_root FROM fct_attestation_vote_by_block_root_head FINAL GROUP BY slot, block_root HAVING count() > 1
        )
      assertions:
        - type: equals
          column: bad_rows
          value: 0
