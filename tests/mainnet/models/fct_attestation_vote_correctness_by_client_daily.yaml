        network_column: meta_network_name
    libp2p_gossipsub_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_blocks_libp2p_gossipsub_beacon_block.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_beacon_committee:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_attestation_attested_head_beacon_api_eth_v1_beacon_committee.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_attestation_attested_head_beacon_api_eth_v1_events_attestation.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_attestation_attested_head_libp2p_gossipsub_beacon_attestation.parquet
        network_column: meta_network_name
assertions:
    # The harness asserts once the daily model has processed one interval, while the hourly table it reads can
    # still be filling, so checks hold at any point in the fill rather than comparing exact totals.
    - name: Every mapped validator counts once per layer and totals never exceed the per-validator table
      sql: |
        SELECT
          (SELECT sumIf(validator_count, layer = 'consensus') FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS consensus_validators,
          (SELECT sumIf(validator_count, layer = 'execution') FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS execution_validators,
          (SELECT sumIf(total_duties, layer = 'consensus') FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS consensus_duties,
          (SELECT sumIf(total_duties, layer = 'execution') FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS execution_duties,
          (SELECT uniqExact(validator_index) FROM fct_attestation_vote_correctness_by_validator_hourly FINAL) AS hourly_validators,
          consensus_validators - execution_validators AS layer_validator_diff,
          consensus_duties - execution_duties AS layer_duty_diff,
          consensus_validators <= hourly_validators AS within_hourly
      assertions:
        - type: greater_than
          column: consensus_validators
          value: 10000
        - type: equals
          column: layer_validator_diff
          value: 0
        - type: equals
          column: layer_duty_diff
          value: 0
        - type: equals
          column: within_hourly
          value: 1
    - name: Only validators that proposed with identifying graffiti map to a client
      sql: |
        SELECT
          (SELECT uniqExact(proposer_index) FROM fct_block_graffiti FINAL WHERE consensus_client != 'unknown') AS identifiable,
          (SELECT sumIf(validator_count, layer = 'consensus' AND client != 'unknown') FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS mapped,
          mapped <= identifiable AS within_identifiable,
          (SELECT countIf(layer = 'consensus' AND client NOT IN (SELECT DISTINCT consensus_client FROM fct_block_graffiti FINAL)) FROM fct_attestation_vote_correctness_by_client_daily FINAL) AS foreign_clients
      assertions:
        - type: greater_than
          column: mapped
          value: 5
        - type: equals
          column: within_identifiable
          value: 1
        - type: equals
          column: foreign_clients
          value: 0
    - name: Correct votes never exceed attestations
      sql: |
        SELECT countIf(head_correct_count > attested_count OR target_correct_count > attested_count OR attested_count + missed_count != total_duties) AS bad_rows
        FROM fct_attestation_vote_correctness_by_client_daily FINAL
      assertions:
        - type: equals
          column: bad_rows
          value: 0
