        network_column: meta_network_name
    libp2p_gossipsub_beacon_attestation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_attestation_attested_head_libp2p_gossipsub_beacon_attestation.parquet
        network_column: meta_network_name
assertions:
    # The harness asserts once the daily model has processed one interval, while the hourly table it reads can
    # still be filling, so checks hold at any point in the fill rather than comparing exact totals.
    - name: Every validator counts once and totals never exceed the per-validator table
      sql: |
        SELECT
          (SELECT sum(validator_count) FROM fct_attestation_vote_correctness_by_client_pair_daily FINAL) AS validators,
          (SELECT uniqExact(validator_index) FROM fct_attestation_vote_correctness_by_validator_hourly FINAL) AS hourly_validators,
          validators <= hourly_validators AS within_hourly,
          (SELECT sumIf(validator_count, consensus_client = 'unknown' AND execution_client = 'unknown') FROM fct_attestation_vote_correctness_by_client_pair_daily FINAL) AS unmapped
      assertions:
        - type: greater_than
          column: validators
          value: 10000
        - type: equals
          column: within_hourly
          value: 1
        - type: greater_than
          column: unmapped
          value: 10000
    - name: Only validators that proposed with identifying graffiti map to a pair, and pairs come from one graffiti
      sql: |
        SELECT
          (SELECT uniqExact(proposer_index) FROM fct_block_graffiti FINAL WHERE consensus_client != 'unknown' OR execution_client != 'unknown') AS identifiable,
          (SELECT sumIf(validator_count, NOT (consensus_client = 'unknown' AND execution_client = 'unknown')) FROM fct_attestation_vote_correctness_by_client_pair_daily FINAL) AS mapped,
          mapped <= identifiable AS within_identifiable,
          (SELECT countIf((consensus_client, execution_client) GLOBAL NOT IN (SELECT DISTINCT consensus_client, execution_client FROM fct_block_graffiti FINAL)
            AND NOT (consensus_client = 'unknown' AND execution_client = 'unknown')) FROM fct_attestation_vote_correctness_by_client_pair_daily FINAL) AS foreign_pairs
      assertions:
        - type: greater_than
          column: mapped
          value: 5
        - type: equals
          column: within_identifiable
          value: 1
        - type: equals
          column: foreign_pairs
          value: 0
    - name: Correct votes never exceed attestations
      sql: |
        SELECT countIf(head_correct_count > attested_count OR target_correct_count > attested_count OR attested_count + missed_count != total_duties) AS bad_rows
        FROM fct_attestation_vote_correctness_by_client_pair_daily FINAL
      assertions:
        - type: equals
          column: bad_rows
          value: 0
