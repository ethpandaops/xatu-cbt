        network_column: meta_network_name
assertions:
    - name: Daily sums never exceed the hourly table and split into attested and missed
      sql: |
        SELECT
          (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_entity_daily FINAL) AS daily_duties,
          daily_duties <= (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_entity_hourly FINAL) AS within_hourly,
          (SELECT countIf(attested_count + missed_count != total_duties OR head_correct_count > attested_count OR target_correct_count > attested_count) FROM fct_attestation_vote_correctness_by_entity_daily FINAL) AS bad_rows
      assertions:
        - type: greater_than
          column: daily_duties
          value: 10000
        - type: equals
          column: within_hourly
          value: 1
        - type: equals
          column: bad_rows
          value: 0
