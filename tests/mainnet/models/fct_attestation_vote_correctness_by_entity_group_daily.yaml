assertions:
    # The harness asserts once the model has processed one interval, while its source can still be filling, so
    # checks bound the group by its members rather than compare exact totals.
    - name: Group rows sum no more than their member entities and split into attested and missed
      sql: |
        SELECT
          (SELECT count() FROM fct_attestation_vote_correctness_by_entity_group_daily FINAL) AS group_rows,
          (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_entity_group_daily FINAL)
            <= (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_entity_daily FINAL WHERE position(entity, 'lido') > 0) AS within_members,
          (SELECT countIf(entity_group != 'lido' OR attested_count + missed_count != total_duties OR head_correct_count > attested_count) FROM fct_attestation_vote_correctness_by_entity_group_daily FINAL) AS bad_rows
      assertions:
        - type: greater_than
          column: group_rows
          value: 0
        - type: equals
          column: within_members
          value: 1
        - type: equals
          column: bad_rows
          value: 0
