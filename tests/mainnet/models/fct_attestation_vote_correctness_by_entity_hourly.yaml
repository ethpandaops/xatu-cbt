        network_column: meta_network_name
assertions:
    # The harness asserts once the model has processed one interval, while the hourly table it reads can still be
    # filling, so checks hold at any point in the fill rather than comparing exact totals.
    - name: Duties never exceed the per-validator table and split into attested and missed
      sql: |
        SELECT
          (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_entity_hourly FINAL) AS entity_duties,
          entity_duties <= (SELECT sum(total_duties) FROM fct_attestation_vote_correctness_by_validator_hourly FINAL) AS within_validators,
          (SELECT countIf(attested_count + missed_count != total_duties OR head_correct_count > attested_count OR target_correct_count > attested_count) FROM fct_attestation_vote_correctness_by_entity_hourly FINAL) AS bad_rows
      assertions:
        - type: greater_than
          column: entity_duties
          value: 10000
        - type: equals
          column: within_validators
          value: 1
        - type: equals
          column: bad_rows
          value: 0
    - name: Validators map to their dim_node entity
      sql: |
        SELECT
          sumIf(validator_count, entity != 'unknown') AS named_validators,
          countIf(entity = '') AS empty_entity
        FROM fct_attestation_vote_correctness_by_entity_hourly FINAL
      assertions:
        - type: greater_than
          column: named_validators
          value: 1000
        - type: equals
          column: empty_entity
          value: 0
