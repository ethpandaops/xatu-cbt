model: fct_block_blob_count
network: mainnet
external_data:
    beacon_api_eth_v1_events_blob_sidecar:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_blob_count_beacon_api_eth_v1_events_blob_sidecar.parquet
        network_column: meta_network_name
        optional: true
    beacon_api_eth_v1_events_data_column_sidecar:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_blob_count_beacon_api_eth_v1_events_data_column_sidecar.parquet
        network_column: meta_network_name
        optional: true
    canonical_beacon_blob_sidecar:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_blob_count_canonical_beacon_blob_sidecar.parquet
        network_column: meta_network_name
        optional: true
    canonical_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_reorg_hourly_canonical_beacon_block.parquet
        network_column: meta_network_name
        optional: true
    libp2p_gossipsub_blob_sidecar:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_blob_count_libp2p_gossipsub_blob_sidecar.parquet
        network_column: meta_network_name
        optional: true
    libp2p_gossipsub_data_column_sidecar:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_blob_count_libp2p_gossipsub_data_column_sidecar.parquet
        network_column: meta_network_name
        optional: true
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_block_blob_count FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: No null slot values
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE slot IS NULL
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: No null block_root values
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE block_root IS NULL OR block_root = ''
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: No negative blob_count values
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE blob_count < 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Status should only contain canonical or orphaned
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE status NOT IN ('canonical', 'orphaned')
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Slot start date time should not be in the future
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE slot_start_date_time > now()
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Epoch should be consistent with slot
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE epoch != intDiv(slot, 32)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: No duplicate block_root per slot and status
      sql: |
        SELECT COUNT(*) AS bad_rows FROM (
          SELECT slot, block_root, status, COUNT(*) AS cnt
          FROM fct_block_blob_count FINAL
          GROUP BY slot, block_root, status
          HAVING cnt > 1
        )
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Blob count should not exceed max blobs per block
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE blob_count > 21
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Updated date time should not be null
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_blob_count FINAL
        WHERE updated_date_time IS NULL
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Every canonical block with blob gas has a canonical row whose count is its blob gas over 131072
      sql: |
        SELECT
          countIf(b.gas > 0) AS blob_blocks,
          countIf(b.gas > 0 AND c.blob_count IS NULL) AS missing,
          countIf(b.gas > 0 AND c.blob_count IS NOT NULL AND c.blob_count != intDiv(b.gas, 131072)) AS wrong_count
        FROM (
          SELECT slot_start_date_time, toString(block_root) AS block_root, ifNull(execution_payload_blob_gas_used, 0) AS gas
          FROM int_block_canonical FINAL
          WHERE slot_start_date_time BETWEEN (SELECT min(slot_start_date_time) FROM fct_block_blob_count FINAL)
            AND (SELECT max(slot_start_date_time) FROM fct_block_blob_count FINAL)
        ) AS b
        LEFT JOIN (
          SELECT slot_start_date_time, block_root, blob_count FROM fct_block_blob_count FINAL WHERE status = 'canonical'
        ) AS c USING (slot_start_date_time, block_root)
        SETTINGS join_use_nulls = 1
      assertions:
        - type: greater_than
          column: blob_blocks
          value: 0
        - type: equals
          column: missing
          value: 0
        - type: equals
          column: wrong_count
          value: 0
    - name: No orphaned row is a canonical block
      sql: |
        SELECT COUNT(*) AS bad_rows
        FROM fct_block_blob_count AS f FINAL
        WHERE f.status = 'orphaned'
          AND (f.slot_start_date_time, f.block_root) GLOBAL IN (
            SELECT slot_start_date_time, toString(block_root) FROM int_block_canonical FINAL
          )
      assertions:
        - type: equals
          column: bad_rows
          value: 0
