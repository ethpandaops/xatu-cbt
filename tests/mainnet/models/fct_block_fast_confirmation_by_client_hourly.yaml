model: fct_block_fast_confirmation_by_client_hourly
network: mainnet
external_data:
    beacon_api_eth_v1_events_fast_confirmation:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_fast_confirmation_by_client_hourly_beacon_api_eth_v1_events_fast_confirmation.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_finalized_checkpoint:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_fast_confirmation_by_client_hourly_beacon_api_eth_v1_events_finalized_checkpoint.parquet
        network_column: meta_network_name
    canonical_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_fast_confirmation_by_client_hourly_canonical_beacon_block.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_block_fast_confirmation_by_client_hourly FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Every row aggregates at least one canonical or orphaned observation
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE observation_count + orphaned_count = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Direct, descendant and unconfirmed counts sum to observation count
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE direct_count + descendant_count + unconfirmed_count != observation_count
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Node and slot counts are consistent with observation count
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE node_count > observation_count
          OR slot_count > observation_count
          OR toUInt64(observation_count) > toUInt64(node_count) * toUInt64(slot_count)
          OR (observation_count > 0 AND (node_count = 0 OR slot_count = 0))
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Fast confirmation percentiles are monotonically ordered
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE min_fast_confirmation_ms > p50_fast_confirmation_ms
          OR p50_fast_confirmation_ms > p90_fast_confirmation_ms
          OR p90_fast_confirmation_ms > p95_fast_confirmation_ms
          OR p95_fast_confirmation_ms > p99_fast_confirmation_ms
          OR p99_fast_confirmation_ms > max_fast_confirmation_ms
          OR avg_fast_confirmation_ms < min_fast_confirmation_ms
          OR avg_fast_confirmation_ms > max_fast_confirmation_ms
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Finality percentiles are monotonically ordered
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE min_finality_ms > p50_finality_ms
          OR p50_finality_ms > p95_finality_ms
          OR p95_finality_ms > max_finality_ms
          OR avg_finality_ms < min_finality_ms
          OR avg_finality_ms > max_finality_ms
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Fast confirmation stats are zero when no canonical observation was confirmed
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE direct_count + descendant_count = 0
          AND (max_fast_confirmation_ms != 0 OR avg_fast_confirmation_ms != 0 OR p50_fast_confirmation_ms != 0)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Confirmed observations have a positive max fast confirmation time
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE direct_count + descendant_count > 0
          AND max_fast_confirmation_ms = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Hour start is aligned to the start of an hour
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE toStartOfHour(hour_start_date_time) != hour_start_date_time
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Median speedup is finite and non-negative
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_fast_confirmation_by_client_hourly FINAL
        WHERE p50_speedup < 0
          OR isNaN(p50_speedup)
          OR isInfinite(p50_speedup)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
