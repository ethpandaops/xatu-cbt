model: fct_block_graffiti
network: mainnet
external_data:
    canonical_beacon_block_graffiti:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/canonical_beacon_block_graffiti_v2.parquet
        network_column: meta_network_name
assertions:
    - name: One row per source block
      sql: |
        SELECT COUNT(*) AS row_count, uniqExact(block_root) AS block_count FROM fct_block_graffiti FINAL
      assertions:
        - type: equals
          column: row_count
          value: 621
        - type: equals
          column: block_count
          value: 621
    - name: Epoch is consistent with slot
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti FINAL WHERE epoch != intDiv(slot, 32)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Formats and client names come from the known sets
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti FINAL
        WHERE graffiti_format NOT IN ('codes_full', 'codes_long', 'codes_short', 'codes_min', 'version_string', 'rocketpool', 'none', 'empty')
          OR consensus_client NOT IN ('caplin', 'grandine', 'lighthouse', 'lodestar', 'nimbus', 'prysm', 'teku', 'unknown')
          OR execution_client NOT IN ('besu', 'ethereumjs', 'erigon', 'ethrex', 'geth', 'nethermind', 'nimbusel', 'trin-execution', 'reth', 'unknown')
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Unmatched graffiti names no client, version or commit
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti FINAL
        WHERE graffiti_format IN ('none', 'empty')
          AND (consensus_client != 'unknown' OR execution_client != 'unknown' OR consensus_client_version != ''
            OR consensus_client_commit != '' OR execution_client_commit != '')
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Matched graffiti names at least one client
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti FINAL
        WHERE graffiti_format NOT IN ('none', 'empty') AND consensus_client = 'unknown' AND execution_client = 'unknown'
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: "Client codes with 4 character commits: NM9205LHe423"
      sql: |
        SELECT COUNT(*) AS rows_with_text, countIf((graffiti_format, consensus_client, consensus_client_version,
          consensus_client_commit, execution_client, execution_client_commit) != ('codes_long', 'lighthouse', '', 'e423', 'nethermind', '9205')) AS mismatched
        FROM fct_block_graffiti FINAL WHERE graffiti_text = 'NM9205LHe423'
      assertions:
        - type: greater_than
          column: rows_with_text
          value: 0
        - type: equals
          column: mismatched
