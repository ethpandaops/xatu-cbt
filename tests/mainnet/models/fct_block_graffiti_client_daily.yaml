model: fct_block_graffiti_client_daily
network: mainnet
external_data:
    canonical_beacon_block_graffiti:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/canonical_beacon_block_graffiti.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_block_graffiti_client_daily FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Block counts add up to every source block
      sql: |
        SELECT SUM(block_count) AS total_blocks FROM fct_block_graffiti_client_daily FINAL
      assertions:
        - type: equals
          column: total_blocks
          value: 615
    - name: Counts match the per-block table for every day and client pair
      sql: |
        SELECT COUNT(*) AS mismatched FROM (
          SELECT day_start_date, consensus_client, execution_client, block_count
          FROM fct_block_graffiti_client_daily FINAL
        ) AS a
        FULL OUTER JOIN (
          SELECT toDate(slot_start_date_time) AS day_start_date, consensus_client, execution_client, toUInt32(count()) AS block_count
          FROM fct_block_graffiti FINAL
          GROUP BY day_start_date, consensus_client, execution_client
        ) AS b USING (day_start_date, consensus_client, execution_client)
        WHERE a.block_count != b.block_count
      assertions:
        - type: equals
          column: mismatched
          value: 0
    - name: Every row counts at least one block
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti_client_daily FINAL WHERE block_count = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: One row per day and client pair
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT day_start_date, consensus_client, execution_client
          FROM fct_block_graffiti_client_daily FINAL
          GROUP BY day_start_date, consensus_client, execution_client
          HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
