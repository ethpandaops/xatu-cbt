model: fct_block_graffiti_client_hourly
network: mainnet
external_data:
    canonical_beacon_block_graffiti:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/canonical_beacon_block_graffiti_v2.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_block_graffiti_client_hourly FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Block counts add up to every source block
      sql: |
        SELECT SUM(block_count) AS total_blocks FROM fct_block_graffiti_client_hourly FINAL
      assertions:
        - type: equals
          column: total_blocks
          value: 621
    - name: Counts match the per-block table for every hour and client pair
      sql: |
        SELECT COUNT(*) AS mismatched FROM (
          SELECT hour_start_date_time, consensus_client, execution_client, block_count
          FROM fct_block_graffiti_client_hourly FINAL
        ) AS a
        FULL OUTER JOIN (
          SELECT toStartOfHour(slot_start_date_time) AS hour_start_date_time, consensus_client, execution_client, toUInt32(count()) AS block_count
          FROM fct_block_graffiti FINAL
          GROUP BY hour_start_date_time, consensus_client, execution_client
        ) AS b USING (hour_start_date_time, consensus_client, execution_client)
        WHERE a.block_count != b.block_count
      assertions:
        - type: equals
          column: mismatched
          value: 0
    - name: Unknown clients are counted
      sql: |
        SELECT SUM(block_count) AS unknown_blocks FROM fct_block_graffiti_client_hourly FINAL
        WHERE consensus_client = 'unknown' AND execution_client = 'unknown'
      assertions:
        - type: greater_than
          column: unknown_blocks
          value: 0
    - name: Hour start date time is aligned to the hour
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti_client_hourly FINAL
        WHERE hour_start_date_time != toStartOfHour(hour_start_date_time)
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Every row counts at least one block
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_block_graffiti_client_hourly FINAL WHERE block_count = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: One row per hour and client pair
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT hour_start_date_time, consensus_client, execution_client
          FROM fct_block_graffiti_client_hourly FINAL
          GROUP BY hour_start_date_time, consensus_client, execution_client
          HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
