        network_column: meta_network_name
assertions:
    - name: Group proposals sum no more than their member entities
      sql: |
        SELECT
          (SELECT sum(block_count + orphaned_block_count + missed_slot_count) FROM fct_block_proposal_by_entity_group_daily FINAL) AS group_proposals,
          group_proposals <= (SELECT sum(block_count + orphaned_block_count + missed_slot_count) FROM fct_block_proposal_by_entity_daily FINAL WHERE position(entity, 'lido') > 0) AS within_members,
          (SELECT countIf(entity_group != 'lido' OR mev_block_count > block_count) FROM fct_block_proposal_by_entity_group_daily FINAL) AS bad_rows
      assertions:
        - type: equals
          column: within_members
          value: 1
        - type: equals
          column: bad_rows
          value: 0
