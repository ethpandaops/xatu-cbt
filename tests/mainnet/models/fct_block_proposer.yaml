model: fct_block_proposer
network: mainnet
external_data:
    beacon_api_eth_v1_events_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_beacon_api_eth_v1_events_block.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_events_block_gossip:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_beacon_api_eth_v1_events_block_gossip.parquet
        network_column: meta_network_name
    beacon_api_eth_v1_proposer_duty:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_beacon_api_eth_v1_proposer_duty.parquet
        network_column: meta_network_name
    canonical_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_canonical_beacon_block.parquet
        network_column: meta_network_name
    canonical_beacon_proposer_duty:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_canonical_beacon_proposer_duty.parquet
        network_column: meta_network_name
    libp2p_gossipsub_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_block_proposer_libp2p_gossipsub_beacon_block.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS count FROM fct_block_proposer FINAL
      assertions:
        - type: greater_than
          column: count
          value: 0
    - name: Slot values should be non-negative
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE slot < 0
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Epoch values should be non-negative
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE epoch < 0
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Proposer validator index should be non-negative
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE proposer_validator_index < 0
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Status should only contain valid values
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE status NOT IN ('canonical', 'orphaned', 'missed')
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Canonical blocks must have block_root
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE status = 'canonical' AND block_root IS NULL
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Orphaned blocks must have block_root
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE status = 'orphaned' AND block_root IS NULL
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Missed blocks should not have block_root
      sql: |
        SELECT COUNT(*) AS invalid_count FROM fct_block_proposer FINAL WHERE status = 'missed' AND block_root IS NOT NULL
      assertions:
        - type: equals
          column: invalid_count
          value: 0
    - name: Proposer pubkey should not be null
      sql: |
        SELECT COUNT(*) AS null_count FROM fct_block_proposer FINAL WHERE proposer_pubkey IS NULL OR proposer_pubkey = ''
      assertions:
        - type: equals
          column: null_count
          value: 0
    - name: Each slot should have exactly one proposer entry
      sql: |
        SELECT COUNT(*) AS duplicate_count FROM (SELECT slot, COUNT(*) AS cnt FROM fct_block_proposer FINAL GROUP BY slot HAVING cnt > 1)
      assertions:
        - type: equals
          column: duplicate_count
          value: 0
    - name: Where the head has the slot, status and block_root match the head and canonical models
      sql: |
        SELECT COUNT(*) AS mismatch_count
        FROM (SELECT slot, status, block_root FROM fct_block_proposer FINAL) AS p
        GLOBAL INNER JOIN (
            SELECT slot, any(block_root) AS block_root FROM int_block_proposer_canonical FINAL GROUP BY slot
        ) AS c ON p.slot = c.slot
        GLOBAL INNER JOIN (
            SELECT slot, any(block_root) AS block_root FROM fct_block_proposer_head FINAL GROUP BY slot
        ) AS h ON p.slot = h.slot
        WHERE p.status != multiIf(c.block_root IS NOT NULL, 'canonical', h.block_root IS NOT NULL, 'orphaned', 'missed')
            OR ifNull(p.block_root, '') != ifNull(coalesce(c.block_root, h.block_root), '')
        SETTINGS join_use_nulls = 1
      assertions:
        - type: equals
          column: mismatch_count
          value: 0
    - name: Every canonical slot from the head's first slot has a row
      sql: |
        SELECT COUNT(*) AS missing_count
        FROM int_block_proposer_canonical FINAL
        WHERE slot >= (SELECT min(slot) FROM fct_block_proposer_head FINAL)
            AND slot <= (SELECT max(slot) FROM fct_block_proposer FINAL)
            AND slot GLOBAL NOT IN (SELECT slot FROM fct_block_proposer FINAL)
      assertions:
        - type: equals
          column: missing_count
          value: 0
    - name: Orphaned only where the head has the slot
      sql: |
        SELECT COUNT(*) AS invalid_count
        FROM fct_block_proposer FINAL
        WHERE status = 'orphaned'
            AND slot GLOBAL NOT IN (SELECT slot FROM fct_block_proposer_head FINAL WHERE block_root IS NOT NULL)
      assertions:
        - type: equals
          column: invalid_count
          value: 0
