model: fct_engine_new_payload_winrate_hourly
network: mainnet
external_data:
    # fct_block_head (upstream) needs beacon_api_eth_v1_events_block, and the
    # hourly fixtures had none, so nothing ran and the test idled out its
    # 10m wait. Share the daily model's fixtures, which cover the same chain.
    beacon_api_eth_v1_events_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_engine_new_payload_winrate_daily_beacon_api_eth_v1_events_block.parquet
        network_column: meta_network_name
    beacon_api_eth_v2_beacon_block:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_engine_new_payload_winrate_daily_beacon_api_eth_v2_beacon_block.parquet
        network_column: meta_network_name
    execution_engine_new_payload:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/fct_engine_new_payload_winrate_daily_execution_engine_new_payload.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be non-negative
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL
      assertions:
        - type: greater_than_or_equal
          column: count
          value: 0
    - name: win_count should never be negative
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL WHERE win_count < 0
      assertions:
        - type: equals
          column: count
          value: 0
    - name: hour_start_date_time should be aligned to start of hour
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL WHERE hour_start_date_time != toStartOfHour(hour_start_date_time)
      assertions:
        - type: equals
          column: count
          value: 0
    - name: meta_execution_implementation should not be empty
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL WHERE meta_execution_implementation = '' OR meta_execution_implementation IS NULL
      assertions:
        - type: equals
          column: count
          value: 0
    - name: updated_date_time should not be null
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL WHERE updated_date_time IS NULL
      assertions:
        - type: equals
          column: count
          value: 0
    - name: Each hour-node_class-implementation combination should be unique
      sql: |
        SELECT COUNT(*) AS count FROM (
          SELECT hour_start_date_time, node_class, meta_execution_implementation, COUNT(*) AS cnt
          FROM fct_engine_new_payload_winrate_hourly FINAL
          GROUP BY hour_start_date_time, node_class, meta_execution_implementation
          HAVING cnt > 1
        )
      assertions:
        - type: equals
          column: count
          value: 0
    - name: win_count per implementation should not exceed distinct slots observed for that hour and node_class
      sql: |
        SELECT COUNT(*) AS violation_count
        FROM fct_engine_new_payload_winrate_hourly AS w FINAL
        GLOBAL INNER JOIN (
          SELECT toStartOfHour(slot_start_date_time) AS hour_start_date_time, node_class, uniqExact(slot) AS slot_count
          FROM int_engine_new_payload_fastest_execution_by_node_class FINAL
          GROUP BY hour_start_date_time, node_class
        ) AS s ON w.hour_start_date_time = s.hour_start_date_time AND w.node_class = s.node_class
        WHERE w.win_count > s.slot_count
      assertions:
        - type: equals
          column: violation_count
          value: 0
    - name: hour_start_date_time should not be in the future
      sql: |
        SELECT COUNT(*) AS count FROM fct_engine_new_payload_winrate_hourly FINAL WHERE hour_start_date_time > now()
      assertions:
        - type: equals
          column: count
          value: 0
