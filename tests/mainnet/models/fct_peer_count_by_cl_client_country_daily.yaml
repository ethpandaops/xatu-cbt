model: fct_peer_count_by_cl_client_country_daily
network: mainnet
external_data:
    libp2p_synthetic_heartbeat:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_libp2p_synthetic_heartbeat.parquet
        network_column: meta_network_name
    libp2p_identify:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_libp2p_identify.parquet
        network_column: meta_network_name
assertions:
    - name: "Counts every consensus peer once and leaves crawlers out"
      sql: |
        SELECT
          (SELECT sum(peer_count) FROM fct_peer_count_by_cl_client_country_daily FINAL) AS peers,
          peers - 6973 AS peer_diff,
          (SELECT sumIf(peer_count, client = 'lighthouse') FROM fct_peer_count_by_cl_client_country_daily FINAL) AS lighthouse_peers,
          (SELECT sumIf(peer_count, client IN ('erigon', 'tysm', 'hermes', 'nebula')) FROM fct_peer_count_by_cl_client_country_daily FINAL) AS excluded_peers
      assertions:
        - type: equals
          column: peer_diff
          value: 0
        - type: equals
          column: lighthouse_peers
          value: 4399
        - type: equals
          column: excluded_peers
          value: 0
    - name: "No bucket singles out one or two peers"
      sql: |
        SELECT COUNT(*) AS small_rows FROM fct_peer_count_by_cl_client_country_daily FINAL
        WHERE peer_count < 3 AND NOT (continent_code = 'other' AND country_code = 'other')
      assertions:
        - type: equals
          column: small_rows
          value: 0
    - name: "One row per key"
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT day_start_date, client, continent_code, country_code, country FROM fct_peer_count_by_cl_client_country_daily FINAL GROUP BY day_start_date, client, continent_code, country_code, country HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
