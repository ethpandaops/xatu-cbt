model: fct_peer_count_by_el_client_asn_daily
network: mainnet
external_data:
    node_record_execution:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_node_record_execution.parquet
        network_column: meta_network_name
assertions:
    - name: "Counts every execution node on the network genesis once"
      sql: |
        SELECT
          (SELECT sum(peer_count) FROM fct_peer_count_by_el_client_asn_daily FINAL) AS nodes,
          nodes - 7831 AS node_diff,
          (SELECT sumIf(peer_count, client = 'geth') FROM fct_peer_count_by_el_client_asn_daily FINAL) AS geth_nodes,
          (SELECT sumIf(peer_count, client IN ('op-reth', 'reth-bsc', 'bera-reth', 'nimbus')) FROM fct_peer_count_by_el_client_asn_daily FINAL) AS other_chain_nodes
      assertions:
        - type: equals
          column: node_diff
          value: 0
        - type: equals
          column: geth_nodes
          value: 5538
        - type: equals
          column: other_chain_nodes
          value: 0
    - name: "No named autonomous system has under 3 nodes"
      sql: |
        SELECT COUNT(*) AS small_rows FROM fct_peer_count_by_el_client_asn_daily FINAL WHERE peer_count < 3 AND autonomous_system_organization NOT IN ('other', 'unknown')
      assertions:
        - type: equals
          column: small_rows
          value: 0
    - name: "One row per key"
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT day_start_date, client, network_type, autonomous_system_organization, autonomous_system_number FROM fct_peer_count_by_el_client_asn_daily FINAL GROUP BY day_start_date, client, network_type, autonomous_system_organization, autonomous_system_number HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
