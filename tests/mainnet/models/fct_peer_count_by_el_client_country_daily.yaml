model: fct_peer_count_by_el_client_country_daily
network: mainnet
external_data:
    node_record_execution:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_node_record_execution.parquet
        network_column: meta_network_name
assertions:
    - name: "Counts every execution node on the network genesis and current fork once"
      sql: |
        SELECT
          (SELECT sum(peer_count) FROM fct_peer_count_by_el_client_country_daily FINAL) AS nodes,
          nodes - 7462 AS node_diff,
          (SELECT sumIf(peer_count, client = 'geth') FROM fct_peer_count_by_el_client_country_daily FINAL) AS geth_nodes,
          (SELECT sumIf(peer_count, client IN ('op-reth', 'reth-bsc', 'bera-reth', 'nimbus')) FROM fct_peer_count_by_el_client_country_daily FINAL) AS other_chain_nodes
      assertions:
        - type: equals
          column: node_diff
          value: 0
        - type: equals
          column: geth_nodes
          value: 5338
        - type: equals
          column: other_chain_nodes
          value: 0
    - name: "No bucket singles out one or two nodes"
      sql: |
        SELECT COUNT(*) AS small_rows FROM fct_peer_count_by_el_client_country_daily FINAL
        WHERE peer_count < 3 AND NOT (continent_code = 'other' AND country_code = 'other')
      assertions:
        - type: equals
          column: small_rows
          value: 0
    - name: "One row per key"
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT day_start_date, client, continent_code, country_code, country FROM fct_peer_count_by_el_client_country_daily FINAL GROUP BY day_start_date, client, continent_code, country_code, country HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
