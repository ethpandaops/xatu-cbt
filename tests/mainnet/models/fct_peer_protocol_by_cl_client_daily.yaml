model: fct_peer_protocol_by_cl_client_daily
network: mainnet
external_data:
    libp2p_synthetic_heartbeat:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_libp2p_synthetic_heartbeat.parquet
        network_column: meta_network_name
    libp2p_identify:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/clients_census_libp2p_identify.parquet
        network_column: meta_network_name
assertions:
    - name: "Gossipsub v1.3 support is a subset of the client peers"
      sql: |
        SELECT
          maxIf(peer_count, client = 'lighthouse' AND protocol = '/meshsub/1.3.0') AS lighthouse_v13,
          maxIf(client_peer_count, client = 'lighthouse') AS lighthouse_peers,
          countIf(peer_count > client_peer_count OR peer_count < 3) AS bad_rows
        FROM fct_peer_protocol_by_cl_client_daily FINAL
      assertions:
        - type: greater_than
          column: lighthouse_v13
          value: 1000
        - type: equals
          column: lighthouse_peers
          value: 4399
        - type: equals
          column: bad_rows
          value: 0
    - name: "One row per key"
      sql: |
        SELECT COUNT(*) AS duplicate_keys FROM (
          SELECT day_start_date, client, protocol FROM fct_peer_protocol_by_cl_client_daily FINAL GROUP BY day_start_date, client, protocol HAVING COUNT(*) > 1
        )
      assertions:
        - type: equals
          column: duplicate_keys
          value: 0
