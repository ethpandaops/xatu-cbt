assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM fct_slot_summary FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: One row per slot, matching fct_block_proposer for the slots written
      sql: |
        SELECT if(
            (SELECT arraySort(groupArray(tuple(slot, status, ifNull(block_root, '')))) FROM fct_slot_summary FINAL)
            = (SELECT arraySort(groupArray(tuple(slot, status, ifNull(block_root, '')))) FROM fct_block_proposer FINAL
               WHERE slot GLOBAL IN (SELECT slot FROM fct_slot_summary FINAL)),
            0, 1) AS bad_rows
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Missed slots carry no block facts, proposed ones a gas figure
      sql: |
        SELECT COUNT(*) AS bad_rows FROM fct_slot_summary FINAL
        WHERE (status = 'missed' AND (block_number IS NOT NULL OR gas_used IS NOT NULL OR blob_count IS NOT NULL))
           OR (status = 'canonical' AND gas_used IS NULL AND slot_start_date_time >= '2022-09-15 06:42:59')
      assertions:
        - type: equals
          column: bad_rows
          value: 0
