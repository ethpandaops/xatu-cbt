model: int_block_transaction_contract_gas
network: mainnet
external_data:
    canonical_execution_traces:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_traces.parquet
        network_column: meta_network_name
    canonical_execution_transaction:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_transaction.parquet
        network_column: meta_network_name
    canonical_execution_transaction_structlog_agg:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_transaction_structlog_agg.parquet
        network_column: meta_network_name
assertions:
    - name: Row count should be greater than zero
      sql: |
        SELECT COUNT(*) AS row_count FROM int_block_transaction_contract_gas FINAL
      assertions:
        - type: greater_than
          column: row_count
          value: 0
    - name: Contract gas adds up to the gas of frames with a target and call type
      sql: |
        SELECT COUNT(*) AS bad_rows
        FROM (SELECT block_number, sum(gas) AS g FROM int_block_transaction_contract_gas FINAL GROUP BY block_number) AS t
        FULL OUTER JOIN (
            SELECT block_number, sum(gas) AS g FROM int_transaction_call_frame FINAL
            WHERE target_address IS NOT NULL AND (call_type != '' OR call_frame_id = 0) GROUP BY block_number HAVING g > 0
        ) AS f USING (block_number)
        WHERE t.g != f.g
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: No contract without gas
      sql: |
        SELECT COUNT(*) AS bad_rows FROM int_block_transaction_contract_gas FINAL WHERE gas = 0
      assertions:
        - type: equals
          column: bad_rows
          value: 0
