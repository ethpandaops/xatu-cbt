model: int_transaction_call_frame
network: mainnet
external_data:
    canonical_execution_traces:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_traces.parquet
        network_column: meta_network_name
    canonical_execution_transaction:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_transaction.parquet
        network_column: meta_network_name
    canonical_execution_transaction_structlog_agg:
        url: https://data.ethpandaops.io/xatu-cbt/tests/mainnet/int_transaction_resource_gas_canonical_execution_transaction_structlog_agg.parquet
        network_column: meta_network_name
assertions:
    - name: Root frames exist
      sql: |
        SELECT COUNT(*) AS root_frames FROM int_transaction_call_frame FINAL
        WHERE call_frame_id = 0
      assertions:
        - type: greater_than
          column: root_frames
          value: 0
    - name: Calldata floor is set on root frames only (all test blocks are after Prague)
      sql: |
        SELECT
          countIf(call_frame_id = 0 AND calldata_floor_gas IS NULL) AS missing_root,
          countIf(call_frame_id != 0 AND calldata_floor_gas IS NOT NULL) AS set_on_child
        FROM int_transaction_call_frame FINAL
      assertions:
        - type: equals
          column: missing_root
          value: 0
        - type: equals
          column: set_on_child
          value: 0
    - name: No receipt is below its calldata floor
      sql: |
        SELECT COUNT(*) AS bad_rows FROM int_transaction_call_frame FINAL
        WHERE call_frame_id = 0 AND receipt_gas_used < calldata_floor_gas
      assertions:
        - type: equals
          column: bad_rows
          value: 0
    - name: Some transactions with calldata pay exactly the floor
      sql: |
        SELECT COUNT(*) AS floor_priced FROM int_transaction_call_frame FINAL
        WHERE call_frame_id = 0 AND calldata_floor_gas > 21000 AND receipt_gas_used = calldata_floor_gas
      assertions:
        - type: greater_than
          column: floor_priced
          value: 0
